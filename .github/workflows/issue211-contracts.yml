name: Stable termination contracts
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['review/**']
    paths:
      - 'Source/DafnyCore/Resolver/ModularTermination.cs'
      - 'Source/IntegrationTests/ModularTerminationContractTests.cs'
      - '.github/review/source-contracts-identity.py'
      - '.github/review/milestone-scope.py'
      - '.github/review/test_milestone_identity.py'
      - '.github/workflows/issue211-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_PROCESSOR_COUNT: '2'
  MSBUILDDISABLENODEREUSE: '1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  milestone-scope:
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    outputs:
      integer_bitwise: ${{ steps.scope.outputs.integer_bitwise }}
      source_contracts: ${{ steps.scope.outputs.source_contracts }}
      base: ${{ steps.scope.outputs.base }}
      candidate: ${{ steps.scope.outputs.candidate }}
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 360
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 360
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@18b15fb544432352965a832a1e4cdad4374acf10
        with:
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS || '2' }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
      - uses: ./.github/actions/fetch-refs
        if: github.event_name == 'pull_request'
        with:
          full-history: 'true'
          refs: |
            ${{ github.event.pull_request.base.sha }}
            ${{ github.event.pull_request.head.sha }}
      - name: Scope milestone identity checks
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        timeout-minutes: 360
        run: python3 .github/review/milestone-scope.py --event "$EVENT" --base "$BASE" --head "$HEAD"
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  products:
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.milestone-scope.outputs.source_contracts == 'true') }}
    needs: milestone-scope
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    strategy:
      max-parallel: 1
      matrix:
        product: [base, candidate]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 360
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 360
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@18b15fb544432352965a832a1e4cdad4374acf10
        with:
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS || '2' }}
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.product == 'base' && needs.milestone-scope.outputs.base || needs.milestone-scope.outputs.candidate }}
          path: product
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build under identical display metadata
        working-directory: product
        timeout-minutes: 360
        run: |
          sh Scripts/fetch-boogie-packages.sh
          dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o ../out/dafny \
            -p:GeneratePackageOnBuild=false -p:SourceRevisionId=fcb2042d.review.identity
          git rev-parse HEAD > ../out/source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: identity-${{ matrix.product }}
          path: out
          retention-days: 14
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  identity:
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.milestone-scope.outputs.source_contracts == 'true') }}
    needs: [milestone-scope, products]
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {kind: suite, shard: '0/4', source: Source/IntegrationTests/TestFiles/LitTests/LitTest}
          - {kind: suite, shard: '1/4', source: Source/IntegrationTests/TestFiles/LitTests/LitTest}
          - {kind: suite, shard: '2/4', source: Source/IntegrationTests/TestFiles/LitTests/LitTest}
          - {kind: suite, shard: '3/4', source: Source/IntegrationTests/TestFiles/LitTests/LitTest}
          - {kind: std, shard: '0/1', source: Source/DafnyStandardLibraries}
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 180
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 180
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@18b15fb544432352965a832a1e4cdad4374acf10
        with:
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS || '2' }}
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.milestone-scope.outputs.candidate }}
          path: sources
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: identity-base
          path: products/base
      - uses: actions/download-artifact@v4
        with:
          name: identity-candidate
          path: products/candidate
      - name: Pin solver and prepare executables
        timeout-minutes: 180
        run: |
          curl -fsSLo solver.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-arm64-osx-13.3.zip
          echo '81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db  solver.zip' | shasum -a 256 -c -
          unzip -q solver.zip -d solver
          chmod +x products/*/dafny/Dafny solver/*/bin/z3
      - name: Compare exact outputs and resource units under matching options
        # Both current products already include the default termination rules.
        # Historical dispatch compares the original opt-in milestone with identical flags too.
        timeout-minutes: 180
        run: |
          python3 .github/review/source-contracts-identity.py '${{ matrix.kind }}' \
            products/base/dafny/Dafny products/candidate/dafny/Dafny solver/*/bin/z3 \
            'sources/${{ matrix.source }}' identity-results --shard '${{ matrix.shard }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identity-${{ matrix.kind }}-${{ strategy.job-index }}
          path: identity-results
          retention-days: 30
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac
