name: Canonical map payload comparison
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  DOTNET_PROCESSOR_COUNT: '2'
  DOTNET_NOLOGO: 'true'
  # Self-hosted runners: no build process outlives the job (MSBuild nodes, Gradle daemons).
  MSBUILDDISABLENODEREUSE: '1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  Z3_RELEASE: https://github.com/Z3Prover/z3/releases/download/z3-5.1.0
  Z3_ARCHIVE: z3-5.1.0-arm64-osx-13.3
  Z3_SHA256: 81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 45
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 45
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@27608201c3b3c06582a8591fb394035b3e15ed98
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
          heavy-wait-max-s: ${{ vars.SELF_HOSTED_JOB_HEAVY_WAIT_MAX_S }}
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Remove untracked checkout state
        shell: bash
        timeout-minutes: 10
        run: git clean -ffdx
      - uses: actions/checkout@v4
        with:
          # The stack's pre-map product includes the character repair.
          ref: a220fed05038ff4c70ac325d29b7c0a5238ba0e7
          path: baseline
          clean: false
      - name: Remove untracked checkout state
        shell: bash
        timeout-minutes: 10
        working-directory: baseline
        run: git clean -ffdx
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check comparison bookkeeping
        timeout-minutes: 45
        run: python3 -m unittest discover -s .github/review -p test_typeencoding_comparisons.py
      - name: Build candidate and pre-fix product with identical version metadata
        timeout-minutes: 45
        run: |
          sh Scripts/fetch-boogie-packages.sh
          dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o out/candidate -p:GeneratePackageOnBuild=false -p:SourceRevisionId=typeencoding-map-comparison
          cd baseline
          sh Scripts/fetch-boogie-packages.sh
          dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o ../out/baseline -p:GeneratePackageOnBuild=false -p:SourceRevisionId=typeencoding-map-comparison
      - name: Pin solver
        timeout-minutes: 45
        run: |
          curl -fsSLo z3.zip "$Z3_RELEASE/$Z3_ARCHIVE.zip"
          echo "$Z3_SHA256  z3.zip" | shasum -a 256 -c -
          unzip -q z3.zip
      - name: Check old-source versus legacy byte identity
        timeout-minutes: 45
        run: |
          python3 .github/review/typeencoding-map.py identity --baseline out/baseline/Dafny --dafny out/candidate/Dafny \
            --z3 "$Z3_ARCHIVE/bin/z3" --output identity
          echo '## Old-source / legacy byte identity' >> "$GITHUB_STEP_SUMMARY"
          cat identity/identity.json >> "$GITHUB_STEP_SUMMARY"
      - name: Iset equality and false controls
        timeout-minutes: 45
        run: |
          mkdir -p controls
          python3 .github/review/typeencoding-map.py controls --dafny out/candidate/Dafny \
            --z3 "$Z3_ARCHIVE/bin/z3" --output controls
      - name: Replay erased negative iset contexts
        timeout-minutes: 45
        run: |
          python3 .github/review/typeencoding-map.py negative --dafny out/candidate/Dafny \
            --z3 "$Z3_ARCHIVE/bin/z3" --output controls/negative
      - run: tar -C out -czf candidate.tar.gz candidate
      - uses: ./.github/actions/host-artifact
        with:
          mode: put
          name: map-candidate
          path: candidate.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-identity
          path: |
            identity
            controls
          retention-days: 90
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  suite:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: build
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        axioms: ['off', 'on']
        shard: [0, 1, 2, 3]
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 240
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 240
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@27608201c3b3c06582a8591fb394035b3e15ed98
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
          heavy-wait-max-s: ${{ vars.SELF_HOSTED_JOB_HEAVY_WAIT_MAX_S }}
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Remove untracked checkout state
        shell: bash
        timeout-minutes: 10
        run: git clean -ffdx
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/host-artifact
        with:
          mode: get
          name: map-candidate
      - run: mkdir -p out && tar -C out -xzf candidate.tar.gz
      - name: Pin solver
        timeout-minutes: 240
        run: |
          curl -fsSLo z3.zip "$Z3_RELEASE/$Z3_ARCHIVE.zip"
          echo "$Z3_SHA256  z3.zip" | shasum -a 256 -c -
          unzip -q z3.zip
      - name: Record suite verdicts, proof outcomes and resources
        timeout-minutes: 240
        run: |
          # Each invocation is unchanged; grouping retains the artifact layout.
          for comparison_mode in default legacy; do
            for comparison_shard in ${{ matrix.shard }}; do
              python3 .github/review/typeencoding-map.py record suite --mode "$comparison_mode" --axioms '${{ matrix.axioms }}' \
                --shard "$comparison_shard/4" --dafny out/candidate/Dafny --z3 "$Z3_ARCHIVE/bin/z3" \
                --output "results/suite-${{ matrix.axioms }}-$comparison_mode-$comparison_shard"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-${{ matrix.axioms }}-${{ matrix.shard }}-compact
          path: |
            results/*/verdicts.tsv
            results/*/proofs.json
            results/*/plan.tsv
            results/*/source.json
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-suite-${{ matrix.axioms }}-${{ matrix.shard }}
          path: results/*/measurements
          compression-level: 9
          retention-days: 90
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  std:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: build
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 180
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 180
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@27608201c3b3c06582a8591fb394035b3e15ed98
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
          heavy-wait-max-s: ${{ vars.SELF_HOSTED_JOB_HEAVY_WAIT_MAX_S }}
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Remove untracked checkout state
        shell: bash
        timeout-minutes: 10
        run: git clean -ffdx
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/host-artifact
        with:
          mode: get
          name: map-candidate
      - run: mkdir -p out && tar -C out -xzf candidate.tar.gz
      - name: Pin solver
        timeout-minutes: 180
        run: |
          curl -fsSLo z3.zip "$Z3_RELEASE/$Z3_ARCHIVE.zip"
          echo "$Z3_SHA256  z3.zip" | shasum -a 256 -c -
          unzip -q z3.zip
      - name: Record standard-library verdicts and resources
        timeout-minutes: 180
        run: |
          for comparison_solver in 5.1.0; do
            comparison_z3="$PWD/$Z3_ARCHIVE/bin/z3"
            for comparison_axioms in off on; do
              for comparison_mode in default legacy; do
                python3 .github/review/typeencoding-map.py record std --mode "$comparison_mode" --axioms "$comparison_axioms" \
                  --dafny out/candidate/Dafny --z3 "$comparison_z3" \
                  --output "results/std-$comparison_axioms-$comparison_solver-$comparison_mode"
              done
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: std-all
          path: results
          compression-level: 9
          retention-days: 90
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  report:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: [suite, std]
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 15
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 15
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@27608201c3b3c06582a8591fb394035b3e15ed98
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
          heavy-wait-max-s: ${{ vars.SELF_HOSTED_JOB_HEAVY_WAIT_MAX_S }}
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Remove untracked checkout state
        shell: bash
        timeout-minutes: 10
        run: git clean -ffdx
      - uses: actions/download-artifact@v4
        with:
          pattern: suite-*
          path: measurements
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: std-*
          path: measurements
          merge-multiple: true
      - name: List every changed verdict and resource totals
        timeout-minutes: 15
        run: |
          python3 .github/review/typeencoding-map.py compare --input measurements --output comparison
          cat comparison/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-comparison
          path: comparison
          retention-days: 90
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac
