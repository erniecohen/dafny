name: Issue 23 baseline registration probe
on:
  push:
    branches: ['scratch/23-review-registration']
permissions:
  contents: read
  actions: read
jobs:
  registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: dafny
          run-id: 43112214794
          github-token: ${{ github.token }}
      - name: Unpack and pin Z3
        run: |
          mkdir out
          tar -C out -xzf dafny.tar.gz
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          unzip -q z3.zip
      - name: Record only the seven new rows in both axiom modes
        run: |
          python3 - <<'PYCODE'
          import contextlib, hashlib, importlib.util, json, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('lit', '.github/review/lit-verdicts.py')
          lit = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(lit)
          root = Path.cwd()
          out = root / 'registration'
          out.mkdir()
          source = root / 'Source/IntegrationTests/TestFiles/LitTests/LitTest'
          solver = root / 'z3-5.1.0-x64-glibc-2.39/bin/z3'
          lit.plan(str(source), str(out / 'all-plan.tsv'))
          selected = [r for r in (out / 'all-plan.tsv').read_text().splitlines() if r.startswith('git-issues/github-issue-23-')]
          assert len(selected) == 7
          plan = out / 'plan.tsv'
          plan.write_text('\n'.join(selected) + '\n')
          expected = {'box-bad': ['4', '1 verified, 1 error', '14'],
                      'constant': ['0', '1 verified, 0 errors', ''],
                      'glue': ['4', '0 verified, 1 error', '9'],
                      'lambda': ['4', '1 verified, 1 error', '11'],
                      'lambda-cost': ['0', '1 verified, 0 errors', ''],
                      'ordinal-subset': ['0', '1 verified, 0 errors', ''],
                      'ordinal-undefined': ['4', '0 verified, 2 errors', '8,9']}
          expected = {'git-issues/github-issue-23-' + k + '.dfy': v for k, v in expected.items()}
          manifest = {'source': os.environ['GITHUB_SHA'], 'build_run': 43112214794,
                      'solver_sha256': hashlib.sha256(solver.read_bytes()).hexdigest(),
                      'fixtures': {k: hashlib.sha256((source / k).read_bytes()).hexdigest() for k in expected}}
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          for mode in ['off', 'on']:
              dest = out / mode
              dest.mkdir()
              actual = dest / 'new-verdicts.tsv'
              lit.run(str(plan), str(source), str(root / 'out/dafny/Dafny'), str(solver), str(actual),
                      additional_axioms=mode == 'on', measurements=str(dest / 'measurements'))
              observed = lit.load(str(actual))
              assert {k: v[1:4] for k, v in observed.items()} == expected
              baseline = root / ('.github/review/expected-verdicts' + ('-additional-axioms' if mode == 'on' else '') + '.tsv')
              old = lit.load(str(baseline))
              assert not (old.keys() & observed.keys())
              merged = {**old, **observed}
              target = dest / 'expected-verdicts.tsv'
              target.write_text(''.join('\t'.join(merged[k][:4]) + '\n' for k in sorted(merged)))
              with (dest / 'comparison.txt').open('w') as stream, contextlib.redirect_stdout(stream):
                  differences = lit.compare(str(baseline), str(target))
              assert differences == 7
              print((dest / 'comparison.txt').read_text())
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue23-registration
          path: registration
          retention-days: 90
