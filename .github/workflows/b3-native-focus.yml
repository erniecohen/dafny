# Scratch-only: no legacy-solver verification and no release publication.
name: b3-native-focus
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  focus:
    name: Native translation and pruning lifecycle compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DAFNY_INTEGRATION_TESTS_ONLY_COMPILERS: cs
      Z3_RELEASE: https://github.com/Z3Prover/z3/releases/download/z3-5.1.0
      Z3_ARCHIVE: z3-5.1.0-x64-glibc-2.39
      Z3_SHA256: f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: b07c038737d6713b6d1a5848d7568bdc972de7dd
          path: baseline
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pinned solver
        run: |
          curl -fsSLo z3.zip "$Z3_RELEASE/$Z3_ARCHIVE.zip"
          echo "$Z3_SHA256  z3.zip" | sha256sum -c -
          unzip -q z3.zip && chmod +x "$Z3_ARCHIVE/bin/z3"
          echo "Z3=$PWD/$Z3_ARCHIVE/bin/z3" >> "$GITHUB_ENV"
          mkdir -p Binaries/z3/bin
          cp "$Z3_ARCHIVE/bin/z3" Binaries/z3/bin/z3-5.1.0
          ln -s z3-5.1.0 Binaries/z3/bin/z3-4.12.1
          Binaries/z3/bin/z3-5.1.0 --version
      - name: Build candidate and original baseline
        run: |
          sh Scripts/fetch-boogie-packages.sh
          sh .github/review/version.sh | tee version.txt
          revision=$(sed -n 's/^revision=//p' version.txt)
          dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/candidate -p:SourceRevisionId="$revision"
          cd baseline
          sh Scripts/fetch-boogie-packages.sh
          dotnet publish Source/Dafny/Dafny.csproj -c Release -o ../out/baseline
      - uses: actions/download-artifact@v4
        with:
          name: dafny
          run-id: 37182760834
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: previous
      - name: Unpack previous candidate
        run: mkdir -p out/previous && tar -C out/previous -xzf previous/dafny.tar.gz
      - name: Neutral result and completion contracts
        run: dotnet test Source/DafnyCore.Test -c Release --filter FullyQualifiedName~VerificationContractsTest --logger "trx;LogFileName=neutral.trx"
      - name: Native harness including translator errors
        run: dotnet test Source/IntegrationTests -c Release --filter "DisplayName~git-issue-118.dfy" --logger "trx;LogFileName=native.trx"
      - name: Compare existing Fuel program and unchanged library declarations
        run: |
          python3 .github/review/b3-native-focus.py --candidate out/candidate/Dafny \
            --baseline out/baseline/Dafny --previous out/previous/dafny/Dafny \
            --solver "$Z3" --output native-focus
          cat native-focus/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-focus
          path: |
            native-focus
            Source/DafnyCore.Test/TestResults/*.trx
            Source/IntegrationTests/TestResults/*.trx
          retention-days: 90
