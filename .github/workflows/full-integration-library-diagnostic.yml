name: Full integration library diagnosis
on:
  push:
    branches: ['scratch/codex/full-main-to-dev-probes']
    paths: ['.github/workflows/full-integration-library-diagnostic.yml']
  workflow_dispatch:
    inputs:
      repair-only:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  library:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON((github.event_name == 'push' || inputs.repair-only) && '["integrated"]' || '["dev-baseline","supported-reference","integrated"]') }}
        solver: ['5.1', '4.16']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: integration-build-${{ matrix.source }}
          run-id: ${{ matrix.source == 'integrated' && '38139291400' || '38137142292' }}
          github-token: ${{ github.token }}
          path: out/download
      - name: Install immutable compiler and authorized solver
        run: |
          mkdir -p out/toolchain
          tar -C out/toolchain -xzf out/download/dafny.tar.gz
          if [ '${{ matrix.solver }}' = '5.1' ]; then
            curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
            echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
            unzip -q z3.zip
            echo "Z3=$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" >> "$GITHUB_ENV"
          else
            curl -fsSLo z3.zip https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-4.16.0-x64-ubuntu-24.04-bin.zip
            echo '87de9c9e86c877abfccb00cf24b946c4a1bda7b9cba6f363ea58311d2573c320  z3.zip' | sha256sum -c -
            unzip -q z3.zip -d out/z3-4.16
            chmod +x out/z3-4.16/z3-4.16.0
            echo "Z3=$PWD/out/z3-4.16/z3-4.16.0" >> "$GITHUB_ENV"
          fi
      - name: Record every actual library outcome
        env:
          COMPILER_SOURCE: ${{ matrix.source }}
          REPAIR_ONLY: ${{ github.event_name == 'push' || inputs.repair-only }}
        run: python3 .github/review/full-integration-library-diagnostic.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-library-diagnostic-${{ matrix.source }}-${{ matrix.solver }}
          path: out/library-evidence
          retention-days: 14
