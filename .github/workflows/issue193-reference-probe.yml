# Focused reference-model preparation. Expected new-verdict differences are
# recorded as data and do not notify the owner as workflow failures.
name: integer-bitwise-reference-probe
on:
  push:
    branches: ['scratch/193-reference-model/probe']
  workflow_dispatch:
    inputs:
      revision:
        description: Exact candidate revision to build and prove (empty uses the workflow revision)
        type: string
        default: ''
permissions:
  contents: read
env:
  DOTNET_PROCESSOR_COUNT: '2'
  DOTNET_NOLOGO: 'true'
  # Self-hosted runners: no build process outlives the job (MSBuild nodes, Gradle daemons).
  MSBUILDDISABLENODEREUSE: '1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  Z3_RELEASE: https://github.com/Z3Prover/z3/releases/download/z3-5.1.0
  Z3_MACOS_ARM64: z3-5.1.0-arm64-osx-13.3
  Z3_MACOS_ARM64_SHA256: 81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db
  HARNESS_Z3_RELEASE: https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03
  HARNESS_Z3_4_12_1_SHA256: 5941a521e8868db9b57ed81d1cc0cc408b37e55443087bcb6eb207583b47183f
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 360
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 360
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@d29ade2d1be8c8ec371abf1e605743600e67be0e
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: ./.github/actions/setup-dotnet
      - name: Record candidate source
        timeout-minutes: 360
        run: git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Build candidate
        timeout-minutes: 360
        run: |
          sh Scripts/fetch-boogie-packages.sh
          sh .github/review/version.sh > version.txt
          . ./version.txt
          dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:GeneratePackageOnBuild=false -p:SourceRevisionId="$revision"
          tar -C out -czf dafny.tar.gz dafny
      - uses: ./.github/actions/host-artifact
        with:
          mode: put
          name: issue193-dafny
          path: dafny.tar.gz
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  integer-bitwise-reference:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    name: Integer bitwise reference (Z3 ${{ matrix.z3 }}, ${{ matrix.resolver }})
    needs: build
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        z3: ['5.1.0', 'of the tests']
        resolver: ['legacy', 'refreshed']
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 30
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 30
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@d29ade2d1be8c8ec371abf1e605743600e67be0e
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/host-artifact
        with:
          mode: get
          name: issue193-dafny
      - name: Unpack Dafny
        timeout-minutes: 30
        run: mkdir -p out && tar -C out -xzf dafny.tar.gz
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: identity-gate
          sparse-checkout: .github/review
      - name: Check historical M1 identity
        timeout-minutes: 30
        run: |
          cp identity-gate/.github/review/issue193-identity.py .github/review/issue193-identity.py
          git fetch --no-tags --refmap= --depth=2 origin 25203d9115f8f104b325c8a058bf41051bdbbe69
          python3 .github/review/issue193-identity.py reference-results/identity
      - name: Pinned solver
        timeout-minutes: 30
        run: |
          if [ '${{ matrix.z3 }}' = 5.1.0 ]; then
            curl -fsSLo z3.zip "$Z3_RELEASE/$Z3_MACOS_ARM64.zip"
            echo "$Z3_MACOS_ARM64_SHA256  z3.zip" | shasum -a 256 -c -
            unzip -q z3.zip
            chmod +x "$Z3_MACOS_ARM64/bin/z3"
            echo "Z3=$PWD/$Z3_MACOS_ARM64/bin/z3" >> "$GITHUB_ENV"
          else
            v=$(sed -n 's/.*DefaultZ3Version = "\(.*\)";.*/\1/p' Source/DafnyCore/DafnyOptions.cs)
            test "$v" = 4.12.1
            curl -fsSLo z3h.zip "$HARNESS_Z3_RELEASE/z3-$v-arm64-macos-15-bin.zip"
            echo "$HARNESS_Z3_4_12_1_SHA256  z3h.zip" | shasum -a 256 -c -
            mkdir -p z3h && unzip -q z3h.zip -d z3h
            chmod +x "z3h/z3-$v"
            echo "Z3=$PWD/z3h/z3-$v" >> "$GITHUB_ENV"
          fi
      - name: Prove bodies, measure width clients and reject live false controls
        timeout-minutes: 30
        run: |
          set +e
          python3 .github/review/issue193-reference.py --dafny "$PWD/out/dafny/Dafny" \
            --z3 "$Z3" --resolver '${{ matrix.resolver }}' --output reference-results/proofs
          status=$?
          echo "Proof probe exit: $status (see artifact; this probe is not an acceptance gate)." >> "$GITHUB_STEP_SUMMARY"
          if [ -f reference-results/proofs/summary.md ]; then cat reference-results/proofs/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0
      - name: Record the new fixture verdict and expected baseline difference
        if: matrix.z3 == '5.1.0' && matrix.resolver == 'legacy'
        timeout-minutes: 30
        run: |
          python3 .github/review/issue193-verdict-probe.py "$PWD/out/dafny/Dafny" "$Z3" reference-results/verdict-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integer-bitwise-reference-${{ matrix.z3 }}-${{ matrix.resolver }}
          path: reference-results
          retention-days: 90
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac
