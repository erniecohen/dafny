name: Issue 110 incremental probe
on:
  push:
    branches: ['scratch/codex/110-incremental']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  incremental:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Pinned solver and backend
        run: |
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          unzip -q z3.zip
          echo "Z3=$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" >> "$GITHUB_ENV"
          sh Scripts/fetch-boogie-packages.sh
      - name: Record strict regression outcomes
        run: |
          mkdir -p results
          set +e
          dotnet test Source/DafnyLanguageServer.Test -c Release --filter FullyQualifiedName~IncrementalBitvectorMembersTest --logger 'console;verbosity=normal' --logger trx --results-directory results > results/console.log 2>&1
          status=$?
          echo "$status" > results/process-exit.txt
          tail -80 results/console.log
          echo "Incremental regression process exit: $status. Inspect the artifact; workflow status only confirms capture." >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Record baseline counterfactual
        run: |
          mkdir -p baseline-results
          git fetch --no-tags --depth=1 origin 8b9635e3d48b94c1a5875f0f2e0a772d9131900b
          git restore --source=8b9635e3d48b94c1a5875f0f2e0a772d9131900b -- Source/DafnyCore/Resolver/ProgramResolver.cs Source/DafnyLanguageServer/Language/CachingResolver.cs
          set +e
          dotnet test Source/DafnyLanguageServer.Test -c Release --filter FullyQualifiedName~IncrementalBitvectorMembersTest --logger 'console;verbosity=normal' --logger trx --results-directory baseline-results > baseline-results/console.log 2>&1
          status=$?
          echo "$status" > baseline-results/process-exit.txt
          tail -80 baseline-results/console.log
          echo "Baseline counterfactual exit: $status (expected regression failures)." >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue110-incremental
          path: |
            results
            baseline-results
