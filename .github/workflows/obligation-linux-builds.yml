name: Obligation Linux probe binaries
on:
  workflow_dispatch:
  push:
    branches: [scratch/codex/issue100-review]
    paths: [.github/workflows/obligation-linux-builds.yml]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.mode == 'baseline' && 'ab210b78b50adb5a192542897f0a00cdb40f3c35' || github.sha }}
      - uses: ./.github/actions/setup-dotnet
      - name: Capture binaries and structural checks without solver execution
        run: |
          set +e
          mkdir -p out
          git rev-parse HEAD > out/source.txt
          sh Scripts/fetch-boogie-packages.sh > out/packages.log 2>&1
          echo "$?" > out/packages.exit
          sh .github/review/version.sh > out/version.txt 2>&1
          echo "$?" > out/version.exit
          if [ "$(cat out/version.exit)" = 0 ]; then
            revision=$(sed -n 's/^revision=//p' out/version.txt)
            RUNTIME_IDENTIFIER=linux-x64 dotnet publish Source/Dafny/Dafny.csproj -c Release -r linux-x64 --self-contained -o out/dafny -p:GeneratePackageOnBuild=false -p:SourceRevisionId="$revision" > out/build.log 2>&1
            echo "$?" > out/build.exit
            if [ '${{ matrix.mode }}' = candidate ]; then
              dotnet test Source/DafnyCore.Test -c Release --filter FullyQualifiedName~Obligation > out/core-inventory-gate.log 2>&1
              echo "$?" > out/core-inventory-gate.exit
              dotnet build Source/DafnyLanguageServer.Test -c Release > out/editor-build.log 2>&1
              echo "$?" > out/editor-build.exit
              mkdir -p out/tests
              cp -R Source/DafnyCore.Test/bin/Release/net10.0 out/tests/core
              cp -R Source/DafnyLanguageServer.Test/bin/Release/net10.0 out/tests/editor
              curl -fsSLo dotnet-install.sh https://dot.net/v1/dotnet-install.sh
              bash dotnet-install.sh --version 10.0.100 --architecture x64 --os linux --install-dir out/sdk > out/sdk.log 2>&1
              echo "$?" > out/sdk.exit
            fi
          fi
          rm -f out/dafny/*.pdb
          tar -czf obligation-linux-x64.tar.gz out
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obligation-linux-${{ matrix.mode }}
          path: obligation-linux-x64.tar.gz
          retention-days: 30
