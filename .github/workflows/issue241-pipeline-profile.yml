name: Issue 241 pipeline profile

# For https://github.com/erniecohen/dafny/issues/241, milestone D0: runs the standard library
# with and without --pipeline-profile, alternating, and records that the output is
# byte-identical, the option's overhead, and a summary of the profile (the stages, per-module
# translation and Boogie preparation, task queue waits and solves, and the stretches after
# resolution with no solver task running).  The summary is in the job summary; the profiles,
# outputs, process samples and run table are in the artifact.  The driver exits 1, and the
# job fails, only if a profiled run's output or exit code differs from an unprofiled run's.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['review/**']
    paths:
      - '.github/review/pipeline-profile.py'
      - '.github/workflows/issue241-pipeline-profile.yml'
      - 'Source/DafnyCore/Pipeline/PipelineProfile.cs'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project or file to verify, relative to the repository'
        default: 'Source/DafnyStandardLibraries/src/Std/dfyconfig.toml'
      cores:
        description: 'Value of --cores'
        default: '2'
      repeat:
        description: 'Runs with, and runs without, the option'
        default: '2'
      server_gc:
        description: 'DOTNET_gcServer (0 or 1)'
        default: '0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_PROCESSOR_COUNT: '2'
  DOTNET_NOLOGO: 'true'
  # Self-hosted runners: no build process outlives the job (MSBuild nodes, Gradle daemons).
  MSBUILDDISABLENODEREUSE: '1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  Z3_RELEASE: https://github.com/Z3Prover/z3/releases/download/z3-5.1.0
  Z3_MACOS_ARM64: z3-5.1.0-arm64-osx-13.3
  Z3_MACOS_ARM64_SHA256: 81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db

jobs:
  profile:
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'erniecohen/dafny')))) }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 180
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 180
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@4793c6ec33216941dc4b6c9352a329cf2536c996
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
          heavy-wait-max-s: ${{ vars.SELF_HOSTED_JOB_HEAVY_WAIT_MAX_S }}
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Remove untracked checkout state
        shell: bash
        timeout-minutes: 10
        run: git clean -ffdx
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Boogie packages
        timeout-minutes: 180
        run: sh Scripts/fetch-boogie-packages.sh
      - name: Build
        timeout-minutes: 180
        run: dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:GeneratePackageOnBuild=false
      - name: Z3
        timeout-minutes: 180
        run: |
          solver=$(sh .github/review/setup-z3.sh)
          echo "Z3=$solver" >> "$GITHUB_ENV"
      - name: Profile
        env:
          PROJECT: ${{ inputs.project || 'Source/DafnyStandardLibraries/src/Std/dfyconfig.toml' }}
          CORES: ${{ inputs.cores || '2' }}
          REPEAT: ${{ inputs.repeat || '2' }}
          DOTNET_gcServer: ${{ inputs.server_gc || '0' }}
        timeout-minutes: 180
        run: |
          case "$CORES" in
            1|2) ;;
            *) echo 'The shared CI pool permits --cores 1 through 2'; exit 1 ;;
          esac
          python3 .github/review/pipeline-profile.py run --dafny "$PWD/out/dafny/Dafny" --out profile \
            --repeat "$REPEAT" -- --solver-path "$Z3" --cores "$CORES" --verification-time-limit 0 \
            --boogie /deterministicLiteralHashes:1 --boogie /restartProver "$PROJECT"
      - name: Job summary
        if: always()
        timeout-minutes: 180
        run: |
          {
            echo "Runner: $(python3 -c 'import os; print(os.cpu_count())') processors; .NET cap: $DOTNET_PROCESSOR_COUNT."
            echo
            cat profile/summary.md || echo "no summary"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-pipeline-profile
          path: profile
          retention-days: 30
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac
