name: Issue 241 front-end profile

# For https://github.com/erniecohen/dafny/issues/241, milestone D1: front-end measurements with the
# front-end events of --pipeline-profile, driven by .github/review/frontend-profile.py.  Each
# measurement job runs its whole protocol on one runner (a warm-up round, discarded, then REPS
# rounds of every configuration in a shuffled order), so comparisons between configurations are
# paired.  Front-end quantities come from `dafny resolve`, or from `dafny verify` with Boogie's
# no-op solver: no solver time enters them.  The analysis job writes the tables to the job
# summary and uploads them with every CSV and raw profile. The driver checks each round's
# output digest and exit code against OFF and fails on missing observations.
# .github/review/frontend-profile-local.sh
# runs the same protocol on one machine (for core-count scaling).

on:
  # A workflow that is not yet on the default branch cannot be dispatched; pushing a branch
  # named like this runs it.
  push:
    branches: ['scratch/issue-241-frontend-run*']
  workflow_dispatch:
    inputs:
      reps:
        description: 'Measured rounds per configuration (after one warm-up round)'
        default: '10'
      seed:
        description: 'Seed of the per-round order'
        default: '1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_PROCESSOR_COUNT: '2'
  DOTNET_NOLOGO: 'true'
  # Self-hosted runners: no build process outlives the job (MSBuild nodes, Gradle daemons).
  MSBUILDDISABLENODEREUSE: '1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  REPS: ${{ inputs.reps || '10' }}
  SEED: ${{ inputs.seed || '1' }}
  SCRIPT: .github/review/frontend-profile.py

jobs:
  build:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 360
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 360
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@27608201c3b3c06582a8591fb394035b3e15ed98
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Remove untracked checkout state
        shell: bash
        timeout-minutes: 10
        run: git clean -ffdx
      - uses: ./.github/actions/setup-dotnet
      - name: Boogie packages
        timeout-minutes: 360
        run: sh Scripts/fetch-boogie-packages.sh
      - name: Build
        timeout-minutes: 360
        run: dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:GeneratePackageOnBuild=false
      - uses: ./.github/actions/host-artifact
        with:
          mode: put
          name: dafny
          path: out/dafny
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  measure:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: build
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Std, resolution only, both GC modes; profile off, on, and on with GC events.
          - name: std-resolve
            run: >-
              run --corpus std-resolve --command resolve --cores 2 --project Source/DafnyStandardLibraries/src/Std/dfyconfig.toml
              --configs ws-default-off,ws-default-on,ws-default-gcev,srv-default-off,srv-default-on,srv-default-gcev
          # DafnyCore's Dafny project (the Dafny and Rust back ends, on the Std .doo).
          - name: core-resolve
            run: >-
              run --corpus core-resolve --command resolve --cores 2 --project Source/DafnyCore/dfyconfig.toml
              --configs ws-default-off,ws-default-on,ws-default-gcev,srv-default-off,srv-default-on,srv-default-gcev
          # Std's examples, a project on the Std .doo.
          - name: examples-resolve
            run: >-
              run --corpus examples-resolve --command resolve --cores 2 --project Source/DafnyStandardLibraries/examples/dfyconfig.toml
              --configs ws-default-off,ws-default-on,ws-default-gcev,srv-default-off,srv-default-on,srv-default-gcev
          # Std through translation and Boogie's preparation, no-op solver.
          - name: std-translate
            run: >-
              run --corpus std-translate --command verify --cores 2 --project Source/DafnyStandardLibraries/src/Std/dfyconfig.toml
              --configs ws-default-off,ws-default-on,srv-default-off,srv-default-on
          # The suite's multi-module programs under both resolvers, no-op solver, in three shards.
          - name: suite-0
            suite: '0/3'
          - name: suite-1
            suite: '1/3'
          - name: suite-2
            suite: '2/3'
          # Retention at module windows 1 and 4, and heap dumps at fixed points.
          - name: std-heap
            heap: Source/DafnyStandardLibraries/src/Std/dfyconfig.toml
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 330
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 330
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@27608201c3b3c06582a8591fb394035b3e15ed98
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Remove untracked checkout state
        shell: bash
        timeout-minutes: 10
        run: git clean -ffdx
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/host-artifact
        with:
          mode: get
          name: dafny
          path: out/dafny
      - name: Measure
        env:
          RUN: ${{ matrix.run }}
          SUITE: ${{ matrix.suite }}
          HEAP: ${{ matrix.heap }}
          NAME: ${{ matrix.name }}
        timeout-minutes: 330
        run: |
          chmod +x out/dafny/Dafny
          D="$PWD/out/dafny/Dafny"
          if [ -n "$RUN" ]; then
            # shellcheck disable=SC2086
            python3 "$SCRIPT" $RUN --dafny "$D" --out "results/$NAME" --reps "$REPS" --seed "$SEED"
          elif [ -n "$SUITE" ]; then
            L=Source/IntegrationTests/TestFiles/LitTests/LitTest
            python3 .github/review/lit-verdicts.py plan "$L" plan.tsv
            python3 "$SCRIPT" run --corpus "suite-${SUITE%/*}" --command verify --cores 2 --plan plan.tsv --litdir "$L" \
              --shard "$SUITE" --configs ws-legacy-off,ws-legacy-on,ws-refresh-off,ws-refresh-on \
              --dafny "$D" --out "results/$NAME" --reps "$REPS" --seed "$SEED"
          else
            dotnet tool install --tool-path "$TMPDIR/dotnet-tools" dotnet-gcdump --version 10.0.750501
            export PATH="$PATH:$TMPDIR/dotnet-tools"
            python3 "$SCRIPT" heap --corpus std --project "$HEAP" --windows 1,4 --reps 3 --cores 2 \
              --dafny "$D" --out "results/$NAME"
            python3 .github/review/retention-profile.py run --project "$HEAP" --windows 1 4 --reps 1 --cores 2 \
              --dafny "$D" --out "results/$NAME/body-release"
            python3 "$SCRIPT" gcdump --corpus std --project "$HEAP" --windows 1,4 --cores 2 \
              --points parsed,resolved,1,20,43,80 --dafny "$D" --out "results/$NAME"
            rm -f results/"$NAME"/gcdumps/*.gcdump.tmp
          fi
      - name: Job summary
        if: always()
        env:
          NAME: ${{ matrix.name }}
        timeout-minutes: 330
        run: |
          {
            echo "Runner: $(sysctl -n hw.logicalcpu) processors, $(($(sysctl -n hw.memsize) / 1073741824)) GB memory, $(uname -sr)."
            cat results/"$NAME"/identity-*.txt 2>/dev/null || true
            python3 "$SCRIPT" analyze "results/$NAME" --out "results/$NAME/report.md" > /dev/null && cat "results/$NAME/report.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-${{ matrix.name }}
          path: results
          retention-days: 30
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  analyze:
    needs: measure
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && (always()) }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 360
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 360
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@27608201c3b3c06582a8591fb394035b3e15ed98
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
        with:
          clean: false
      - name: Remove untracked checkout state
        shell: bash
        timeout-minutes: 10
        run: git clean -ffdx
      - uses: actions/download-artifact@v4
        with:
          pattern: frontend-*
          path: all
      - name: Analyze
        timeout-minutes: 360
        run: |
          python3 "$SCRIPT" analyze all --out report.md > /dev/null
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          mkdir -p csv
          for f in runs stages modules gc heap gcdump; do
            first=1
            find all -name "$f.csv" | sort | while read -r p; do
              if [ $first = 1 ]; then cat "$p"; first=0; else tail -n +2 "$p"; fi
            done > "csv/$f.csv"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-report
          path: |
            report.md
            csv
          retention-days: 30
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac
