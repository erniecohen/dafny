name: Resolution reuse reproduction
on:
  push:
    branches: ['scratch/c26/reproduction']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: dafny
          github-token: ${{ github.token }}
          run-id: 38173708929
      - name: Unpack baseline candidate
        run: mkdir -p out && tar -C out -xzf dafny.tar.gz
      - name: Pinned solver
        run: |
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          unzip -q z3.zip
      - name: Record generic filtered invocations
        run: |
          python3 .github/review/resolution-reuse-probe.py \
            "$PWD/out/dafny/Dafny" "$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" reproduction
          cat reproduction/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolution-reuse-reproduction
          path: reproduction
          retention-days: 90
