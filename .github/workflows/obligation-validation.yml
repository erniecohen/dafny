name: Obligation compatibility diagnostics
on:
  workflow_dispatch:
  push:
    branches: [scratch/codex/issue100-review]
    paths: [.github/workflows/obligation-validation.yml]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.mode == 'baseline' && 'ad1360af0f776c0be6cf57e4f0d38bbdf1ecc365' || github.sha }}
      - uses: ./.github/actions/setup-dotnet
      - name: Capture build outcome
        run: |
          mkdir -p out
          set +e
          sh Scripts/fetch-boogie-packages.sh > out/packages.log 2>&1
          echo "$?" > out/packages.exit
          sh .github/review/version.sh > out/version.txt 2>&1
          version_result=$?
          echo "$version_result" > out/version.exit
          if [ "$version_result" -eq 0 ]; then
            revision=$(sed -n 's/^revision=//p' out/version.txt)
            dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:GeneratePackageOnBuild=false -p:SourceRevisionId="$revision" > out/build.log 2>&1
            echo "$?" > out/build.exit
          fi
          git rev-parse HEAD > out/source.txt
          tar -czf build.tar.gz out
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: obligation-build-${{ matrix.mode }}
          path: build.tar.gz
  suite:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        axioms: ['off', 'on']
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          pattern: obligation-build-*
          path: builds
      - name: Capture unchanged gate inputs and three modes
        run: |
          set +e
          for mode in baseline candidate; do
            mkdir -p "builds/$mode"
            tar -C "builds/$mode" -xzf "builds/obligation-build-$mode/build.tar.gz"
          done
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c - || exit 0
          unzip -q z3.zip
          Z3="$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3"
          chmod +x "$Z3"
          L=Source/IntegrationTests/TestFiles/LitTests/LitTest
          mkdir -p report
          python3 .github/review/lit-verdicts.py plan "$L" report/plan.tsv
          for mode in baseline off on; do
            build=candidate
            if [ "$mode" = baseline ]; then build=baseline; fi
            if [ "$(cat "builds/$build/out/build.exit")" != 0 ]; then continue; fi
            extra=()
            if [ "$mode" = on ]; then extra+=(--enabled); fi
            if [ '${{ matrix.axioms }}' = on ]; then extra+=(--axioms); fi
            python3 .github/review/obligation-compatibility.py suite report/plan.tsv "$L" "$PWD/builds/$build/out/dafny/Dafny" "$Z3" "report/$mode.tsv" --shard '${{ matrix.shard }}/4' --measurements "report/$mode-measurements" "${extra[@]}" > "report/$mode.log" 2>&1
            echo "$?" > "report/$mode.exit"
            python3 .github/review/additional-axioms.py inventory "report/$mode-measurements" "report/$mode-resources.json"
          done
          python3 - <<'PY'
          import json,pathlib
          d={'baseline':'ad1360af0f776c0be6cf57e4f0d38bbdf1ecc365','candidate':pathlib.Path('builds/candidate/out/source.txt').read_text().strip(),'axioms':'${{ matrix.axioms }}','shard':'${{ matrix.shard }}/4','solver':'5.1.0'}
          pathlib.Path('report/report-input.json').write_text(json.dumps(d,indent=2))
          PY
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-${{ matrix.axioms }}-${{ matrix.shard }}
          path: report
          retention-days: 90
          compression-level: 9
  library:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        solver: ['5.1.0', '4.12.1']
        axioms: ['off', 'on']
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          pattern: obligation-build-*
          path: builds
      - name: Capture standard library under three modes
        run: |
          set +e
          for mode in baseline candidate; do
            mkdir -p "builds/$mode"
            tar -C "builds/$mode" -xzf "builds/obligation-build-$mode/build.tar.gz"
          done
          if [ '${{ matrix.solver }}' = '5.1.0' ]; then
            curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
            echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c - || exit 0
            unzip -q z3.zip
            Z3="$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3"
          else
            curl -fsSLo z3.zip https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-4.12.1-x64-ubuntu-24.04-bin.zip
            echo 'e07d4193d8e1851114fe4d507332a43576639f4aeaa33c7df15c36426d3cbf3b  z3.zip' | sha256sum -c - || exit 0
            mkdir z3h
            unzip -q z3.zip -d z3h
            Z3="$PWD/z3h/z3-4.12.1"
          fi
          chmod +x "$Z3"
          mkdir -p report
          for mode in baseline off on; do
            build=candidate
            if [ "$mode" = baseline ]; then build=baseline; fi
            if [ "$(cat "builds/$build/out/build.exit")" != 0 ]; then continue; fi
            extra=()
            if [ "$mode" = on ]; then extra+=(--enabled); fi
            if [ '${{ matrix.axioms }}' = on ]; then extra+=(--axioms); fi
            python3 .github/review/obligation-compatibility.py library Source/DafnyStandardLibraries "$PWD/builds/$build/out/dafny/Dafny" "$Z3" "report/$mode.tsv" "${extra[@]}" > "report/$mode.log" 2>&1
            echo "$?" > "report/$mode.exit"
          done
          python3 - <<'PY'
          import json,pathlib
          d={'baseline':'ad1360af0f776c0be6cf57e4f0d38bbdf1ecc365','candidate':pathlib.Path('builds/candidate/out/source.txt').read_text().strip(),'axioms':'${{ matrix.axioms }}','solver':'${{ matrix.solver }}'}
          pathlib.Path('report/report-input.json').write_text(json.dumps(d,indent=2))
          PY
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-${{ matrix.solver }}-${{ matrix.axioms }}
          path: report
          retention-days: 90
  report:
    needs: [suite, library]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: suite-*
          path: results
      - uses: actions/download-artifact@v4
        with:
          pattern: library-*
          path: results
      - name: Record compatibility and performance differences
        run: |
          set +e
          python3 .github/review/obligation-compatibility.py compare results compatibility.json > compatibility.txt 2>&1
          echo "$?" > comparison.exit
          cat compatibility.txt >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obligation-compatibility
          path: |
            compatibility.json
            compatibility.txt
            comparison.exit
          retention-days: 90
