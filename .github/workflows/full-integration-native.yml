name: Full integration selected native evidence
on:
  push:
    branches: ['scratch/codex/full-main-to-dev']
    paths: ['.github/workflows/full-integration-native.yml', '.github/review/full-integration-native.py']
  workflow_dispatch:
    inputs:
      integrated-build-run:
        type: string
        default: '38137142292'
      candidate-only:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.candidate-only && '["integrated"]' || '["dev-baseline","supported-reference","integrated"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: integration-build-${{ matrix.source }}
          run-id: ${{ matrix.source == 'integrated' && inputs.integrated-build-run || '38137142292' }}
          github-token: ${{ github.token }}
          path: out/download
      - name: Install the immutable compiler and pinned solver
        run: |
          mkdir -p out/toolchain
          tar -C out/toolchain -xzf out/download/dafny.tar.gz
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          unzip -q z3.zip
          chmod +x z3-5.1.0-x64-glibc-2.39/bin/z3
          echo "Z3=$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" >> "$GITHUB_ENV"
      - name: Capture actual native outcomes as diagnostic data
        env:
          COMPILER_SOURCE: ${{ matrix.source }}
        run: python3 .github/review/full-integration-native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-native-${{ matrix.source }}
          path: out/native-evidence
          retention-days: 14
