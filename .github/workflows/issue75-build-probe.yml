name: Issue 75 safe build migration probe
on:
  push:
    branches: ['scratch/issue75/build-probe']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pin solvers for test harness and resource comparisons
        run: |
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          unzip -q z3.zip
          echo "$PWD/z3-5.1.0-x64-glibc-2.39/bin" >> "$GITHUB_PATH"
          curl -fsSLo z3h.zip https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-4.12.1-x64-ubuntu-24.04-bin.zip
          echo 'e07d4193d8e1851114fe4d507332a43576639f4aeaa33c7df15c36426d3cbf3b  z3h.zip' | sha256sum -c -
          mkdir -p Binaries/z3/bin
          unzip -q z3h.zip -d Binaries/z3/bin
          cp z3-5.1.0-x64-glibc-2.39/bin/z3 Binaries/z3/bin/z3-5.1.0
      - name: Record migration checks, including expected failures
        run: python3 .github/review/issue75-build-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue75-build-probe
          path: issue75-probe
          retention-days: 14
