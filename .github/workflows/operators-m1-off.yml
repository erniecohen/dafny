name: Operators M1 disabled compatibility
on:
  workflow_call:
    inputs:
      probe:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_PROCESSOR_COUNT: '2'
  MSBUILDDISABLENODEREUSE: '1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  binaries:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 60
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@f2dcac30ae508f3f8db10996173144a4161dcdf8
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true
      - uses: ./.github/actions/fetch-refs
        with:
          refs: 7dc1d91b1159bafb2d75dfb092930112528e6c18
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the pinned starting product and candidate with identical version metadata
        id: build
        shell: bash
        timeout-minutes: 60
        run: |
          mkdir -p out/evidence
          git worktree add --detach out/baseline-source 7dc1d91b1159bafb2d75dfb092930112528e6c18
          git rev-parse HEAD > out/evidence/candidate-revision
          git -C out/baseline-source rev-parse HEAD > out/evidence/baseline-revision
          # Only assembly build metadata is controlled. Semantic output is not normalized.
          set +e
          (cd out/baseline-source && sh Scripts/fetch-boogie-packages.sh && dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o ../baseline -p:GeneratePackageOnBuild=false -p:SourceRevisionId=operators-m1-comparison) > out/evidence/baseline-build.log 2>&1
          baseline=$?
          (sh Scripts/fetch-boogie-packages.sh && dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o out/candidate -p:GeneratePackageOnBuild=false -p:SourceRevisionId=operators-m1-comparison) > out/evidence/candidate-build.log 2>&1
          candidate=$?
          echo "$baseline" > out/evidence/baseline-build.exit
          echo "$candidate" > out/evidence/candidate-build.exit
          grep -E ' error |Error\(s\)|Warning\(s\)|Build succeeded' out/evidence/baseline-build.log || true
          grep -E ' error |Error\(s\)|Warning\(s\)|Build succeeded' out/evidence/candidate-build.log || true
          if [ "$baseline" = 0 ] && [ "$candidate" = 0 ]; then
            python3 .github/review/operators-m1-parser.py out/baseline-source . out/evidence/parser.json > out/evidence/parser.log 2>&1
            parser=$?
            cat out/evidence/parser.log
            echo "$parser" > out/evidence/parser.exit
            if [ "$parser" != 0 ] && [ '${{ inputs.probe }}' != true ]; then exit 1; fi
            echo 'built=true' >> "$GITHUB_OUTPUT"
            tar -C out -czf operators-off-binaries.tar.gz baseline candidate
          else
            echo 'built=false' >> "$GITHUB_OUTPUT"
            echo "Builds: baseline=$baseline candidate=$candidate" >> "$GITHUB_STEP_SUMMARY"
            if [ '${{ inputs.probe }}' != true ]; then exit 1; fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operators-off-builds
          path: out/evidence
      - uses: ./.github/actions/host-artifact
        if: steps.build.outputs.built == 'true'
        with:
          mode: put
          name: operators-off-binaries
          path: operators-off-binaries.tar.gz
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  compare:
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && (needs.binaries.outputs.built == 'true') }}
    needs: binaries
    name: OFF literal comparison (${{ matrix.scope }}, ${{ matrix.shard }})
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { scope: suite, shard: '0/4', label: suite-0 }
          - { scope: suite, shard: '1/4', label: suite-1 }
          - { scope: suite, shard: '2/4', label: suite-2 }
          - { scope: suite, shard: '3/4', label: suite-3 }
          - { scope: stdlib, shard: '0/1', label: stdlib }
          - { scope: text, shard: '0/1', label: text }
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 240
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 240
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@f2dcac30ae508f3f8db10996173144a4161dcdf8
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/host-artifact
        with:
          mode: get
          name: operators-off-binaries
      - name: Unpack binaries and checksum-pinned solver
        timeout-minutes: 240
        run: |
          mkdir -p out
          tar -C out -xzf operators-off-binaries.tar.gz
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-arm64-osx-13.3.zip
          echo '81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db  z3.zip' | shasum -a 256 -c -
          unzip -q z3.zip
          chmod +x z3-5.1.0-arm64-osx-13.3/bin/z3
      - name: Compare literal bytes, verdicts and resource vectors
        timeout-minutes: 240
        run: |
          set +e
          python3 .github/review/operators-m1-off.py --baseline "$PWD/out/baseline/Dafny" --candidate "$PWD/out/candidate/Dafny" --z3 "$PWD/z3-5.1.0-arm64-osx-13.3/bin/z3" --output out/comparison --scope '${{ matrix.scope }}' --shard '${{ matrix.shard }}' > out/comparison.log 2>&1
          result=$?
          echo "$result" > out/comparison.exit
          tail -60 out/comparison.log
          echo "Comparison ${{ matrix.label }} exit: $result. Reports and literal outputs are retained." >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ inputs.probe }}' != true ]; then exit "$result"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operators-off-${{ matrix.label }}
          path: |
            out/comparison
            out/comparison.log
            out/comparison.exit
          retention-days: 30
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac
