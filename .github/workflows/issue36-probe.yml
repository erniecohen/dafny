name: Issue 36 safe probe
on:
  push:
    branches: ['scratch/issue36/probe']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build and record diagnostics
        run: |
          mkdir -p results
          if sh Scripts/fetch-boogie-packages.sh > results/build.log 2>&1 && dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny >> results/build.log 2>&1; then
            echo 0 > results/build-exit.txt
            curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
            echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
            unzip -q z3.zip
            curl -fsSLo z3h.zip https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-4.12.1-x64-ubuntu-24.04-bin.zip
            echo 'e07d4193d8e1851114fe4d507332a43576639f4aeaa33c7df15c36426d3cbf3b  z3h.zip' | sha256sum -c -
            mkdir z3h && unzip -q z3h.zip -d z3h
            python3 .github/review/issue36-probe.py
          else
            echo "$?" > results/build-exit.txt
          fi
          cat results/*exit* >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue36-probe
          path: results
          retention-days: 30
