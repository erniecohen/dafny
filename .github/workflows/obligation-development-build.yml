name: Obligation development ARM build probe
on:
  workflow_dispatch:
  push:
    branches: [scratch/codex/issue100-development-build]
    paths: [.github/workflows/obligation-development-build.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Record build and structural checks without solver execution
        run: |
          set +e
          mkdir -p out
          git rev-parse HEAD > out/source.txt
          dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:GeneratePackageOnBuild=false > out/build.log 2>&1
          echo "$?" > out/build.exit
          OBLIGATION_INVENTORY_CAPTURE=out/obligation-producers.json dotnet test Source/DafnyCore.Test -c Release --filter FullyQualifiedName~Obligation > out/core.log 2>&1
          echo "$?" > out/core.exit
          dotnet build Source/DafnyLanguageServer.Test -c Release > out/editor-build.log 2>&1
          echo "$?" > out/editor-build.exit
          cat out/*.exit
          tail -n 15 out/core.log
          tail -n 15 out/editor-build.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obligation-development-build
          path: |
            out/*.log
            out/*.exit
            out/source.txt
            out/obligation-producers.json
          retention-days: 30
