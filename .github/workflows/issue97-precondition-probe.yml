name: Issue 97 stored lambda precondition diagnostics
on:
  push:
    branches: ['scratch/issue97/lambda-requires']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        source: ['4e98f3f592310854ca1448d517b82dcbcc0f51f4', '1256f92b0b494e8f1bf52aaec145d36a8a862f33']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          path: compiler
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install checksum-pinned Z3 5.1.0
        run: |
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          unzip -q z3.zip
          echo "Z3=$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" >> "$GITHUB_ENV"
      - name: Record actual baseline outcomes and closure translation
        run: python3 .github/review/issue97-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue97-precondition-${{ matrix.source }}
          path: out/issue97-probe
          retention-days: 30
