name: Issue 75 runtime and resource comparisons
on:
  push:
    branches: ['scratch/issue75/comparisons-register']
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Green review run for the exact merged base
        type: string
        required: true
      candidate_run:
        description: Review run for the exact candidate
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_PROCESSOR_COUNT: '2'
  MSBUILDDISABLENODEREUSE: '1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  compare:
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && (github.event_name == 'workflow_dispatch') }}
    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 90
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 90
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@600ab4703a71d73df1e2d014bd1018c4c9e08d85
        with:
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS || '2' }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: dafny
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: baseline-build
      - uses: actions/download-artifact@v4
        with:
          name: dafny
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: candidate-build
      - uses: actions/download-artifact@v4
        with:
          pattern: verdicts-*-*
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: measurements/baseline
      - uses: actions/download-artifact@v4
        with:
          pattern: verdicts-*-*
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: measurements/candidate
      - uses: actions/download-artifact@v4
        with:
          pattern: std-verdicts-*-z3-5.1.0
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: measurements/baseline
      - uses: actions/download-artifact@v4
        with:
          pattern: std-verdicts-*-z3-5.1.0
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: measurements/candidate
      - name: Unpack paired builds and pin Z3
        timeout-minutes: 90
        run: |
          mkdir baseline candidate
          tar -C baseline -xzf baseline-build/dafny.tar.gz
          tar -C candidate -xzf candidate-build/dafny.tar.gz
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-arm64-osx-13.3.zip
          echo '81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db  z3.zip' | shasum -a 256 -c -
          unzip -q z3.zip
      - name: Record comparisons without treating probe failures as acceptance
        timeout-minutes: 90
        run: python3 .github/review/issue75-comparisons.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue75-comparisons
          path: issue75-comparisons
          retention-days: 90
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac
