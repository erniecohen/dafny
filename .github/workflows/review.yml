name: review
on:
  workflow_dispatch:
    inputs:
      extended:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    name: Recorded newtype diagnostic probes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
      - name: Runtime dependencies
        run: |
          npm install bignumber.js@9.1.2
          go install golang.org/x/tools/cmd/goimports@v0.31.0
      - name: Record source and build
        run: |
          mkdir -p results
          git rev-parse HEAD > results/source.txt
          if [ -f Scripts/fetch-boogie-packages.sh ]; then sh Scripts/fetch-boogie-packages.sh; fi
          set +e
          dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny > results/build.txt 2>&1
          result=$?
          echo "$result" > results/build-exit.txt
          tail -20 results/build.txt
          exit 0
      - name: Pinned solver and diagnostic cases
        run: |
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          unzip -q z3.zip
          chmod +x z3-5.1.0-x64-glibc-2.39/bin/z3
          if [ "$(cat results/build-exit.txt)" = 0 ]; then
            extra=''
            if [ '${{ inputs.extended }}' = true ]; then extra=--extended; fi
            python3 .github/review/extended-newtype-bases.py "$PWD/out/dafny/Dafny" "$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" results/cases $extra
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue113-diagnostics
          path: results
          retention-days: 30
