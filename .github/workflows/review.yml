name: Issue 113 adjacent-head cast diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue113-cast-spine-${{ github.ref }}
  cancel-in-progress: false
env:
  ISSUE113_PRODUCT_SOURCE: 41f2c01cabacb50e7e7a7f6f9b6c79697c3b375a
  ISSUE113_SOURCE_TREE: cfa049c923aff2a5009e74a200193e317590cdf0
jobs:
  build:
    if: github.repository == 'erniecohen/dafny' && startsWith(github.ref, 'refs/heads/scratch/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        id: diagnostic_1
        continue-on-error: true
      - uses: actions/setup-dotnet@v4
        id: diagnostic_2
        continue-on-error: true
        with:
          dotnet-version: 8.0.x
      - name: Recorded source regeneration and compiler build
        id: diagnostic_3
        continue-on-error: true
        run: |
          mkdir -p results
          git rev-parse HEAD > results/source.txt
          git status --porcelain > results/status.txt
          cat .github/review/base > results/last-product-revision.txt
          git rev-parse HEAD:Source > results/actual-source-tree.txt
          printf '%s\n' "$ISSUE113_PRODUCT_SOURCE" > results/product-source-pin.txt
          printf '%s\n' "$ISSUE113_SOURCE_TREE" > results/expected-source-tree.txt
          set +e
          if [ "$(cat results/actual-source-tree.txt)" != "$ISSUE113_SOURCE_TREE" ]; then
            echo 1 > results/source-identity-exit.txt
            echo 125 > results/build-exit.txt
            exit 0
          fi
          echo 0 > results/source-identity-exit.txt
          python3 .github/review/issue113-cast-spine/guard.py source --output results/tracked-source-before.json > results/tracked-source-before.txt 2>&1
          echo "$?" > results/tracked-source-before-exit.txt
          if [ "$(cat results/tracked-source-before-exit.txt)" != 0 ]; then echo 125 > results/build-exit.txt; exit 0; fi
          python3 .github/review/issue113-benchmark-identity.py inputs --output results/build-inputs.json > results/input-identity.txt 2>&1
          echo "$?" > results/input-identity-exit.txt
          if [ "$(cat results/input-identity-exit.txt)" != 0 ]; then echo 125 > results/build-exit.txt; exit 0; fi
          sh .github/review/version.sh > results/version.env 2> results/version-stderr.txt
          echo "$?" > results/version-helper-exit.txt
          if [ "$(cat results/version-helper-exit.txt)" != 0 ]; then echo 125 > results/build-exit.txt; exit 0; fi
          python3 .github/review/issue113-benchmark-identity.py version --version-env results/version.env --output results/version-identity.json > results/version-identity.txt 2>&1
          echo "$?" > results/version-identity-exit.txt
          if [ "$(cat results/version-identity-exit.txt)" != 0 ]; then echo 125 > results/build-exit.txt; exit 0; fi
          revision=$(sed -n 's/^revision=//p' results/version.env)
          python3 .github/review/issue113-benchmarks/generate.py --check > results/generator-check.txt 2>&1
          echo "$?" > results/generator-check-exit.txt
          if [ "$(cat results/generator-check-exit.txt)" != 0 ]; then
            echo 125 > results/build-exit.txt
            exit 0
          fi
          sh Scripts/fetch-boogie-packages.sh > results/boogie-setup.txt 2>&1
          echo "$?" > results/boogie-setup-exit.txt
          if [ "$(cat results/boogie-setup-exit.txt)" != 0 ]; then echo 125 > results/build-exit.txt; exit 0; fi
          dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:SourceRevisionId="$revision" > results/build.txt 2>&1
          echo "$?" > results/build-exit.txt
          if [ "$(cat results/build-exit.txt)" = 0 ]; then
            out/dafny/Dafny --version > results/compiler-version.txt
            tar -C out -czf results/dafny.tar.gz dafny
            python3 .github/review/issue113-benchmarks/compiler_identity.py out/dafny/Dafny results/compiler-components.json --source-sha "$GITHUB_SHA" --product-revision "$ISSUE113_PRODUCT_SOURCE" --archive results/dafny.tar.gz > results/compiler-identity.txt 2>&1
            echo "$?" > results/compiler-identity-exit.txt
            if [ "$(cat results/compiler-identity-exit.txt)" = 0 ]; then
              python3 .github/review/issue113-benchmark-identity.py bundle --version-env results/version.env --version-output results/compiler-version.txt --components results/compiler-components.json --archive results/dafny.tar.gz --bundle-root out/dafny --output results/compiler-source-binding.json > results/compiler-source-binding.txt 2>&1
              echo "$?" > results/compiler-source-binding-exit.txt
            else
              echo 125 > results/compiler-source-binding-exit.txt
            fi
          fi
          python3 .github/review/issue113-cast-spine/guard.py source --output results/tracked-source-after.json > results/tracked-source-after.txt 2>&1
          echo "$?" > results/tracked-source-after-exit.txt
          exit 0
      - name: Retain raw diagnostic step outcomes
        id: diagnostic_step_outcomes
        continue-on-error: true
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set +e
          mkdir -p results
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          Path('results/step-outcomes.json').write_text(os.environ["STEP_OUTCOMES"]+"\n")
          PYCODE
          exit 0
      - uses: actions/upload-artifact@v4
        id: diagnostic_4
        continue-on-error: true
        if: always()
        with:
          name: cast-spine-compiler
          path: results
          include-hidden-files: true
  measurements:
    if: always() && github.repository == 'erniecohen/dafny' && startsWith(github.ref, 'refs/heads/scratch/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stage: [translate, verify, controls]
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: actions/setup-dotnet@v4
        continue-on-error: true
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cast-spine-compiler
          path: compiler
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: performance-compiler
          run-id: 37357169410
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: before-compiler
      - name: Record exact compiler and solver setup
        continue-on-error: true
        run: |
          set +e
          mkdir -p measurements out/before out/after
          python3 .github/review/issue113-cast-spine/guard.py source --output measurements/tracked-source-before.json > measurements/tracked-source-before.txt 2>&1
          echo "$?" > measurements/tracked-source-before-exit.txt
          if [ "$(cat measurements/tracked-source-before-exit.txt)" != 0 ]; then exit 0; fi
          if [ "$(cat compiler/build-exit.txt)" != 0 ] || [ "$(cat compiler/compiler-source-binding-exit.txt)" != 0 ] || [ "$(cat compiler/tracked-source-after-exit.txt)" != 0 ]; then exit 0; fi
          tar -C out/after -xzf compiler/dafny.tar.gz
          echo "$?" > measurements/after-extract-exit.txt
          tar -C out/before -xzf before-compiler/dafny.tar.gz
          echo "$?" > measurements/before-extract-exit.txt
          if [ "$(cat measurements/after-extract-exit.txt)" != 0 ] || [ "$(cat measurements/before-extract-exit.txt)" != 0 ]; then exit 0; fi
          python3 .github/review/issue113-benchmark-identity.py verify-bundle --receipt compiler/compiler-source-binding.json --archive compiler/dafny.tar.gz --bundle-root out/after/dafny --output measurements/after-source-binding.json > measurements/after-source-binding.txt 2>&1
          echo "$?" > measurements/after-source-binding-exit.txt
          python3 .github/review/issue113-cast-spine/guard.py before --compiler-root before-compiler --bundle-root out/before/dafny --output measurements/before-source-binding.json > measurements/before-source-binding.txt 2>&1
          echo "$?" > measurements/before-source-binding-exit.txt
          if [ "$(cat measurements/after-source-binding-exit.txt)" != 0 ] || [ "$(cat measurements/before-source-binding-exit.txt)" != 0 ]; then exit 0; fi
          curl --retry 3 --retry-all-errors -fsSLo solver.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo "$?" > measurements/solver-download-exit.txt
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  solver.zip' | sha256sum -c - > measurements/solver-checksum.txt 2>&1
          echo "$?" > measurements/solver-checksum-exit.txt
          unzip -q solver.zip
          echo "$?" > measurements/solver-unzip-exit.txt
          echo "SOLVER=$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" >> "$GITHUB_ENV"
          exit 0
      - name: Record two-arm depth observations
        continue-on-error: true
        env:
          STAGE: ${{ matrix.stage }}
        run: |
          set +e
          if [ "$(cat measurements/after-source-binding-exit.txt)" != 0 ] || [ "$(cat measurements/before-source-binding-exit.txt)" != 0 ] || [ "$(cat measurements/solver-checksum-exit.txt)" != 0 ] || [ "$(cat measurements/solver-unzip-exit.txt)" != 0 ]; then exit 0; fi
          if [ "$STAGE" = controls ]; then
            python3 .github/review/issue113-cast-spine/controls.py > measurements/measure.txt 2>&1
          else
            python3 .github/review/issue113-cast-spine/measure.py > measurements/measure.txt 2>&1
          fi
          echo "$?" > measurements/measure-exit.txt
          python3 .github/review/issue113-benchmark-identity.py verify-bundle --receipt compiler/compiler-source-binding.json --archive compiler/dafny.tar.gz --bundle-root out/after/dafny --output measurements/after-source-binding-after.json > measurements/after-source-binding-after.txt 2>&1
          echo "$?" > measurements/after-source-binding-after-exit.txt
          python3 .github/review/issue113-cast-spine/guard.py before --compiler-root before-compiler --bundle-root out/before/dafny --output measurements/before-source-binding-after.json > measurements/before-source-binding-after.txt 2>&1
          echo "$?" > measurements/before-source-binding-after-exit.txt
          python3 .github/review/issue113-cast-spine/guard.py source --output measurements/tracked-source-after.json > measurements/tracked-source-after.txt 2>&1
          echo "$?" > measurements/tracked-source-after-exit.txt
          exit 0
      - name: Retain raw diagnostic step outcomes
        id: diagnostic_step_outcomes
        continue-on-error: true
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set +e
          mkdir -p measurements
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          Path('measurements/step-outcomes.json').write_text(os.environ['STEP_OUTCOMES']+'\n')
          PYCODE
          exit 0
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: cast-spine-${{ matrix.stage }}
          path: measurements
          include-hidden-files: true
          retention-days: 30
