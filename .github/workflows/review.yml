           ('Go imports',lambda:run('goimports-install',['go','install','golang.org/x/tools/cmd/goimports@v0.31.0']))]:
              try:
                  text=action()
                  if name=='version': (out/'version.env').write_text('\n'.join(line for line in text.splitlines() if line.startswith(('revision=','version=')))+'\n')
              except Exception as e:errors.append({'prerequisite':name,'error':repr(e)})
          solvers=[('5.1.0','https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip','f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a'),('4.12.1','https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-4.12.1-x64-ubuntu-24.04-bin.zip','e07d4193d8e1851114fe4d507332a43576639f4aeaa33c7df15c36426d3cbf3b')]
          # Archive SHA256 is checked independently from the extracted executable identity.
          actual={}
          for version,url,expected in solvers:
              try:
                  archive=out/('z3-'+version+'.zip');destination=root/'Binaries/z3/bin';destination.mkdir(parents=True,exist_ok=True)
                  run('download-z3-'+version,['curl','-fsSL','--retry','2','--max-time','200','-o',str(archive),url])
                  if sha(archive)!=expected:raise RuntimeError('Solver archive checksum mismatch: '+version)
                  unpack=out/('z3-'+version+'-unpacked');unpack.mkdir(exist_ok=True)
                  run('unpack-z3-'+version,['unzip','-q',str(archive),'-d',str(unpack)])
                  executable=unpack/'z3-5.1.0-x64-glibc-2.39/bin/z3' if version=='5.1.0' else unpack/'z3-4.12.1'
                  target=destination/('z3-'+version);shutil.copyfile(executable,target);target.chmod(0o755)
                  text=run('version-z3-'+version,[str(target),'--version'])
                  if 'Z3 version '+version not in text:raise RuntimeError('Wrong actual solver version')
                  actual[version]=sha(target)
                  save(out/('solver-'+version+'.json'),{'url':url,'archive_sha256':sha(archive),'executable_sha256':actual[version],'actual_version_output':text})
              except Exception as e:errors.append({'prerequisite':'Z3 '+version,'error':repr(e)})
          save(out/'solver-executables.json',actual)
          for name,args in [('dotnet',['dotnet','--info']),('node',['node','--version']),('npm',['npm','--version']),('python',['python3','--version']),('java',['java','-version']),('javac',['javac','-version']),('go',['go','version']),('goimports',['go','version','-m',str(pathlib.Path(os.environ['HOME'])/'go/bin/goimports')])]:
              try:run('tool-'+name,args,60)
              except Exception as e:errors.append({'prerequisite':'Tool '+name,'error':repr(e)})
          source=(root/'Source/DafnyCore/DafnyOptions.cs').read_text()
          if 'DefaultZ3Version = "4.12.1"' not in source: errors.append({'prerequisite':'default solver','error':'Final shipped default solver changed'})
          if set(actual)!={'5.1.0','4.12.1'}:errors.append({'prerequisite':'solvers','error':'Both named solvers were not installed'})
          save(out/'ready.json',{'all_prerequisites_completed':not errors,'errors':errors,'records':records,'solvers_installed_before_any_harness_build':True,'capacity_cap_seconds':900})
          print(json.dumps({'all_prerequisites_completed':not errors,'errors':errors},indent=2))
          ISSUE113_SETUP_PY_0
