name: review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Recorded source regeneration and compiler build
        run: |
          mkdir -p results
          git rev-parse HEAD > results/source.txt
          git status --porcelain > results/status.txt
          cat .github/review/base > results/last-product-revision.txt
          set +e
          python3 .github/review/issue113-benchmarks/generate.py --check > results/generator-check.txt 2>&1
          echo "$?" > results/generator-check-exit.txt
          if [ "$(cat results/generator-check-exit.txt)" != 0 ]; then
            echo 125 > results/build-exit.txt
            exit 0
          fi
          sh Scripts/fetch-boogie-packages.sh > results/boogie-setup.txt 2>&1
          echo "$?" > results/boogie-setup-exit.txt
          if [ "$(cat results/boogie-setup-exit.txt)" != 0 ]; then echo 125 > results/build-exit.txt; exit 0; fi
          dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:SourceRevisionId=$GITHUB_SHA > results/build.txt 2>&1
          echo "$?" > results/build-exit.txt
          if [ "$(cat results/build-exit.txt)" = 0 ]; then
            out/dafny/Dafny --version > results/compiler-version.txt
            tar -C out -czf results/dafny.tar.gz dafny
            python3 .github/review/issue113-benchmarks/compiler_identity.py out/dafny/Dafny results/compiler-components.json --source-sha "$GITHUB_SHA" --product-revision "$(cat results/last-product-revision.txt)" --archive results/dafny.tar.gz > results/compiler-identity.txt 2>&1
            echo "$?" > results/compiler-identity-exit.txt
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-compiler
          path: results
  measurements:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: [{"corpus": "extended", "family": "arrow-adapter", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "arrow-adapter", "solver": "4.12.1", "seed": 0}, {"corpus": "extended", "family": "arrow-coercion", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "arrow-coercion", "solver": "4.12.1", "seed": 0}, {"corpus": "extended", "family": "codatatype-lazy", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "codatatype-lazy", "solver": "4.12.1", "seed": 0}, {"corpus": "extended", "family": "datatype-ghost-update", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "datatype-ghost-update", "solver": "4.12.1", "seed": 0}, {"corpus": "extended", "family": "datatype-nested-update", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "datatype-nested-update", "solver": "4.12.1", "seed": 0}, {"corpus": "extended", "family": "datatype-root-update", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "datatype-root-update", "solver": "4.12.1", "seed": 0}, {"corpus": "extended", "family": "ordinal-finite", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "ordinal-finite", "solver": "4.12.1", "seed": 0}, {"corpus": "extended", "family": "ordinal-finite-refinement", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "ordinal-finite-refinement", "solver": "4.12.1", "seed": 0}, {"corpus": "extended", "family": "refinement-local", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "refinement-local", "solver": "4.12.1", "seed": 0}, {"corpus": "extended", "family": "refinement-quantified", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "refinement-quantified", "solver": "4.12.1", "seed": 0}, {"corpus": "extended", "family": "refinement-trivial", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "refinement-trivial", "solver": "4.12.1", "seed": 0}, {"corpus": "extended", "family": "tree-observation", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "tree-observation", "solver": "4.12.1", "seed": 0}, {"corpus": "extended", "family": "visibility-session", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "visibility-session", "solver": "4.12.1", "seed": 0}, {"corpus": "fixtures", "family": "depth", "solver": "5.1.0", "seed": 0}, {"corpus": "fixtures", "family": "depth", "solver": "4.12.1", "seed": 0}, {"corpus": "fixtures", "family": "generic-nesting", "solver": "5.1.0", "seed": 0}, {"corpus": "fixtures", "family": "generic-nesting", "solver": "4.12.1", "seed": 0}, {"corpus": "fixtures", "family": "function-identity", "solver": "5.1.0", "seed": 0}, {"corpus": "fixtures", "family": "function-identity", "solver": "4.12.1", "seed": 0}, {"corpus": "fixtures", "family": "function-creation", "solver": "5.1.0", "seed": 0}, {"corpus": "fixtures", "family": "function-creation", "solver": "4.12.1", "seed": 0}, {"corpus": "fixtures", "family": "generic-boundary", "solver": "5.1.0", "seed": 0}, {"corpus": "fixtures", "family": "generic-boundary", "solver": "4.12.1", "seed": 0}]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
      - uses: actions/download-artifact@v4
        with:
          name: performance-compiler
          path: compiler
      - name: Pinned runtime dependencies
        run: |
          mkdir -p measurements
          set +e
          npm install bignumber.js@9.1.2
          echo "$?" > measurements/npm-exit.txt
          go install golang.org/x/tools/cmd/goimports@v0.31.0
          echo "$?" > measurements/goimports-exit.txt
          exit 0
      - name: Recorded solver setup
        run: |
          mkdir -p measurements
          set +e
          if [ "${{ matrix.solver }}" = 5.1.0 ]; then
            curl --retry 3 --retry-all-errors -fsSLo solver.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
            echo "$?" > measurements/solver-download-exit.txt
            echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  solver.zip' | sha256sum -c - > measurements/solver-checksum.txt 2>&1
            echo "$?" > measurements/solver-checksum-exit.txt
            unzip -q solver.zip
            echo "$?" > measurements/solver-unzip-exit.txt
            echo "SOLVER=$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" >> "$GITHUB_ENV"
          else
            curl --retry 3 --retry-all-errors -fsSLo solver.zip https://github.com/Z3Prover/z3/releases/download/z3-4.12.1/z3-4.12.1-x64-glibc-2.35.zip
            echo "$?" > measurements/solver-download-exit.txt
            echo 'c5360fd157b0f861ec8780ba3e51e2197e9486798dc93cd878df69a4b0c2b7c5  solver.zip' | sha256sum -c - > measurements/solver-checksum.txt 2>&1
            echo "$?" > measurements/solver-checksum-exit.txt
            unzip -q solver.zip
            echo "$?" > measurements/solver-unzip-exit.txt
            echo "SOLVER=$PWD/z3-4.12.1-x64-glibc-2.35/bin/z3" >> "$GITHUB_ENV"
          fi
          exit 0
      - name: Recorded universal proof and runtime measurements
        env:
          CORPUS: ${{ matrix.corpus }}
          FAMILY: ${{ matrix.family }}
          SOLVER_VERSION: ${{ matrix.solver }}
          SOLVER_SEED: ${{ matrix.seed }}
        run: |
          if [ "$(cat compiler/build-exit.txt)" != 0 ]; then exit 0; fi
          if [ "$(cat compiler/compiler-identity-exit.txt)" != 0 ]; then exit 0; fi
          if [ "$(cat measurements/solver-checksum-exit.txt)" != 0 ]; then exit 0; fi
          if [ "$(cat measurements/solver-unzip-exit.txt)" != 0 ]; then exit 0; fi
          if [ "$(cat measurements/npm-exit.txt)" != 0 ]; then exit 0; fi
          if [ "$(cat measurements/goimports-exit.txt)" != 0 ]; then exit 0; fi
          set +e
          mkdir -p out && tar -C out -xzf compiler/dafny.tar.gz
          echo "$?" > measurements/compiler-extract-exit.txt
          if [ "$(cat measurements/compiler-extract-exit.txt)" != 0 ]; then exit 0; fi
          python3 .github/review/issue113-benchmarks/batch.py > measurements/batch.txt 2>&1
          echo "$?" > measurements/batch-exit.txt
          tail -30 measurements/batch.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.corpus }}-${{ matrix.family }}-${{ matrix.solver }}-${{ matrix.seed }}
          path: measurements
          retention-days: 30
