# Scratch diagnostic only. Actions success is not proof or runtime acceptance.
# One final shipped product build supplies every measured compiler component.
# No source, contract, literal RUN, proof budget, seed, or expectation is edited.
# 78 derived AX/profile proof slots are separate from the canonical literal harness.
# Exact literal all-backend harness plus additional raw-exit compiler observations.
name: review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
jobs:
  same-source-lifecycle-and-backends:
    if: github.repository == 'erniecohen/dafny' && startsWith(github.ref, 'refs/heads/scratch/')
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: actions/setup-dotnet@v4
        continue-on-error: true
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        continue-on-error: true
        with:
          go-version: '1.24.1'
      - name: Materialize the pinned observer inputs
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .same-source-tools same-source-observations/setup
          : > .same-source-tools/spec.json
          : > .same-source-tools/observer.py
          : > .same-source-tools/setup.py
          printf '%s\n' "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Pinned spec.json fragment 1 of 11
