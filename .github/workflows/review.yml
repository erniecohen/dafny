  integer-bitwise-reference:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && needs.tree.outputs.reuse != 'true' }}
    name: Integer bitwise reference (Z3 ${{ matrix.z3 }}, ${{ matrix.resolver }})
    needs: [build, milestone-scope, tree]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        z3: ['5.1.0', 'of the tests']
        resolver: ['legacy', 'refreshed']
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: dafny
      - name: Unpack Dafny
        run: mkdir -p out && tar -C out -xzf dafny.tar.gz
      - name: Check historical M1 identity
        if: needs.milestone-scope.outputs.integer_bitwise == 'true'
        run: |
          git fetch --no-tags --depth=2 origin 25203d9115f8f104b325c8a058bf41051bdbbe69
          python3 .github/review/issue193-identity.py reference-results/identity
      - name: Pinned solver
        run: |
          if [ '${{ matrix.z3 }}' = 5.1.0 ]; then
            curl -fsSLo z3.zip "$Z3_RELEASE/$Z3_LINUX_X64.zip"
            echo "$Z3_LINUX_X64_SHA256  z3.zip" | sha256sum -c -
            unzip -q z3.zip
            chmod +x "$Z3_LINUX_X64/bin/z3"
            echo "Z3=$PWD/$Z3_LINUX_X64/bin/z3" >> "$GITHUB_ENV"
          else
            v=$(sed -n 's/.*DefaultZ3Version = "\(.*\)";.*/\1/p' Source/DafnyCore/DafnyOptions.cs)
            test "$v" = 4.12.1
            curl -fsSLo z3h.zip "$HARNESS_Z3_RELEASE/z3-$v-x64-ubuntu-24.04-bin.zip"
            echo "$HARNESS_Z3_4_12_1_SHA256  z3h.zip" | sha256sum -c -
            mkdir -p z3h && unzip -q z3h.zip -d z3h
            chmod +x "z3h/z3-$v"
            echo "Z3=$PWD/z3h/z3-$v" >> "$GITHUB_ENV"
          fi
      - name: Prove bodies, measure width clients and reject live false controls
        run: |
          python3 .github/review/issue193-reference.py --dafny "$PWD/out/dafny/Dafny" \
            --z3 "$Z3" --resolver '${{ matrix.resolver }}' --output reference-results/proofs
          cat reference-results/proofs/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integer-bitwise-reference-${{ matrix.z3 }}-${{ matrix.resolver }}
          path: reference-results
          retention-days: 90


  binaries:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!inputs.platform_parity && (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_type == 'tag' || inputs.binaries))) }}
    name: Binaries (${{ matrix.rid }})
    needs: build
    # The osx-arm64 build runs on the owner's self-hosted Mac (label mac-studio);
    # this job only runs for tags and manual dispatches, never for pull requests.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            os: mac-studio
          - rid: linux-x64
            os: ubuntu-24.04
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
          echo 'Job worker and shell niceness: 10; subsequent actions inherit it.'
      - uses: actions/checkout@v4
      - name: The tag must name this tree's version
        if: github.ref_type == 'tag'
        run: |
          echo "tag ${{ github.ref_name }}, version ${{ needs.build.outputs.version }}"
          test "${{ github.ref_name }}" = "v${{ needs.build.outputs.version }}"
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Boogie packages
        run: sh Scripts/fetch-boogie-packages.sh
      - name: Publish, self-contained
        env:
          RUNTIME_IDENTIFIER: ${{ matrix.rid }}
        run: |
          dotnet publish Source/Dafny/Dafny.csproj -c Release -r ${{ matrix.rid }} --self-contained \
            -o out/dafny -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true -p:SourceRevisionId=${{ needs.build.outputs.revision }}
          rm -f out/dafny/*.pdb
          mv out/dafny/Dafny out/dafny/dafny
          for f in LICENSE.txt NOTICES.txt REVIEW.md; do if [ -f "$f" ]; then cp "$f" out/dafny/; fi; done
      - name: Check it runs and verifies
        run: |
          case "${{ matrix.rid }}" in
            osx-arm64) z=$Z3_OSX_ARM64; s=$Z3_OSX_ARM64_SHA256 ;;
            linux-x64) z=$Z3_LINUX_X64; s=$Z3_LINUX_X64_SHA256 ;;
          esac
          curl -fsSLo z3.zip "$Z3_RELEASE/$z.zip"
          echo "$s  z3.zip" | shasum -a 256 -c -  # shasum is on both macOS and Ubuntu runners
          unzip -q z3.zip && chmod +x "$z/bin/z3"
          v=$(out/dafny/dafny --version | head -1)
          echo "dafny --version: $v"
          test "$v" = "${{ needs.build.outputs.version }}"
          out/dafny/dafny verify --solver-path "$z/bin/z3" \
            Source/IntegrationTests/TestFiles/LitTests/LitTest/git-issues/git-issue-6537.dfy
      - name: Zip
        run: |
          name=dafny-${{ needs.build.outputs.version }}-${{ matrix.rid }}.zip
          (cd out && zip -Xqr "../$name" dafny)
          python3 .github/review/check-distribution.py out/dafny --archive "$name"
          shasum -a 256 "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.rid }}
          path: dafny-*.zip
          retention-days: 14

  verdict:
    # The aggregate result: success when every verification job succeeded or, with a reused
    # verification, was skipped for it.  A full run on a branch or a pull request records the
    # marker that later runs of the same tree reuse; a tag requires one or the other.
    name: Verdict
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.tree.result == 'success' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')) }}
    needs: [tree, build, suite, verdicts, verification-batch, resolver, stdlib, axiom-resources, javascript-runtime, regressions, regressions-linux, resolver-tests, finite-support, statement-conclusions, integer-bitwise-reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Judge the jobs
        id: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
          STRICT: ${{ github.ref_type == 'tag' }}
        run: |
          # A tag is strict: a job may be skipped only because the verification is reused.
          if [ "$STRICT" = true ]; then flag=--strict; fi
          python3 .github/review/tree-reuse.py gate --jobs build,suite,verdicts,verification-batch,resolver,stdlib,axiom-resources,javascript-runtime,regressions,regressions-linux,resolver-tests,finite-support,statement-conclusions,integer-bitwise-reference ${flag:+"$flag"}
      - name: Marker for this tree
        if: ${{ steps.gate.outputs.verified == 'true' && github.ref_type != 'tag' }}
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir verified
          python3 .github/review/tree-reuse.py marker --out verified/tree.json
      - uses: actions/upload-artifact@v4
        if: ${{ steps.gate.outputs.verified == 'true' && github.ref_type != 'tag' }}
        with:
          name: verified-review-${{ needs.tree.outputs.tree }}
          path: verified
          overwrite: true
          retention-days: 90

  release:
    # Explicit results: with a reused verification the skipped verifier jobs upstream of verdict
    # would make the implicit success() false and skip the release.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.binaries.result == 'success' && needs.verdict.result == 'success' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!inputs.platform_parity && (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'tag')) }}
    name: GitHub release
    needs: [build, binaries, verdict]
    runs-on: mac-studio
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
          echo 'Job worker and shell niceness: 10; subsequent actions inherit it.'
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
      - name: Sums
        run: shasum -a 256 dafny-*.zip | tee SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "Dafny \`$VERSION\`, built from this tag by the workflow \`review\`."
            echo "What it contains is described in the tag's \`REVIEW.md\`, where there is one."
            echo
            echo "Self-contained binaries for Linux on x64 and for macOS on Apple silicon: they need no .NET."
            echo "\`dafny --version\` prints \`$VERSION\`."
            echo
            echo "Z3 is not included.  CI here verifies with Z3 5.1.0, from Z3's public GitHub release;"
            echo "give Dafny a Z3 with \`--solver-path\`, or put \`z3\` on the PATH."
            echo
            echo "sha256:"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" dafny-*.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$VERSION" --notes-file notes.md

