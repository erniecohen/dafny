# Scratch diagnostic only. Actions success is not proof or runtime acceptance.
# One final shipped product build supplies every measured compiler component.
# No source, contract, literal RUN, proof budget, seed, or expectation is edited.
# Focused lifecycle discovery only; no derived proof or runtime matrix reruns.
# Unfiltered independent adapter inventory; original execution filters remain exact.
name: review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
jobs:
  same-source-lifecycle-discovery:
    if: github.repository == 'erniecohen/dafny' && startsWith(github.ref, 'refs/heads/scratch/')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: actions/setup-dotnet@v4
        continue-on-error: true
        with:
          dotnet-version: 8.0.x
      - name: Materialize the pinned observer inputs
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .same-source-tools same-source-observations/setup
          : > .same-source-tools/spec.json
          : > .same-source-tools/observer.py
          : > .same-source-tools/setup.py
          printf '%s\n' "$HOME/go/bin" >> "$GITHUB_PATH"
