# This fork's CI, in place of upstream's workflows, which exercise every compiler
# backend and run for hours.  It builds Dafny, runs the verifier over Dafny's own test
# programs at a fixed resource limit and reports each program's verdict, verifies
# Dafny's standard library and reports each declaration's verdict, runs the
# regression tests of this line's fixes in upstream's test harness, and on a tag
# publishes self-contained binaries.  Every job that builds first fetches the Boogie
# packages this line builds against (Scripts/fetch-boogie-packages.sh, checked by sha256).
# Standard GitHub-hosted runners only.
name: review

on:
  push:
    branches: ['review/**', 'dev']
    tags: ['v*']
  pull_request:
    branches: ['review/**', 'dev']
  workflow_dispatch:
    inputs:
      binaries:
        description: Also build the self-contained binaries (a release is made only for a tag)
        type: boolean
        default: false

      resolver_probe:
        description: Record resolver outcomes without enforcing their baseline (scratch branches only)
        type: boolean
        default: false

      additional_axioms_probe:
        description: Record initial enabled verdict baselines without enforcing them (scratch branches only)
        type: boolean
        default: false

      b3_integrated_structural_focus:
        description: Current integrated Core and583 structural controls only (scratch branches)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # Z3 5.1.0, from Z3's public GitHub release, checked by sha256.
  Z3_RELEASE: https://github.com/Z3Prover/z3/releases/download/z3-5.1.0
  Z3_LINUX_X64: z3-5.1.0-x64-glibc-2.39
  Z3_LINUX_X64_SHA256: f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a
  Z3_OSX_ARM64: z3-5.1.0-arm64-osx-13.3
  Z3_OSX_ARM64_SHA256: 81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db
  # Upstream's harness runs with the Z3 that the tree's own tests expect, its
  # DefaultZ3Version, from dafny-lang/solver-builds, checked by sha256.
  HARNESS_Z3_RELEASE: https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03
  HARNESS_Z3_4_12_1_SHA256: e07d4193d8e1851114fe4d507332a43576639f4aeaa33c7df15c36426d3cbf3b
  HARNESS_Z3_4_16_0_SHA256: 87de9c9e86c877abfccb00cf24b946c4a1bda7b9cba6f363ea58311d2573c320

jobs:
  build:
    if: ${{ !inputs.b3_integrated_structural_focus }}
    name: Build (Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      revision: ${{ steps.version.outputs.revision }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: sh .github/review/version.sh | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Boogie packages
        run: sh Scripts/fetch-boogie-packages.sh
      - name: Build
        run: |
          dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny \
            -p:SourceRevisionId=${{ steps.version.outputs.revision }}
      - name: Check the version it reports
        run: |
          v=$(dotnet out/dafny/Dafny.dll --version | head -1)
          echo "dafny --version: $v"
          test "$v" = "${{ steps.version.outputs.version }}"
      - name: Check the packaged standard libraries
        run: |
          v=$(sed -n 's/.*DefaultZ3Version = "\(.*\)";.*/\1/p' Source/DafnyCore/DafnyOptions.cs)
          case "$v" in
            4.12.1) sha=$HARNESS_Z3_4_12_1_SHA256 ;;
            4.16.0) sha=$HARNESS_Z3_4_16_0_SHA256 ;;
            *) echo "no checksum here for Z3 $v"; exit 1 ;;
          esac
          curl -fsSLo z3h.zip "$HARNESS_Z3_RELEASE/z3-$v-x64-ubuntu-24.04-bin.zip"
          echo "$sha  z3h.zip" | sha256sum -c -
          mkdir -p z3h && unzip -q z3h.zip -d z3h && chmod +x "z3h/z3-$v"
          "z3h/z3-$v" --version
          python3 .github/review/packaged-libraries.py "$PWD/out/dafny/Dafny" "$PWD/z3h/z3-$v" \
            out/packaged-libraries
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-libraries
          path: |
            out/packaged-libraries/summary.json
            out/packaged-libraries/*/result.json
            out/packaged-libraries/*/stdout.txt
            out/packaged-libraries/*/stderr.txt
            out/packaged-libraries/*/resources.csv
            out/packaged-libraries/*/package-smoke.bin
          retention-days: 14
      - name: Pack
        run: tar -C out -czf dafny.tar.gz dafny
      - uses: actions/upload-artifact@v4
        with:
          name: dafny
          path: dafny.tar.gz
          retention-days: 14

  suite:
    if: ${{ !inputs.b3_integrated_structural_focus }}
    name: Verifier suite (axioms ${{ matrix.axioms }}, shard ${{ matrix.shard }} of 4)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        axioms: ['off', 'on']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: dafny
      - name: Unpack Dafny
        run: mkdir -p out && tar -C out -xzf dafny.tar.gz
      - name: Z3
        run: |
          curl -fsSLo z3.zip "$Z3_RELEASE/$Z3_LINUX_X64.zip"
          echo "$Z3_LINUX_X64_SHA256  z3.zip" | sha256sum -c -
          unzip -q z3.zip && chmod +x "$Z3_LINUX_X64/bin/z3"
          echo "Z3=$PWD/$Z3_LINUX_X64/bin/z3" >> "$GITHUB_ENV"
          "$Z3_LINUX_X64/bin/z3" --version
      - name: Verify
        run: |
          L=Source/IntegrationTests/TestFiles/LitTests/LitTest
          python3 .github/review/lit-verdicts.py plan "$L" plan.tsv
          python3 .github/review/lit-verdicts.py run plan.tsv "$L" "$PWD/out/dafny/Dafny" "$Z3" \
            verdicts-${{ matrix.axioms }}-${{ matrix.shard }}.tsv --shard ${{ matrix.shard }}/4 --jobs 4 \
            --additional-axioms ${{ matrix.axioms == 'on' }} --measurements measurements/${{ matrix.axioms }}
          python3 .github/review/additional-axioms.py inventory measurements/${{ matrix.axioms }} \
            resources-${{ matrix.axioms }}-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdicts-${{ matrix.axioms }}-${{ matrix.shard }}
          path: |
            verdicts-${{ matrix.axioms }}-${{ matrix.shard }}.tsv
            resources-${{ matrix.axioms }}-${{ matrix.shard }}.json
            plan.tsv
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-measurements-${{ matrix.axioms }}-${{ matrix.shard }}
          path: measurements
          compression-level: 9
          retention-days: 90

  verdicts:
    if: ${{ !inputs.b3_integrated_structural_focus }}
    name: Verdicts (axioms ${{ matrix.axioms }})
    needs: [build, suite]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        axioms: ['off', 'on']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: verdicts-${{ matrix.axioms }}-*
          merge-multiple: true
      - name: Merge and summarise
        run: |
          sort verdicts-${{ matrix.axioms }}-*.tsv > verdicts.tsv
          test "$(wc -l < verdicts.tsv)" -eq "$(wc -l < plan.tsv)"
          python3 .github/review/lit-verdicts.py expected verdicts.tsv > expected-verdicts.tsv
          {
            echo "## Verifier suite, axioms ${{ matrix.axioms }}: ${{ needs.build.outputs.version }}"
            echo
            echo "Each program under LitTest/dafny0..4 and git-issues whose first RUN line"
            echo "verifies it, at a resource limit of 16,000,000, with Z3 5.1.0."
            echo
            python3 .github/review/lit-verdicts.py summary verdicts.tsv
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verdicts-${{ matrix.axioms }}
          path: |
            verdicts.tsv
            expected-verdicts.tsv
            plan.tsv
          retention-days: 90
      # A verdict is a program's exit code, summary line and error lines: not its
      # time, and not the resources its finished proofs used.  To change the
      # expected verdicts on purpose, see .github/review/lit-verdicts.py.
      - name: Compare with the expected verdicts
        env:
          PROBE: ${{ inputs.additional_axioms_probe }}
        run: |
          suffix=""
          if [ '${{ matrix.axioms }}' = on ]; then suffix="-additional-axioms"; fi
          python3 .github/review/additional-axioms.py gate suite \
            ".github/review/expected-verdicts$suffix.tsv" verdicts.tsv \
            --mode '${{ matrix.axioms }}' --output comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdict-comparison-${{ matrix.axioms }}
          path: comparison
          retention-days: 90

  resolver:
    if: ${{ !inputs.b3_integrated_structural_focus }}
    name: Resolver matrix (both modes)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: dafny
      - name: Unpack Dafny
        run: mkdir -p out && tar -C out -xzf dafny.tar.gz
      - name: Test axiom gate and resource reporting
        run: python3 -m unittest discover -s .github/review -p test_additional_axioms.py
      - name: Test matrix runner
        run: python3 -m unittest discover -s .github/review -p test_resolver_matrix.py
      - name: Resolve manifest in both modes
        env:
          PROBE: ${{ inputs.resolver_probe }}
        run: |
          extra=()
          if [ "$PROBE" = true ]; then
            case "$GITHUB_REF" in
              refs/heads/scratch/*) extra+=(--probe) ;;
              *) echo "Resolver probes must use a scratch branch"; exit 1 ;;
            esac
          fi
          python3 .github/review/resolver-matrix.py \
            --manifest .github/review/resolver-cases.json \
            --lit-dir Source/IntegrationTests/TestFiles/LitTests/LitTest \
            --dafny out/dafny/Dafny \
            --expected .github/review/expected-resolver-results.json \
            --output resolver-results "${extra[@]}"
      - name: Record known unresolved cases separately
        if: inputs.resolver_probe && startsWith(github.ref, 'refs/heads/scratch/')
        run: |
          python3 .github/review/resolver-matrix.py \
            --manifest .github/review/resolver-probes.json \
            --lit-dir Source/IntegrationTests/TestFiles/LitTests/LitTest \
            --dafny out/dafny/Dafny \
            --expected .github/review/expected-resolver-probes.json \
            --output resolver-probes --probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolver-results
          path: |
            resolver-results/
            resolver-probes/
          retention-days: 90

  stdlib:
    if: ${{ !inputs.b3_integrated_structural_focus }}
    name: Standard library (Z3 ${{ matrix.z3 }}, axioms ${{ matrix.axioms }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # This line's Z3, and the Z3 that the tree's own tests expect (its
        # DefaultZ3Version), with which upstream builds the library.
        z3: ['5.1.0', 'of the tests']
        axioms: ['off', 'on']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: dafny
      - name: Unpack Dafny
        run: mkdir -p out && tar -C out -xzf dafny.tar.gz
      - name: Z3
        run: |
          if [ "${{ matrix.z3 }}" = 5.1.0 ]; then
            curl -fsSLo z3.zip "$Z3_RELEASE/$Z3_LINUX_X64.zip"
            echo "$Z3_LINUX_X64_SHA256  z3.zip" | sha256sum -c -
            unzip -q z3.zip && chmod +x "$Z3_LINUX_X64/bin/z3"
            echo "Z3=$PWD/$Z3_LINUX_X64/bin/z3" >> "$GITHUB_ENV"
            echo "Z3V=5.1.0" >> "$GITHUB_ENV"
          else
            v=$(sed -n 's/.*DefaultZ3Version = "\(.*\)";.*/\1/p' Source/DafnyCore/DafnyOptions.cs)
            case "$v" in
              4.12.1) sha=$HARNESS_Z3_4_12_1_SHA256 ;;
              4.16.0) sha=$HARNESS_Z3_4_16_0_SHA256 ;;
              *) echo "no checksum here for Z3 $v"; exit 1 ;;
            esac
            curl -fsSLo z3h.zip "$HARNESS_Z3_RELEASE/z3-$v-x64-ubuntu-24.04-bin.zip"
            echo "$sha  z3h.zip" | sha256sum -c -
            mkdir -p z3h && unzip -q z3h.zip -d z3h && chmod +x "z3h/z3-$v"
            echo "Z3=$PWD/z3h/z3-$v" >> "$GITHUB_ENV"
            echo "Z3V=$v" >> "$GITHUB_ENV"
          fi
      - name: Verify
        run: |
          "$Z3" --version
          python3 .github/review/std-verdicts.py run Source/DafnyStandardLibraries "$PWD/out/dafny/Dafny" "$Z3" \
            std-verdicts.tsv --cores 4 --additional-axioms ${{ matrix.axioms == 'on' }}
          python3 .github/review/std-verdicts.py expected std-verdicts.tsv > "expected-std-verdicts-z3-$Z3V.tsv"
          {
            echo "## Standard library, axioms ${{ matrix.axioms }}, Z3 $Z3V: ${{ needs.build.outputs.version }}"
            echo
            echo "Source/DafnyStandardLibraries, verified as its Makefile's verify target does, with"
            echo "the library's own resource limits and no time limit."
            echo
            python3 .github/review/std-verdicts.py summary std-verdicts.tsv
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: std-verdicts-${{ matrix.axioms }}-z3-${{ env.Z3V }}
          path: |
            std-verdicts.tsv
            expected-std-verdicts-z3-${{ env.Z3V }}.tsv
          retention-days: 90
      # A declaration's verdict is its outcome; a part's is its exit code, summary line
      # and error lines.  Not times, and not the resources finished proofs used.  To
      # change the expected verdicts on purpose, see .github/review/std-verdicts.py.
      - name: Compare with the expected verdicts
        env:
          PROBE: ${{ inputs.additional_axioms_probe }}
        run: |
          suffix=""
          if [ '${{ matrix.axioms }}' = on ]; then suffix="-additional-axioms"; fi
          python3 .github/review/additional-axioms.py gate std \
            ".github/review/expected-std-verdicts-z3-$Z3V$suffix.tsv" std-verdicts.tsv \
            --mode '${{ matrix.axioms }}' --output comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: std-comparison-${{ matrix.axioms }}-z3-${{ env.Z3V }}
          path: comparison
          retention-days: 90

  axiom-resources:
    name: Additional-axiom resource comparisons
    needs: [suite, stdlib]
    if: ${{ !inputs.b3_integrated_structural_focus && (always() && needs.suite.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: verdicts-*-*
          path: measurements
      - uses: actions/download-artifact@v4
        with:
          pattern: std-verdicts-*
          path: measurements
      - name: Report enabled versus disabled resource counts
        run: python3 .github/review/additional-axioms.py resources measurements resource-comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: additional-axiom-resources
          path: resource-comparison
          retention-days: 90

  regressions:
    if: ${{ !inputs.b3_integrated_structural_focus }}
    name: Regression tests (upstream harness)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: The Z3 the tests expect
        run: |
          v=$(sed -n 's/.*DefaultZ3Version = "\(.*\)";.*/\1/p' Source/DafnyCore/DafnyOptions.cs)
          case "$v" in
            4.12.1) sha=$HARNESS_Z3_4_12_1_SHA256 ;;
            4.16.0) sha=$HARNESS_Z3_4_16_0_SHA256 ;;
            *) echo "no checksum here for Z3 $v"; exit 1 ;;
          esac
          curl -fsSLo z3h.zip "$HARNESS_Z3_RELEASE/z3-$v-x64-ubuntu-24.04-bin.zip"
          echo "$sha  z3h.zip" | sha256sum -c -
          mkdir -p Binaries/z3/bin
          unzip -q z3h.zip -d Binaries/z3/bin
          chmod +x "Binaries/z3/bin/z3-$v"
          "Binaries/z3/bin/z3-$v" --version
      - name: The pinned solver for additional-axiom regressions
        run: |
          curl -fsSLo z3.zip "$Z3_RELEASE/$Z3_LINUX_X64.zip"
          echo "$Z3_LINUX_X64_SHA256  z3.zip" | sha256sum -c -
          unzip -q z3.zip
          cp "$Z3_LINUX_X64/bin/z3" Binaries/z3/bin/z3-5.1.0
          if [ ! -f Binaries/z3/bin/z3-4.12.1 ]; then
            curl -fsSLo z3-4.12.1.zip "$HARNESS_Z3_RELEASE/z3-4.12.1-x64-ubuntu-24.04-bin.zip"
            echo "$HARNESS_Z3_4_12_1_SHA256  z3-4.12.1.zip" | sha256sum -c -
            unzip -q z3-4.12.1.zip -d Binaries/z3/bin
            chmod +x Binaries/z3/bin/z3-4.12.1
          fi
      - name: Boogie packages
        run: sh Scripts/fetch-boogie-packages.sh
      - name: Build the test harness
        run: dotnet build Source/IntegrationTests -c Release
      - name: Cardinality resolver and translation admission tests
        run: |
          dotnet test Source/DafnyCore.Test -c Release --filter FullyQualifiedName~Cardinality
          dotnet test Source/DafnyLanguageServer.Test -c Release --filter FullyQualifiedName~Cardinality
          dotnet test Source/IntegrationTests -c Release --no-build --filter FullyQualifiedName~CardinalityEmissionTests
      - name: Run the tests named in .github/review/regressions
        env:
          DAFNY_INTEGRATION_TESTS_ONLY_COMPILERS: cs
        run: |
          filter=$(grep -v '^#' .github/review/regressions | grep . | sed 's|^|DisplayName~|' | paste -sd'|' -)
          if [ -z "$filter" ]; then echo "no tests named"; exit 0; fi
          echo "$filter"
          dotnet test Source/IntegrationTests -c Release --no-build \
            --logger "console;verbosity=normal" --filter "$filter"
      - name: Literal identities are option guarded and local to each module
        run: dotnet test Source/IntegrationTests -c Release --no-build --filter FullyQualifiedName~AdditionalAxiomsTranslationTests --logger "console;verbosity=normal"
      - name: Editor option changes invalidate verification results
        run: dotnet test Source/DafnyLanguageServer.Test -c Release --filter FullyQualifiedName~AdditionalAxiomsTest --logger "console;verbosity=normal"


  resolver-tests:
    if: ${{ !inputs.b3_integrated_structural_focus }}
    name: Resolver unit tests and language-server recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Boogie packages
        run: sh Scripts/fetch-boogie-packages.sh
      - name: Build resolver and language-server tests
        run: dotnet build Source/DafnyLanguageServer.Test -c Release
      # These tests exercise type resolution only. The language-server tests
      # explicitly disable automatic verification, so this job starts no solver.
      - name: Test redirecting dependencies, numeric ancestry and recovery scopes
        run: |
          dotnet test Source/DafnyCore.Test -c Release --no-build \
            --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName~DafnyCore.Test.RedirectingTypeDependencyTrackerTests|FullyQualifiedName~DafnyCore.Test.NumericAncestryTests|FullyQualifiedName~DafnyCore.Test.ScopeCheckpointTest" \
            --blame-hang --blame-hang-timeout 60s --blame-hang-dump-type none
      - name: Test newtype-cycle edits in both resolver modes
        run: |
          dotnet test Source/DafnyLanguageServer.Test -c Release --no-build \
            --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName~InferredNewtypeCycleTest" \
            --blame-hang --blame-hang-timeout 60s --blame-hang-dump-type none

  binaries:
    name: Binaries (${{ matrix.rid }})
    needs: build
    if: ${{ !inputs.b3_integrated_structural_focus && (github.ref_type == 'tag' || inputs.binaries) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            os: macos-14
          - rid: linux-x64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag must name this tree's version
        if: github.ref_type == 'tag'
        run: |
          echo "tag ${{ github.ref_name }}, version ${{ needs.build.outputs.version }}"
          test "${{ github.ref_name }}" = "v${{ needs.build.outputs.version }}"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Boogie packages
        run: sh Scripts/fetch-boogie-packages.sh
      - name: Publish, self-contained
        env:
          RUNTIME_IDENTIFIER: ${{ matrix.rid }}
        run: |
          dotnet publish Source/Dafny/Dafny.csproj -c Release -r ${{ matrix.rid }} --self-contained \
            -o out/dafny -p:SourceRevisionId=${{ needs.build.outputs.revision }}
          rm -f out/dafny/*.pdb
          mv out/dafny/Dafny out/dafny/dafny
          for f in LICENSE.txt NOTICES.txt REVIEW.md; do if [ -f "$f" ]; then cp "$f" out/dafny/; fi; done
      - name: Check it runs and verifies
        run: |
          case "${{ matrix.rid }}" in
            osx-arm64) z=$Z3_OSX_ARM64; s=$Z3_OSX_ARM64_SHA256 ;;
            linux-x64) z=$Z3_LINUX_X64; s=$Z3_LINUX_X64_SHA256 ;;
          esac
          curl -fsSLo z3.zip "$Z3_RELEASE/$z.zip"
          echo "$s  z3.zip" | shasum -a 256 -c -  # shasum is on both macOS and Ubuntu runners
          unzip -q z3.zip && chmod +x "$z/bin/z3"
          v=$(out/dafny/dafny --version | head -1)
          echo "dafny --version: $v"
          test "$v" = "${{ needs.build.outputs.version }}"
          out/dafny/dafny verify --solver-path "$z/bin/z3" \
            Source/IntegrationTests/TestFiles/LitTests/LitTest/git-issues/git-issue-6537.dfy
      - name: Zip
        run: |
          name=dafny-${{ needs.build.outputs.version }}-${{ matrix.rid }}.zip
          (cd out && zip -qr "../$name" dafny)
          shasum -a 256 "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.rid }}
          path: dafny-*.zip
          retention-days: 14

  release:
    name: GitHub release
    needs: [build, binaries, verdicts, stdlib, regressions, resolver, resolver-tests, axiom-resources]
    if: ${{ !inputs.b3_integrated_structural_focus && (github.ref_type == 'tag') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
      - name: Sums
        run: sha256sum dafny-*.zip | tee SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "Dafny \`$VERSION\`, built from this tag by the workflow \`review\`."
            echo "What it contains is described in the tag's \`REVIEW.md\`, where there is one."
            echo
            echo "Self-contained binaries for macOS on Apple silicon and Linux on x64: they need no .NET."
            echo "\`dafny --version\` prints \`$VERSION\`."
            echo
            echo "Z3 is not included.  CI here verifies with Z3 5.1.0, from Z3's public GitHub release;"
            echo "give Dafny a Z3 with \`--solver-path\`, or put \`z3\` on the PATH."
            echo
            echo "sha256:"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" dafny-*.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$VERSION" --notes-file notes.md

  b3-integrated-structural:
    name: Integrated B3 structural focus (diagnostic receipt)
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/scratch/') && inputs.b3_integrated_structural_focus && !inputs.binaries && !inputs.resolver_probe && !inputs.additional_axioms_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Exact current-source structural coordinator
        env:
          B3_INPUT_B3_INTEGRATED_STRUCTURAL_FOCUS: ${{ inputs.b3_integrated_structural_focus }}
          B3_INPUT_BINARIES: ${{ inputs.binaries }}
          B3_INPUT_RESOLVER_PROBE: ${{ inputs.resolver_probe }}
          B3_INPUT_ADDITIONAL_AXIOMS_PROBE: ${{ inputs.additional_axioms_probe }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, stat, sys, traceback, types
          from pathlib import Path
          path = Path('.github/review/b3-integrated-structural-focus.py')
          expected_bytes = 78732
          expected_sha256 = '64bf521940cc9cc55aca070b760bab0366721e83c59a4b1f317fc9a8fbb45781'
          try:
              assert all(not ancestor.is_symlink() for ancestor in path.parents)
              descriptor = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC)
              try:
                  before = os.fstat(descriptor)
                  assert stat.S_ISREG(before.st_mode) and before.st_size == expected_bytes
                  chunks, remaining = [], expected_bytes
                  while remaining:
                      chunk = os.read(descriptor, min(65536, remaining))
                      assert chunk
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  assert not os.read(descriptor, 1)
                  after = os.fstat(descriptor)
                  assert (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns)
              finally:
                  os.close(descriptor)
              captured = b''.join(chunks)
              assert len(captured) == expected_bytes and hashlib.sha256(captured).hexdigest() == expected_sha256
              module = types.ModuleType('b3_integrated_structural_captured')
              module.__file__ = str(path.resolve(strict=True))
              exec(compile(captured, str(path), 'exec'), module.__dict__)
              assert module.main() == 0
          except Exception as error:
              output = Path('out/b3-integrated-structural')
              output.mkdir(parents=True, exist_ok=True)
              (output / 'startup-failure.json').write_text(json.dumps({'passed': False,
                  'scope': 'integrated-current-source-structural-only',
                  'error': (type(error).__name__ + ': ' + str(error))[:4096],
                  'coordinatorExpectedBytes': expected_bytes, 'coordinatorExpectedSha256': expected_sha256,
                  'executionAcceptance': False}, indent=2) + '\n')
              print('NOT GREEN: structural coordinator startup or preservation failed', flush=True)
          PYCODE
      - name: Bounded structural export selection
        id: structural_export
        if: always()
        run: |
          python3 - <<'PYEXPORT'
          import hashlib, json, os, re, stat, sys, time, types
          expected_inputs = {'bytes': 29696, 'sha256': '20d8b322dafcff9e21bc0b7d151c686fb5605adf561287237ab6e8fc0c8501a0'}
          expected_helper = {'bytes': 36515, 'sha256': '0d98f42cd24892155d40ad9d740081a2702838d9929a5d06e0a0214fc74ecbcf'}
          expected_coordinator = {'bytes': 78732, 'sha256': '64bf521940cc9cc55aca070b760bab0366721e83c59a4b1f317fc9a8fbb45781'}
          source_pins = {'parent': '70fa80cc578b6f54c48f5a0c7ce103a31d7d0a42',
              'product': '450e374a40eb6125b540d55833a9cfe71484ab02',
              'coordinator': expected_coordinator, 'inputs': expected_inputs, 'helper': expected_helper}
          full_packet = metadata_ready = False
          metadata_deadline = time.monotonic() + 60
          directory_flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
          def export_tick():
              assert time.monotonic() < metadata_deadline
          def record(info):
              return (info.st_dev, info.st_ino, info.st_mode, info.st_size, info.st_mtime_ns, info.st_ctime_ns)
          def captured_source(name, expected):
              assert time.monotonic() < metadata_deadline
              parts = name.split('/')
              directory = os.open('.', directory_flags)
              try:
                  for part in parts[:-1]:
                      child = os.open(part, directory_flags, dir_fd=directory)
                      os.close(directory)
                      directory = child
                  descriptor = os.open(parts[-1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC, dir_fd=directory)
                  try:
                      before = os.fstat(descriptor)
                      assert stat.S_ISREG(before.st_mode) and before.st_size == expected['bytes'] <= 1024 * 1024
                      chunks, remaining, attempted = [], expected['bytes'], 0
                      while remaining:
                          assert time.monotonic() < metadata_deadline
                          request = min(65536, remaining)
                          attempted += request
                          assert attempted <= expected['bytes']
                          chunk = os.read(descriptor, request)
                          assert len(chunk) == request
                          chunks.append(chunk)
                          remaining -= len(chunk)
                      assert not os.read(descriptor, 1) and record(os.fstat(descriptor)) == record(before)
                      assert record(os.stat(parts[-1], dir_fd=directory, follow_symlinks=False)) == record(before)
                  finally:
                      os.close(descriptor)
              finally:
                  os.close(directory)
              data = b''.join(chunks)
              assert hashlib.sha256(data).hexdigest() == expected['sha256']
              assert time.monotonic() < metadata_deadline
              return data
          def rejected_packet(error_type):
              export_tick()
              # No original metadata is invented when startup/preservation was unavailable.
              head = os.environ.get('GITHUB_SHA', '')
              head = head if re.fullmatch('[0-9a-f]{40}', head) else None
              packet = {'schemaVersion': 1, 'scope': 'integrated-current-source-structural-export-only',
                  'exportAdmitted': False, 'fullPacketSelectedForUpload': False, 'structuralAcceptance': False,
                  'backendAccepted': False, 'completeLibraryVerified': False, 'libraryBinaryProduced': False,
                  'workerRuntimeVerified': False, 'cliVerified': False, 'corpusVerified': False,
                  'regressionRuntimeVerified': False, 'defaultCompatibilityVerified': False,
                  'head': head, 'headEvidence': 'workflow-dispatch-metadata-only', 'sourcePins': source_pins,
                  'exportFault': {'category': 'export-startup-or-preservation', 'errorType': error_type[:128]},
                  'originalSummary': {'captured': False, 'interpretationStatus': 'unavailable'},
                  'originalSummaryPassed': {'status': 'unavailable'}, 'originalPrimaryFailure': {'status': 'unavailable'},
                  'originalFinalError': {'status': 'unavailable'}, 'originalArtifactFailure': {'status': 'unavailable'},
                  'originalInventory': {'complete': False}, 'maximumMetadataPacketBytes': 65536,
                  'preservationScope': 'Bounded own descriptor write/size; no selfhash or future completed-read claim',
                  'timingScope': 'Selected metadata only; no uploader/service acknowledgement'}
              data = (json.dumps(packet, sort_keys=True, separators=(',', ':'), ensure_ascii=True) + '\n').encode()
              assert len(data) <= 16384
              export_tick()
              base = os.open('.', directory_flags)
              out = metadata = descriptor = None
              try:
                  try: os.mkdir('out', 0o700, dir_fd=base)
                  except FileExistsError: pass
                  export_tick()
                  out = os.open('out', directory_flags, dir_fd=base)
                  try: os.mkdir('b3-integrated-structural-export', 0o700, dir_fd=out)
                  except FileExistsError: pass
                  export_tick()
                  metadata = os.open('b3-integrated-structural-export', directory_flags, dir_fd=out)
                  out_identity, metadata_identity = record(os.fstat(out))[:3], record(os.fstat(metadata))[:3]
                  count = 0
                  with os.scandir(metadata) as entries:
                      for entry in entries:
                          export_tick()
                          count += 1
                          assert count == 1 and entry.name == 'export.json'
                  flags = os.O_WRONLY | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC
                  try: before = os.stat('export.json', dir_fd=metadata, follow_symlinks=False)
                  except FileNotFoundError:
                      descriptor = os.open('export.json', flags | os.O_CREAT | os.O_EXCL, 0o600, dir_fd=metadata)
                  else:
                      assert stat.S_ISREG(before.st_mode) and before.st_size <= 65536
                      descriptor = os.open('export.json', flags, dir_fd=metadata)
                      assert record(os.fstat(descriptor)) == record(before)
                  export_tick()
                  os.ftruncate(descriptor, 0)
                  assert os.write(descriptor, data) == len(data)
                  export_tick()
                  after = os.fstat(descriptor)
                  assert stat.S_ISREG(after.st_mode) and after.st_size == len(data)
                  assert record(os.stat('export.json', dir_fd=metadata, follow_symlinks=False)) == record(after)
                  assert record(os.stat('out', dir_fd=base, follow_symlinks=False))[:3] == out_identity
                  assert record(os.stat('b3-integrated-structural-export', dir_fd=out, follow_symlinks=False))[:3] == metadata_identity
                  count = 0
                  with os.scandir(metadata) as entries:
                      for entry in entries:
                          export_tick()
                          count += 1
                          assert count == 1 and entry.name == 'export.json'
                  assert count == 1
                  assert record(os.stat('export.json', dir_fd=metadata, follow_symlinks=False)) == record(after)
                  export_tick()
                  return True
              finally:
                  for descriptor in [descriptor, metadata, out, base]:
                      if descriptor is not None: os.close(descriptor)
          try:
              inputs = json.loads(captured_source('.github/review/b3-integrated-structural-inputs.json', expected_inputs))
              assert inputs['exportAdmission']['helper'] == {'path': '.github/review/b3-integrated-structural-export.py', **expected_helper}
              captured = captured_source('.github/review/b3-integrated-structural-export.py', expected_helper)
              module = types.ModuleType('b3_integrated_structural_export')
              exec(compile(captured, '.github/review/b3-integrated-structural-export.py', 'exec'), module.__dict__)
              decision = module.run_export(source_pins, os.environ.get('GITHUB_SHA', ''), metadata_deadline)
              assert type(decision) is dict and set(decision) == {'full_packet', 'metadata_ready'}
              assert all(type(value) is bool for value in decision.values())
              full_packet, metadata_ready = decision['full_packet'], decision['metadata_ready']
              assert not full_packet or metadata_ready
              if not metadata_ready:
                  metadata_ready = rejected_packet('BoundedExportPreservationUnavailable')
          except BaseException as error:
              full_packet = False
              try: metadata_ready = rejected_packet(type(error).__name__)
              except BaseException: metadata_ready = False
          finally:
              # Missing output is also false in both artifact conditions.
              with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
                  stream.write('full_packet=' + ('true' if full_packet and metadata_ready else 'false') + '\n')
                  stream.write('metadata_ready=' + ('true' if metadata_ready else 'false') + '\n')
              print('Full packet selected' if full_packet and metadata_ready else 'NOT GREEN: bounded metadata-only selection' if metadata_ready else 'NOT GREEN: no bounded export packet available', flush=True)
          PYEXPORT
      - name: Upload admitted bounded structural packet
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.structural_export.outputs.full_packet == 'true' && steps.structural_export.outputs.metadata_ready == 'true' }}
        with:
          name: b3-integrated-structural
          path: |
            out/b3-integrated-structural
            out/b3-integrated-structural-export/export.json
          retention-days: 30
      - name: Upload bounded unqualified export rejection
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.structural_export.outputs.full_packet != 'true' && steps.structural_export.outputs.metadata_ready == 'true' }}
        with:
          name: b3-integrated-structural
          path: out/b3-integrated-structural-export/export.json
          retention-days: 30
