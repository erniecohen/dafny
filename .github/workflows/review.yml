name: issue113 canonical CSharp runtime retention
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: dev-final
            source: 500df6ecd0680991d4ce4732cfe305a6ba319dfb
          - label: shipped-final
            source: c0be11fdc0ac64412923d4277f6075834c953860
    steps:
      - uses: actions/checkout@v4
        with:
          path: capture-source
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          path: compiler
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the exact canonical harness solver inputs before building IntegrationTests
        shell: bash
        run: |
          set -euo pipefail
          solver_release=https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03
          default_solver=$(sed -n 's/.*DefaultZ3Version = "\(.*\)";.*/\1/p' compiler/Source/DafnyCore/DafnyOptions.cs)
          mkdir -p compiler/Binaries/z3/bin
          for solver_version in "$default_solver" 4.12.1; do
            if [ -f "compiler/Binaries/z3/bin/z3-$solver_version" ]; then continue; fi
            case "$solver_version" in
              4.12.1) expected_sha=e07d4193d8e1851114fe4d507332a43576639f4aeaa33c7df15c36426d3cbf3b ;;
              4.16.0) expected_sha=87de9c9e86c877abfccb00cf24b946c4a1bda7b9cba6f363ea58311d2573c320 ;;
              *) echo "No canonical checksum for $solver_version"; exit 1 ;;
            esac
            archive="z3-harness-$solver_version.zip"
            curl -fsSLo "$archive" "$solver_release/z3-$solver_version-x64-ubuntu-24.04-bin.zip"
            echo "$expected_sha  $archive" | sha256sum -c -
            unzip -q "$archive" -d compiler/Binaries/z3/bin
            chmod +x "compiler/Binaries/z3/bin/z3-$solver_version"
          done
          curl -fsSLo z3-5.1.0.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo "f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3-5.1.0.zip" | sha256sum -c -
          unzip -q z3-5.1.0.zip
          cp z3-5.1.0-x64-glibc-2.39/bin/z3 compiler/Binaries/z3/bin/z3-5.1.0
          chmod +x compiler/Binaries/z3/bin/z3-5.1.0
      - name: Preserve strict canonical C# ordinary and external-runtime artifacts
        run: |
          python3 capture-source/.github/review/issue113-canonical-runtime/capture.py \
            --repo compiler --out out/capture --label '${{ matrix.label }}' --source-sha '${{ matrix.source }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue113-canonical-runtime-${{ matrix.label }}
          path: out/capture
          include-hidden-files: true
          retention-days: 14
