name: review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Solver
        run: |
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          unzip -q z3.zip
          chmod +x z3-5.1.0-x64-glibc-2.39/bin/z3
      - name: Record build and unit outcomes
        run: |
          mkdir -p out/diagnostic
          set +e
          dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:GeneratePackageOnBuild=false > out/diagnostic/build.log 2>&1
          result=$?
          echo "$result" > out/diagnostic/build.exit
          if [ "$result" -eq 0 ]; then
            OBLIGATION_INVENTORY_CAPTURE=out/diagnostic/obligation-producers.json dotnet test Source/DafnyCore.Test/DafnyCore.Test.csproj -c Release --filter 'FullyQualifiedName~Obligation' > out/diagnostic/tests.log 2>&1
            echo "$?" > out/diagnostic/tests.exit
          fi
          cat out/diagnostic/build.exit
          tail -n 20 out/diagnostic/build.log
          if [ -f out/diagnostic/tests.log ]; then
            cat out/diagnostic/tests.exit
            tail -n 35 out/diagnostic/tests.log
          fi
          if [ "$result" -eq 0 ]; then
            python3 .github/review/assertion-invariance.py out/dafny/Dafny z3-5.1.0-x64-glibc-2.39/bin/z3 out/diagnostic/behavior
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue100-development
          path: out/diagnostic
