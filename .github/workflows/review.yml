        run: |
          v=$(sed -n 's/.*DefaultZ3Version = "\(.*\)";.*/\1/p' Source/DafnyCore/DafnyOptions.cs)
          solver=$(sh .github/review/setup-z3.sh "$v")
          mkdir -p Binaries/z3/bin
          cp "$solver" "Binaries/z3/bin/z3-$v"
          sh Scripts/fetch-boogie-packages.sh
      - name: Build the harness
        run: dotnet build Source/IntegrationTests -c Release
      - name: Check the regression partition and run Linux-specific tests
        env:
          DAFNY_INTEGRATION_TESTS_ONLY_COMPILERS: cs
        run: |
          python3 -m unittest discover -s .github/review -p test_regression_filter.py
          filter=$(python3 .github/review/regression-filter.py linux)
          dotnet test --settings .github/review/ci.runsettings Source/IntegrationTests -c Release --no-build \
            --logger "console;verbosity=normal" --filter "$filter" | tee test.log
          grep -Eq 'Total( tests)?: *1([^0-9]|$)' test.log

      - name: Check persistent result replay with the Linux native dependency closure
        run: |
          solver=$(sh .github/review/setup-z3.sh 5.1.0 ci-z3-cache)
          python3 .github/review/verification-cache.py Binaries/net10.0/Dafny.dll "$solver" \
            Source/IntegrationTests/TestFiles/LitTests/LitTest/git-issues/git-issue-241-verification-cache.dfy \
            verification-cache-linux
          python3 .github/review/verification-cache-cutoff.py Binaries/net10.0/Dafny.dll "$solver" \
            Source/IntegrationTests/TestFiles/LitTests/LitTest/git-issues/Inputs/git-issue-241-cache-cutoff.dfy \
            verification-cache-cutoff-linux
          # Key coverage, planted entries and the resource-limit boundaries u, u-1, L and L+1
