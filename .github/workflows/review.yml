  regressions-linux:
    name: Regression tests with Linux resource expectations
    if: ${{ ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!inputs.platform_parity && !(github.event_name == 'workflow_dispatch' && inputs.default_comparison && startsWith(github.ref, 'refs/heads/scratch/')))) && needs.tree.outputs.reuse != 'true' }}
    needs: tree
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
