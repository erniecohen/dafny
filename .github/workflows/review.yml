# Scratch diagnostic: inspect actual classifications and phase exits.
name: issue104 existing run build-alias comparison
on:
  workflow_dispatch:
    inputs:
      repaired_sha:
        description: Full immutable SHA of the minimal dev repair and registered controls
        required: true
        type: string
permissions:
  contents: read
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: original
            source: 97601b75712f458de37a13bf9953a0b7825122eb
          - label: repaired
            source: ${{ inputs.repaired_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: capture-source
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source }}
          path: compiler
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Capture actual sixteen-case outcomes and strict repaired registration
        run: |
          set +e
          python3 capture-source/.github/review/issue104-build-alias/focused-capture.py \
            --repo compiler --out out/capture --label '${{ matrix.label }}' --source-sha '${{ matrix.source }}'
          status=$?
          mkdir -p out/capture
          echo "$status" > out/capture/capture-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue104-build-alias-${{ matrix.label }}
          path: out/capture
          include-hidden-files: true
          retention-days: 14
