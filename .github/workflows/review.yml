name: review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: Recorded dependency allocation diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        continue-on-error: true
        with:
          dotnet-version: 8.0.x
      - name: Record source and build
        run: |
          mkdir -p results
          git rev-parse HEAD > results/source.txt
          git rev-parse HEAD^ > results/candidate.txt
          set +e
          sh Scripts/fetch-boogie-packages.sh > results/boogie-fetch.txt 2>&1
          echo "$?" > results/boogie-fetch-exit.txt
          timeout 900 dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny > results/build.txt 2>&1
          result=$?
          echo "$result" > results/build-exit.txt
          tail -20 results/build.txt
          echo "Build diagnostic exit: $result" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Pinned solver and recorded cases
        run: |
          set +e
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip > results/solver-download.txt 2>&1
          download=$?
          echo "$download" > results/solver-download-exit.txt
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c - > results/solver-checksum.txt 2>&1
          checksum=$?
          echo "$checksum" > results/solver-checksum-exit.txt
          if [ "$download" = 0 ] && [ "$checksum" = 0 ] && [ "$(cat results/build-exit.txt)" = 0 ]; then
            unzip -q z3.zip
            chmod +x z3-5.1.0-x64-glibc-2.39/bin/z3
            python3 .github/review/dependency-132.py "$PWD/out/dafny/Dafny" "$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" results/cases > results/probes.txt 2>&1
            echo "$?" > results/probes-exit.txt
            cat results/probes.txt
          else
            echo 'Cases skipped because a prerequisite failed.' > results/probes.txt
          fi
          echo "Solver download exit: $download; checksum exit: $checksum" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: issue113-dependency-132
          path: results
          retention-days: 30
