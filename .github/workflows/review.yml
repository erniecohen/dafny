name: review
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Record candidate dependency build and original issue runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p probe
          set +e
          gh run download 37137615068 -R erniecohen/boogie -n packages -D Binaries/boogie-packages > probe/download.log 2>&1
          download=$?
          echo "Package download exit: $download" >> "$GITHUB_STEP_SUMMARY"
          if [ "$download" != 0 ]; then exit 0; fi
          (cd Binaries/boogie-packages && sha256sum -c SHA256SUMS) > probe/checksums.log 2>&1
          sums=$?
          echo "Package checksum exit: $sums" >> "$GITHUB_STEP_SUMMARY"
          if [ "$sums" != 0 ]; then exit 0; fi
          sed -i 's/3.5.5-review.37e4435d/3.5.5-review.4d16c827/g' Source/DafnyCore/DafnyCore.csproj dotnet-tools.json
          dotnet publish Source/DafnyDriver/DafnyDriver.csproj -c Release -o out/dafny > probe/build.log 2>&1
          build=$?
          echo "Dafny build exit: $build" >> "$GITHUB_STEP_SUMMARY"
          if [ "$build" != 0 ]; then exit 0; fi
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c - > probe/z3-checksum.log 2>&1
          sums=$?
          echo "Z3 checksum exit: $sums" >> "$GITHUB_STEP_SUMMARY"
          if [ "$sums" != 0 ]; then exit 0; fi
          unzip -q z3.zip
          export Z3="$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3"
          "$Z3" --version > probe/z3-version.txt
          python3 .github/review/issue30-probe.py > probe/runner.log 2>&1
          echo "Probe runner exit: $?" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: issue-30-dafny-probe
          path: probe/
