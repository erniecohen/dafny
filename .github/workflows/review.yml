name: review
on:
  workflow_dispatch:
    inputs:
      extended:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    name: Recorded newtype diagnostic probes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
      - name: Runtime dependencies
        run: |
          npm install bignumber.js@9.1.2
          go install golang.org/x/tools/cmd/goimports@v0.31.0
      - name: Record source and build
        run: |
          mkdir -p results
          git rev-parse HEAD > results/source.txt
          if [ -f Scripts/fetch-boogie-packages.sh ]; then sh Scripts/fetch-boogie-packages.sh; fi
          set +e
          dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny > results/build.txt 2>&1
          result=$?
          echo "$result" > results/build-exit.txt
          tail -20 results/build.txt
          exit 0
      - name: Pinned solver and diagnostic cases
        run: |
          set +e
          curl --retry 3 --retry-all-errors -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip > results/solver-download.txt 2>&1
          result=$?
          echo "$result" > results/solver-download-exit.txt
          if [ "$result" != 0 ]; then
            cat results/solver-download.txt
            echo 'Solver download failed; no proofs ran.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          result=$?
          echo "$result" > results/solver-checksum-exit.txt
          if [ "$result" != 0 ]; then exit 0; fi
          unzip -q z3.zip
          result=$?
          echo "$result" > results/solver-unzip-exit.txt
          if [ "$result" != 0 ]; then exit 0; fi
          chmod +x z3-5.1.0-x64-glibc-2.39/bin/z3
          if [ "$(cat results/build-exit.txt)" = 0 ]; then
            extra=''
            if [ '${{ inputs.extended }}' = true ]; then extra=--extended; fi
            python3 .github/review/extended-newtype-bases.py "$PWD/out/dafny/Dafny" "$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" results/cases $extra
            echo "$?" > results/probes-exit.txt
          fi
          exit 0
      - name: Recorded registered issue 142 regression tests
        env:
          DAFNY_INTEGRATION_TESTS_ONLY_COMPILERS: cs,js,py,go,java
          DAFNY_EXTRA_TEST_ARGUMENTS: --solver-path=z3/bin/z3-5.1.0
        run: |
          if [ "$(cat results/build-exit.txt)" != 0 ]; then exit 0; fi
          if [ "$(cat results/solver-checksum-exit.txt)" != 0 ]; then exit 0; fi
          mkdir -p Binaries/z3/bin
          cp z3-5.1.0-x64-glibc-2.39/bin/z3 Binaries/z3/bin/z3-5.1.0
          cp z3-5.1.0-x64-glibc-2.39/bin/z3 Binaries/z3/bin/z3-4.12.1
          cp z3-5.1.0-x64-glibc-2.39/bin/z3 Binaries/z3/bin/z3-4.16.0
          Binaries/z3/bin/z3-5.1.0 --version > results/registered-solver.txt
          set +e
          dotnet test Source/IntegrationTests -c Release --filter 'DisplayName~git-issue-142' --logger 'console;verbosity=normal' > results/registered-142.txt 2>&1
          echo "$?" > results/registered-142-exit.txt
          tail -60 results/registered-142.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue113-diagnostics
          path: results
          retention-days: 30
