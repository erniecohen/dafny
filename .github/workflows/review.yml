# Diagnostic binary reuse only. No build or golden update. Wrapper success is
# never a proof verdict; exact canonical receipts retain their scope.
name: review
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
jobs:
  native-law-safety-reuse:
    if: github.repository == 'erniecohen/dafny' && startsWith(github.ref, 'refs/heads/scratch/')
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          path: diagnostic
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: c1a360c4f77534ae2485049c880eb85e05d88989
          path: frozen
      - uses: actions/setup-dotnet@v4
        continue-on-error: true
        with:
          dotnet-version: 8.0.425
      - uses: actions/setup-java@v4
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        continue-on-error: true
        with:
          go-version: '1.24.1'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repository: erniecohen/dafny
          run-id: 37263875970
          name: issue113-same-source-compiler
          path: artifacts/harness
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          repository: erniecohen/dafny
          run-id: 37347177735
          name: default-off-compilers-shipped
          path: artifacts/candidate
      - name: Record immutable artifact identities and install runtime prerequisites
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p native-law-safety-observations/setup
          gh api repos/erniecohen/dafny/actions/artifacts/11326237732 > native-law-safety-observations/setup/old-artifact.json
          gh api repos/erniecohen/dafny/actions/artifacts/11361575690 > native-law-safety-observations/setup/candidate-artifact.json
          npm --prefix frozen install --no-save --package-lock=false bignumber.js@9.1.2 > native-law-safety-observations/setup/npm-stdout.txt 2> native-law-safety-observations/setup/npm-stderr.txt
          printf '%s\n' "$HOME/go/bin" >> "$GITHUB_PATH"
          go install golang.org/x/tools/cmd/goimports@v0.31.0 > native-law-safety-observations/setup/goimports-stdout.txt 2> native-law-safety-observations/setup/goimports-stderr.txt
          curl -fsSL --retry 2 --max-time 200 -o native-law-safety-observations/setup/z3-5.1.0.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          curl -fsSL --retry 2 --max-time 200 -o native-law-safety-observations/setup/z3-4.12.1.zip https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-4.12.1-x64-ubuntu-24.04-bin.zip
      - name: Prepare exact old harness with candidate compiler overlay
        if: always()
        continue-on-error: true
        run: python3 diagnostic/.github/review/native-law-safety/reuse.py prepare
      - name: Independently discover unchanged source-root cases
        if: always()
        continue-on-error: true
        run: python3 diagnostic/.github/review/native-law-safety/reuse.py discover
      - name: Run original 97-root literal harness with its original oracles
        if: always()
        continue-on-error: true
        run: python3 diagnostic/.github/review/native-law-safety/reuse.py run
      - name: Record diagnostic report without upgrading acceptance
        if: always()
        continue-on-error: true
        run: python3 diagnostic/.github/review/native-law-safety/reuse.py report
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: native-law-safety-reuse-observations
          retention-days: 14
          path: |
            native-law-safety-observations
            frozen/Source/IntegrationTests/bin/Release/net8.0/TestFiles/LitTests/LitTest/**/Output/**
            diagnostic/.github/review/native-law-safety/spec.json
            diagnostic/.github/review/native-law-safety/cohort/cohort.json
            diagnostic/.github/review/native-law-safety/supplemental/*.dfy
      - name: Keep the diagnostic workflow status separate from raw verdicts
        if: always()
        run: |
          printf '%s\n' 'Raw canonical results are retained in the artifact. Derived semantic and supplemental projections are not executed here. No source adoption or complete gate verdict is implied.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
