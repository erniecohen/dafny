name: Issue 165 exact-argument native law focused diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: issue165-native-law-focus-${{ github.ref }}
  cancel-in-progress: false
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
jobs:
  plan:
    if: github.repository == 'erniecohen/dafny' && startsWith(github.ref, 'refs/heads/scratch/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Scratch repository and branch boundary
        id: boundary
        continue-on-error: true
        run: |
          mkdir -p plan-metadata
          set +e
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          allowed=os.environ.get('GITHUB_REPOSITORY')=='erniecohen/dafny' and os.environ.get('GITHUB_REF','').startswith('refs/heads/scratch/')
          Path('plan-metadata/boundary.json').write_text(json.dumps(dict(repository=os.environ.get('GITHUB_REPOSITORY'),ref=os.environ.get('GITHUB_REF'),source_commit=os.environ.get('GITHUB_SHA'),authorized_scratch=allowed),indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('authorized='+str(allowed).lower()+'\n')
          raise SystemExit(0 if allowed else 125)
          PY
          echo "$?" > plan-metadata/boundary-exit.txt
          exit 0
      - uses: actions/checkout@v4
        continue-on-error: true
        id: diagnostic_2
      - name: Explicit requested workload
        id: matrix
        if: steps.boundary.outputs.authorized == 'true'
        continue-on-error: true
        run: |
          mkdir -p plan-metadata
          set +e
          python3 .github/review/issue113-default-off/focus_matrix.py workflow-request.json --candidate 'true' --github-output > plan-metadata/matrix.txt 2>&1
          echo "$?" > plan-metadata/matrix-exit.txt
          exit 0
      - name: Retain raw diagnostic step outcomes
        continue-on-error: true
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set +e
          mkdir -p plan-metadata
          python3 - <<'PY_STEP_OUTCOMES'
          import os
          from pathlib import Path
          Path('plan-metadata/step-outcomes.json').write_text(os.environ["STEP_OUTCOMES"] + "\n")
          PY_STEP_OUTCOMES
          exit 0
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        id: diagnostic_4
        if: always()
        with:
          name: default-off-workflow-request
          path: |
            workflow-request.json
            plan-metadata
          retention-days: 30
  compilers:
    if: always() && github.repository == 'erniecohen/dafny' && startsWith(github.ref, 'refs/heads/scratch/')
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        id: diagnostic_1
        with:
          path: harness
      - uses: actions/setup-dotnet@v4
        continue-on-error: true
        id: diagnostic_2
        with:
          dotnet-version: 8.0.425
      - name: Fresh public compiler artifact API provenance
        id: diagnostic_3
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reused-compilers results
          set +e
          gh api repos/erniecohen/dafny/actions/artifacts/11361575690 > results/artifact-api.json 2> results/artifact-api-stderr.txt
          echo "$?" > results/artifact-api-exit.txt
          python3 harness/.github/review/issue113-default-off/reuse_compiler.py check-api results/artifact-api.json > results/artifact-api-check.txt 2>&1
          echo "$?" > results/artifact-api-check-exit.txt
          exit 0
      - uses: actions/download-artifact@v4
        id: diagnostic_4
        continue-on-error: true
        with:
          name: default-off-compilers-shipped
          run-id: 37347177735
          github-token: ${{ github.token }}
          path: reused-compilers
      - name: Three exact retained public compilers, no rebuild
        id: diagnostic_5
        continue-on-error: true
        run: |
          mkdir -p results/baseline results/final results/candidate
          git -C harness rev-parse HEAD > results/harness-source.txt
          cp results/artifact-api.json reused-compilers/artifact-api.json
          echo "$?" > results/fresh-artifact-api-copy-exit.txt
          set +e
          for side in baseline final candidate; do
            python3 harness/.github/review/issue113-default-off/reuse_compiler.py reuse "$side" reused-compilers "out/$side/dafny" "results/$side" > "results/$side/identity.txt" 2>&1
            identity_exit=$?
            echo "$identity_exit" > "results/$side/identity-exit.txt"
            if [ "$identity_exit" != 0 ]; then continue; fi
            "out/$side/dafny/Dafny" --version > "results/$side/compiler-version.txt" 2>&1
            version_exit=$?
            echo "$version_exit" > "results/$side/compiler-version-exit.txt"
            if [ "$version_exit" != 0 ]; then continue; fi
            python3 - "$side" <<'PYCODE'
          import json,sys
          from pathlib import Path
          side=sys.argv[1]
          record=json.loads(Path('harness/.github/review/issue113-default-off/reused-compilers.json').read_text())['arms'][side]
          raise SystemExit(0 if Path('results',side,'compiler-version.txt').read_text().strip()==record['actual_version'] else 1)
          PYCODE
            guard_exit=$?
            if [ "$side" = candidate ]; then
              echo "$guard_exit" > "results/$side/candidate-version-guard-exit.txt"
            else
              echo "$guard_exit" > "results/$side/reused-version-guard-exit.txt"
            fi
          done
          exit 0
      - name: Retain raw diagnostic step outcomes
        continue-on-error: true
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set +e
          mkdir -p results
          python3 - <<'PY_STEP_OUTCOMES'
          import os
          from pathlib import Path
          Path('results/step-outcomes.json').write_text(os.environ["STEP_OUTCOMES"] + "\n")
          PY_STEP_OUTCOMES
          exit 0
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        id: diagnostic_6
        if: always()
        with:
          name: default-off-compilers-shipped
          path: results
          retention-days: 30
  paired:
    if: always() && github.repository == 'erniecohen/dafny' && startsWith(github.ref, 'refs/heads/scratch/') && needs.plan.outputs.matrix != ''
    needs: [compilers, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        id: diagnostic_1
        with:
          path: harness
      - name: Original input pin
        id: pin
        env:
          LINE: ${{ matrix.line }}
        continue-on-error: true
        run: |
          set +e
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          source=json.loads(Path('harness/.github/review/issue113-default-off/spec.json').read_text())['lines'][os.environ['LINE']]
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write('old='+source['original']+'\n')
          PY
          exit 0
      - uses: actions/checkout@v4
        continue-on-error: true
        id: diagnostic_3
        with:
          ref: ${{ steps.pin.outputs.old }}
          path: inputs
      - uses: actions/setup-dotnet@v4
        continue-on-error: true
        id: diagnostic_4
        with:
          dotnet-version: 8.0.425
      - uses: actions/download-artifact@v4
        continue-on-error: true
        id: diagnostic_5
        with:
          name: default-off-compilers-${{ matrix.line }}
          path: compilers
      - name: Pinned solver and source-input receipt
        id: diagnostic_6
        env:
          LINE: ${{ matrix.line }}
          SOLVER_AXIS: ${{ matrix.solver }}
        continue-on-error: true
        run: |
          set +e
          mkdir -p setup
          python3 harness/.github/review/issue113-default-off/prepare.py inputs "$LINE" inputs setup/inputs.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          spec=json.loads(Path('harness/.github/review/issue113-default-off/spec.json').read_text())
          version='5.1.0' if os.environ['SOLVER_AXIS']=='5.1.0' else spec['lines'][os.environ['LINE']]['reference_solver']
          solver=spec['solver_5_1_0'] if version=='5.1.0' else spec['reference_solvers'][version]
          Path('setup/solver.json').write_text(json.dumps(dict(version=version,**solver),indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as output:
            output.write('SOLVER_URL='+solver['url']+'\nSOLVER_SHA='+solver['sha256']+'\nSOLVER_VERSION='+version+'\n')
          PY
          exit 0
      - name: Download and check the pinned solver
        id: diagnostic_7
        continue-on-error: true
        run: |
          set +e
          curl --retry 3 --retry-all-errors -fsSLo setup/solver.zip "$SOLVER_URL"
          echo "$?" > setup/solver-download-exit.txt
          echo "$SOLVER_SHA  setup/solver.zip" | sha256sum -c - > setup/solver-checksum.txt 2>&1
          checksum_exit=$?
          echo "$checksum_exit" > setup/solver-checksum-exit.txt
          if [ "$checksum_exit" = 0 ]; then
            unzip -q setup/solver.zip -d solver
            echo "$?" > setup/solver-unzip-exit.txt
            if [ "$SOLVER_VERSION" = 5.1.0 ]; then
              solver_executable="$PWD/solver/z3-5.1.0-x64-glibc-2.39/bin/z3"
            else
              solver_executable="$PWD/solver/z3-$SOLVER_VERSION"
            fi
            chmod +x "$solver_executable"
            "$solver_executable" --version > setup/solver-version.txt 2>&1
            echo "$?" > setup/solver-version-exit.txt
            echo "SOLVER=$solver_executable" >> "$GITHUB_ENV"
          fi
          exit 0
      - name: Pinned review solver for separate literal82 cohort
        id: diagnostic_8
        if: matrix.cohort == 'repair82-literal'
        continue-on-error: true
        run: |
          set +e
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          item=json.loads(Path('harness/.github/review/issue113-default-off/spec.json').read_text())['solver_5_1_0']
          with open(os.environ['GITHUB_ENV'],'a') as output:
            output.write('REVIEW_SOLVER_URL='+item['url']+'\nREVIEW_SOLVER_SHA='+item['sha256']+'\n')
          PYCODE
          echo "$?" > setup/review-solver-selection-exit.txt
          exit 0
      - name: Download the separately pinned literal82 review solver
        id: diagnostic_9
        if: matrix.cohort == 'repair82-literal'
        continue-on-error: true
        run: |
          set +e
          curl --retry 3 --retry-all-errors -fsSLo setup/review-solver.zip "$REVIEW_SOLVER_URL"
          echo "$?" > setup/review-solver-download-exit.txt
          echo "$REVIEW_SOLVER_SHA  setup/review-solver.zip" | sha256sum -c - > setup/review-solver-checksum.txt 2>&1
          checksum_exit=$?
          echo "$checksum_exit" > setup/review-solver-checksum-exit.txt
          if [ "$checksum_exit" = 0 ]; then
            unzip -q setup/review-solver.zip -d review-solver
            echo "$?" > setup/review-solver-unzip-exit.txt
            review_solver="$PWD/review-solver/z3-5.1.0-x64-glibc-2.39/bin/z3"
            chmod +x "$review_solver"
            "$review_solver" --version > setup/review-solver-version.txt 2>&1
            echo "$?" > setup/review-solver-version-exit.txt
            echo "REVIEW_SOLVER=$review_solver" >> "$GITHUB_ENV"
          fi
          exit 0
      - name: Matched old-source compiler pairs
        id: diagnostic_10
        env:
          LINE: ${{ matrix.line }}
          COHORT: ${{ matrix.cohort }}
          MODE: ${{ matrix.mode }}
          AXIOMS: ${{ matrix.axioms }}
          SHARD: ${{ matrix.shard }}
          PART: ${{ matrix.part }}
          JOBS: ${{ matrix.jobs }}
          INCLUDE_CANDIDATE: 'true'
        continue-on-error: true
        run: |
          mkdir -p run-metadata
          set +e
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          required=[Path('setup/solver-checksum-exit.txt'),Path('setup/solver-unzip-exit.txt'),Path('setup/solver-version-exit.txt')]
          if os.environ['COHORT']=='repair82-literal':
            required += [Path('setup/review-solver-'+name+'-exit.txt') for name in ['selection','download','checksum','unzip','version']]
          sides=['baseline','final']+(['candidate'] if os.environ['INCLUDE_CANDIDATE']=='true' else [])
          for side in sides:
            required += [Path('compilers')/side/(name+'-exit.txt') for name in ['build','identity','compiler-version']]
            required += [Path('compilers')/side/('candidate-version-guard-exit.txt' if side=='candidate' else 'reused-version-guard-exit.txt')]
          missing=[str(file) for file in required if not file.exists() or file.read_text().strip()!='0']
          Path('run-metadata/prerequisites.json').write_text(json.dumps(dict(missing_or_failed=missing),indent=2)+'\n')
          raise SystemExit(125 if missing else 0)
          PY
          prerequisite_exit=$?
          echo "$prerequisite_exit" > run-metadata/prerequisites-exit.txt
          if [ "$prerequisite_exit" != 0 ]; then exit 0; fi
          mkdir -p out/baseline out/final
          tar -C out/baseline -xzf compilers/baseline/dafny.tar.gz
          tar -C out/final -xzf compilers/final/dafny.tar.gz
          extra=()
          if [ "$INCLUDE_CANDIDATE" = true ]; then
            mkdir -p out/candidate
            tar -C out/candidate -xzf compilers/candidate/dafny.tar.gz
            extra+=(--candidate "$PWD/out/candidate/dafny/Dafny" --candidate-identity compilers/candidate/compiler-components.json --candidate-version compilers/candidate/compiler-version.txt)
          fi
          closure_failed=0
          for side in baseline final candidate; do
            python3 harness/.github/review/issue113-default-off/reuse_compiler.py check-bundle "$side" "out/$side/dafny" "run-metadata/$side-full-closure-before.json" > "run-metadata/$side-full-closure-before.txt" 2>&1
            guard_exit=$?
            echo "$guard_exit" > "run-metadata/$side-full-closure-before-exit.txt"
            if [ "$guard_exit" != 0 ]; then closure_failed=1; fi
          done
          if [ "$closure_failed" != 0 ]; then exit 0; fi
          if [ "$COHORT" = repair82-literal ]; then
            python3 harness/.github/review/issue113-default-off/repair82.py run \
              --baseline "$PWD/out/baseline/dafny/Dafny" --final "$PWD/out/final/dafny/Dafny" \
              --baseline-identity compilers/baseline/compiler-components.json --final-identity compilers/final/compiler-components.json \
              --baseline-version compilers/baseline/compiler-version.txt --final-version compilers/final/compiler-version.txt \
              --default-solver "$SOLVER" --review-solver "$REVIEW_SOLVER" \
              --default-solver-version setup/solver-version.txt --review-solver-version setup/review-solver-version.txt \
              --output measurements --shard "$SHARD" "${extra[@]}" > run-metadata/runner.txt 2>&1
          else
          python3 harness/.github/review/issue113-default-off/parser_focus.py \
            --baseline "$PWD/out/baseline/dafny/Dafny" --final "$PWD/out/final/dafny/Dafny" \
            --baseline-identity compilers/baseline/compiler-components.json --final-identity compilers/final/compiler-components.json \
            --baseline-version compilers/baseline/compiler-version.txt --final-version compilers/final/compiler-version.txt \
            --inputs "$PWD/inputs" --solver "$SOLVER" --solver-version setup/solver-version.txt \
            --axioms "$AXIOMS" --output measurements "${extra[@]}" > run-metadata/runner.txt 2>&1
          fi
          echo "$?" > run-metadata/runner-exit.txt
          for side in baseline final candidate; do
            python3 harness/.github/review/issue113-default-off/reuse_compiler.py check-bundle "$side" "out/$side/dafny" "run-metadata/$side-full-closure-after.json" > "run-metadata/$side-full-closure-after.txt" 2>&1
            echo "$?" > "run-metadata/$side-full-closure-after-exit.txt"
          done
          tail -20 run-metadata/runner.txt
          exit 0
      - name: Retain raw diagnostic step outcomes
        continue-on-error: true
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set +e
          mkdir -p run-metadata
          python3 - <<'PY_STEP_OUTCOMES'
          import os
          from pathlib import Path
          Path('run-metadata/step-outcomes.json').write_text(os.environ["STEP_OUTCOMES"] + "\n")
          PY_STEP_OUTCOMES
          exit 0
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        id: diagnostic_11
        if: always()
        with:
          name: default-off-${{ matrix.tag }}
          path: |
            setup/*.json
            setup/*.txt
            run-metadata
            measurements
          compression-level: 9
          retention-days: 30
  report:
    if: always() && github.repository == 'erniecohen/dafny' && startsWith(github.ref, 'refs/heads/scratch/')
    needs: [plan, compilers, paired]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        id: diagnostic_1
      - uses: actions/download-artifact@v4
        continue-on-error: true
        id: diagnostic_2
        with:
          pattern: default-off-*
          path: observations
      - name: Exact denominators, differences and incomplete outcomes
        id: diagnostic_3
        continue-on-error: true
        run: |
          set +e
          python3 .github/review/issue113-default-off/parser_focus.py aggregate observations default-off-report.json > aggregate.txt 2>&1
          aggregate_exit=$?
          echo "$aggregate_exit" > aggregate-exit.txt
          python3 .github/review/issue113-default-off/focus_reuse_receipt.py observations default-off-report.json focus-reuse-report.json > focus-reuse-report.txt 2>&1
          echo "$?" > focus-reuse-report-exit.txt
          exit 0
      - name: Retain raw diagnostic step outcomes
        continue-on-error: true
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          set +e
          mkdir -p .
          python3 - <<'PY_STEP_OUTCOMES'
          import os
          from pathlib import Path
          Path('./step-outcomes.json').write_text(os.environ["STEP_OUTCOMES"] + "\n")
          PY_STEP_OUTCOMES
          exit 0
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        id: diagnostic_4
        if: always()
        with:
          name: default-off-report
          path: |
            default-off-report.json
            aggregate.txt
            aggregate-exit.txt
            focus-reuse-report.json
            focus-reuse-report.txt
            focus-reuse-report-exit.txt
            step-outcomes.json
          retention-days: 30
