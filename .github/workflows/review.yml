  resolver-tests:
    if: ${{ ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && ((github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'erniecohen/dafny'))) && !inputs.platform_parity && (!(github.event_name == 'workflow_dispatch' && (inputs.default_comparison || inputs.decreases_order_comparison) && startsWith(github.ref, 'refs/heads/scratch/'))))) && needs.tree.outputs.reuse != 'true' }}
    name: Resolver unit tests and language-server recovery
    needs: tree
    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    timeout-minutes: 20
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
          echo 'Job worker and shell niceness: 10; subsequent actions inherit it.'
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - name: Boogie packages
        run: sh Scripts/fetch-boogie-packages.sh
      - name: Build resolver and language-server tests
        run: dotnet build Source/DafnyLanguageServer.Test -c Release
      # These tests exercise type resolution only. The language-server tests
      # explicitly disable automatic verification, so this job starts no solver.
      - name: Test redirecting dependencies, numeric ancestry and recovery scopes
        run: |
          dotnet test --settings .github/review/ci.runsettings Source/DafnyCore.Test -c Release --no-build \
            --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName~DafnyCore.Test.RedirectingTypeDependencyTrackerTests|FullyQualifiedName~DafnyCore.Test.NumericAncestryTests|FullyQualifiedName~DafnyCore.Test.NumericAncestryAllocationTests|FullyQualifiedName~DafnyCore.Test.ScopeCheckpointTest|FullyQualifiedName~MapComprehensionSubstitutionTests" \
            --blame-hang --blame-hang-timeout 60s --blame-hang-dump-type none
      - name: Test newtype-cycle edits in both resolver modes
        run: |
          dotnet test --settings .github/review/ci.runsettings Source/DafnyLanguageServer.Test -c Release --no-build \
            --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName~InferredNewtypeCycleTest" \
            --blame-hang --blame-hang-timeout 60s --blame-hang-dump-type none

      - name: Z3 for incremental bitvector verification
        run: |
          solver=$(sh .github/review/setup-z3.sh)
          echo "Z3=$solver" >> "$GITHUB_ENV"
      - name: Test cached inherited members and rotations after edits
        run: |
          dotnet test --settings .github/review/ci.runsettings Source/DafnyLanguageServer.Test -c Release --no-build \
            --logger "console;verbosity=normal" \
            --filter "FullyQualifiedName~IncrementalBitvectorMembersTest" \
            --blame-hang --blame-hang-timeout 90s --blame-hang-dump-type none

