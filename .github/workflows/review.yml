name: prerequisite diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version
        id: version
        run: sh .github/review/version.sh | tee -a "$GITHUB_OUTPUT"
      - name: Fixed Boogie packages
        if: hashFiles('Scripts/fetch-boogie-packages.sh') != ''
        run: sh Scripts/fetch-boogie-packages.sh
      - name: Build
        run: dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:SourceRevisionId=${{ steps.version.outputs.revision }}
      - name: Pinned solver
        run: |
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          unzip -q z3.zip
          chmod +x z3-5.1.0-x64-glibc-2.39/bin/z3
          echo "PINNED_Z3=$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" >> "$GITHUB_ENV"
      - name: Tree solver
        run: |
          v=$(sed -n 's/.*DefaultZ3Version = "\(.*\)";.*/\1/p' Source/DafnyCore/DafnyOptions.cs)
          case "$v" in
            4.12.1) sha=e07d4193d8e1851114fe4d507332a43576639f4aeaa33c7df15c36426d3cbf3b ;;
            4.16.0) sha=87de9c9e86c877abfccb00cf24b946c4a1bda7b9cba6f363ea58311d2573c320 ;;
            *) echo "No checksum for tree solver $v"; exit 1 ;;
          esac
          curl -fsSLo tree-z3.zip "https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-$v-x64-ubuntu-24.04-bin.zip"
          echo "$sha  tree-z3.zip" | sha256sum -c -
          unzip -q tree-z3.zip -d tree-z3
          chmod +x "tree-z3/z3-$v"
          echo "TREE_Z3=$PWD/tree-z3/z3-$v" >> "$GITHUB_ENV"
      - name: Measure focused cases
        run: python3 .github/review/prerequisite-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prerequisite-diagnostics
          path: out/diagnostics
          retention-days: 14
