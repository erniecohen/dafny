name: review
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
jobs:
  capture:
    name: Recorded extended-base harness output
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: The exact harness solver
        run: |
          mkdir -p results
          set +e
          v=$(sed -n 's/.*DefaultZ3Version = "\(.*\)";.*/\1/p' Source/DafnyCore/DafnyOptions.cs)
          case "$v" in
            4.12.1) sha=e07d4193d8e1851114fe4d507332a43576639f4aeaa33c7df15c36426d3cbf3b ;;
            4.16.0) sha=87de9c9e86c877abfccb00cf24b946c4a1bda7b9cba6f363ea58311d2573c320 ;;
            *) echo 'No checked solver archive for this source.' > results/solver-error.txt; exit 0 ;;
          esac
          curl --retry 3 --retry-all-errors -fsSLo z3h.zip "https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-$v-x64-ubuntu-24.04-bin.zip"
          echo "$?" > results/solver-download-exit.txt
          echo "$sha  z3h.zip" | sha256sum -c - > results/solver-checksum.txt
          echo "$?" > results/solver-checksum-exit.txt
          mkdir -p Binaries/z3/bin
          unzip -q z3h.zip -d Binaries/z3/bin
          echo "$?" > results/solver-unzip-exit.txt
          chmod +x "Binaries/z3/bin/z3-$v"
          "Binaries/z3/bin/z3-$v" --version > results/solver-version.txt
          exit 0
      - name: Record source and build
        run: |
          mkdir -p results
          git rev-parse HEAD > results/source.txt
          set +e
          if [ -f Scripts/fetch-boogie-packages.sh ]; then
            sh Scripts/fetch-boogie-packages.sh > results/boogie-setup.txt 2>&1
            echo "$?" > results/boogie-setup-exit.txt
          fi
          dotnet build Source/IntegrationTests -c Release > results/build.txt 2>&1
          echo "$?" > results/build-exit.txt
          tail -20 results/build.txt
          exit 0
      - name: Record upstream-harness expectations
        env:
          DAFNY_INTEGRATION_TESTS_UPDATE_EXPECT_FILE: 'true'
          DAFNY_INTEGRATION_TESTS_ONLY_COMPILERS: cs,js,py,go,java
        run: |
          if [ "$(cat results/build-exit.txt)" != 0 ]; then exit 0; fi
          if [ "$(cat results/solver-checksum-exit.txt)" != 0 ]; then exit 0; fi
          if [ "$(cat results/solver-unzip-exit.txt)" != 0 ]; then exit 0; fi
          set +e
          dotnet test Source/IntegrationTests -c Release --no-build --logger 'console;verbosity=normal' --filter 'DisplayName~git-issue-113-dependency-newtype-finite-actual-positive-triggered.dfy|DisplayName~git-issue-113-existing-codata-suspension-match-refinement-negative-raw.dfy' > results/harness.txt 2>&1
          echo "$?" > results/harness-exit.txt
          tail -60 results/harness.txt
          python3 - <<'RECORD'
          from pathlib import Path
          import hashlib,json,shutil
          source=Path('Source/IntegrationTests/bin/Release/net8.0/TestFiles/LitTests/LitTest/git-issues')
          out=Path('results/expectations');out.mkdir(exist_ok=True)
          records=[]
          for p in sorted(source.glob('git-issue-113*.dfy.*.expect')):
            shutil.copy2(p,out/p.name)
            records.append({'file':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          Path('results/expectations.json').write_text(json.dumps({'diagnostic_only':True,'generated_from_actual_harness_output':True,'files':records},indent=2))
          RECORD
          exit 0
      - name: Check the two recorded mode pairs strictly
        run: |
          if [ "$(cat results/harness-exit.txt)" != 0 ]; then exit 0; fi
          set +e
          dotnet test Source/IntegrationTests -c Release --no-build --logger 'console;verbosity=normal' --filter 'DisplayName~git-issue-113-dependency-newtype-finite-actual-positive-triggered.dfy|DisplayName~git-issue-113-existing-codata-suspension-match-refinement-negative-raw.dfy' > results/strict-harness.txt 2>&1
          echo "$?" > results/strict-harness-exit.txt
          tail -25 results/strict-harness.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue113-mode-output-recording
          path: results
          retention-days: 30
