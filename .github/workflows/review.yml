          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
          echo 'Job worker and shell niceness: 10; subsequent actions inherit it.'
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: parity-*-verdicts-*
          path: parity-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: parity-*-regressions
          path: parity-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: parity-*-resolver-tests
          path: parity-artifacts
      - uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: context.runId
            });
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.runId, per_page: 100
            });
            require('fs').writeFileSync('parity-run.json', JSON.stringify({
              headSha: run.data.head_sha, url: run.data.html_url,
              jobs: jobs.map(job => ({name: job.name, status: job.status, conclusion: job.conclusion,
                startedAt: job.started_at, completedAt: job.completed_at, steps: job.steps}))
            }));
      - name: Record verdicts, resources, completeness and job wall times
        run: |
          python3 -m unittest discover -s .github/review -p test_platform_parity.py
          python3 -m unittest discover -s .github/review -p test_ci_routing.py
          status=0
          python3 .github/review/platform-parity.py parity-artifacts parity-run.json platform-parity || status=$?
          echo "Comparison process exit: $status (probe only)" >> "$GITHUB_STEP_SUMMARY"
          cat platform-parity/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-parity-report
          path: |
            platform-parity
            parity-run.json
          retention-days: 90
