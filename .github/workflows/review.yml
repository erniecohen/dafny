name: Issue 113 focused literal SchorrWaite BPL observation
'on':
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: issue113-schorr-observation-${{ github.ref }}
  cancel-in-progress: false
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
jobs:
  capture:
    if: github.repository == 'erniecohen/dafny' && startsWith(github.ref, 'refs/heads/scratch/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - line: dev
            mode: default
            axioms: 'absent'
            tag: dev-default-absent
            original: 97601b75712f458de37a13bf9953a0b7825122eb
          - line: dev
            mode: refresh
            axioms: 'absent'
            tag: dev-refresh-absent
            original: 97601b75712f458de37a13bf9953a0b7825122eb
          - line: shipped
            mode: default
            axioms: 'off'
            tag: shipped-default-off
            original: 4b2742fb9924eed47c7bd40779e4283a1e65ce6d
          - line: shipped
            mode: default
            axioms: 'on'
            tag: shipped-default-on
            original: 4b2742fb9924eed47c7bd40779e4283a1e65ce6d
          - line: shipped
            mode: refresh
            axioms: 'off'
            tag: shipped-refresh-off
            original: 4b2742fb9924eed47c7bd40779e4283a1e65ce6d
          - line: shipped
            mode: refresh
            axioms: 'on'
            tag: shipped-refresh-on
            original: 4b2742fb9924eed47c7bd40779e4283a1e65ce6d
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: ${{ matrix.original }}
          path: inputs
      - uses: actions/setup-dotnet@v4
        continue-on-error: true
        with:
          dotnet-version: 8.0.x
      - name: Reuse exact existing compiler bundles and named Z3
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/review/issue113-schorr-focus/focused.py setup --line ${{ matrix.line }}
      - name: One unchanged matched SchorrWaite pair and literal-file capture
        continue-on-error: true
        run: python3 .github/review/issue113-schorr-focus/focused.py measure --line ${{ matrix.line }} --mode ${{ matrix.mode }} --axioms ${{ matrix.axioms }}
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: schorr-default-off-${{ matrix.tag }}
          path: |
            setup/*.json
            setup/*.txt
            run-metadata
            measurements
          compression-level: 9
          retention-days: 30
  report:
    needs: capture
    if: always() && github.repository == 'erniecohen/dafny' && startsWith(github.ref, 'refs/heads/scratch/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: schorr-default-off-*
          path: observations
      - name: Exact six-pair observation completeness, retain every proof outcome
        continue-on-error: true
        run: python3 .github/review/issue113-schorr-focus/focused.py report --directory observations --output schorr-focused-report.json
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        if: always()
        with:
          name: schorr-focused-report
          path: |
            schorr-focused-report.json
            run-metadata/diagnostic-failure.json
          retention-days: 30
