name: review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Recorded compiler build
        run: |
          mkdir -p results
          git rev-parse HEAD > results/source.txt
          git status --porcelain > results/status.txt
          set +e
          dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:SourceRevisionId=$GITHUB_SHA > results/build.txt 2>&1
          echo "$?" > results/build-exit.txt
          if [ "$(cat results/build-exit.txt)" = 0 ]; then
            out/dafny/Dafny --version > results/compiler-version.txt
            tar -C out -czf results/dafny.tar.gz dafny
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-compiler
          path: results
  measurements:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: [{"corpus": "fixtures", "family": "depth", "solver": "5.1.0", "seed": 0}, {"corpus": "fixtures", "family": "depth", "solver": "4.16.0", "seed": 0}, {"corpus": "fixtures", "family": "function-creation", "solver": "5.1.0", "seed": 0}, {"corpus": "fixtures", "family": "function-creation", "solver": "4.16.0", "seed": 0}, {"corpus": "fixtures", "family": "function-identity", "solver": "5.1.0", "seed": 0}, {"corpus": "fixtures", "family": "function-identity", "solver": "4.16.0", "seed": 0}, {"corpus": "fixtures", "family": "function-identity", "solver": "5.1.0", "seed": 1}, {"corpus": "fixtures", "family": "generic-boundary", "solver": "5.1.0", "seed": 0}, {"corpus": "fixtures", "family": "generic-boundary", "solver": "4.16.0", "seed": 0}, {"corpus": "fixtures", "family": "generic-nesting", "solver": "5.1.0", "seed": 0}, {"corpus": "fixtures", "family": "generic-nesting", "solver": "4.16.0", "seed": 0}, {"corpus": "fixtures", "family": "integer", "solver": "5.1.0", "seed": 0}, {"corpus": "fixtures", "family": "integer", "solver": "4.16.0", "seed": 0}, {"corpus": "fixtures", "family": "list", "solver": "5.1.0", "seed": 0}, {"corpus": "fixtures", "family": "list", "solver": "4.16.0", "seed": 0}, {"corpus": "fixtures", "family": "tuple", "solver": "5.1.0", "seed": 0}, {"corpus": "fixtures", "family": "tuple", "solver": "4.16.0", "seed": 0}, {"corpus": "fixtures", "family": "tuple", "solver": "5.1.0", "seed": 1}, {"corpus": "extended", "family": "arrow-adapter", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "arrow-adapter", "solver": "4.16.0", "seed": 0}, {"corpus": "extended", "family": "arrow-coercion", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "arrow-coercion", "solver": "4.16.0", "seed": 0}, {"corpus": "extended", "family": "codatatype-lazy", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "codatatype-lazy", "solver": "4.16.0", "seed": 0}, {"corpus": "extended", "family": "ordinal-finite", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "ordinal-finite", "solver": "4.16.0", "seed": 0}, {"corpus": "extended", "family": "ordinal-finite", "solver": "5.1.0", "seed": 1}, {"corpus": "extended", "family": "ordinal-finite-refinement", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "ordinal-finite-refinement", "solver": "4.16.0", "seed": 0}, {"corpus": "extended", "family": "refinement-local", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "refinement-local", "solver": "4.16.0", "seed": 0}, {"corpus": "extended", "family": "refinement-quantified", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "refinement-quantified", "solver": "4.16.0", "seed": 0}, {"corpus": "extended", "family": "refinement-quantified", "solver": "5.1.0", "seed": 1}, {"corpus": "extended", "family": "refinement-trivial", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "refinement-trivial", "solver": "4.16.0", "seed": 0}, {"corpus": "extended", "family": "datatype-root-update", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "datatype-root-update", "solver": "4.16.0", "seed": 0}, {"corpus": "extended", "family": "datatype-nested-update", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "datatype-nested-update", "solver": "4.16.0", "seed": 0}, {"corpus": "extended", "family": "datatype-ghost-update", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "datatype-ghost-update", "solver": "4.16.0", "seed": 0}, {"corpus": "extended", "family": "tree-observation", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "tree-observation", "solver": "4.16.0", "seed": 0}, {"corpus": "extended", "family": "visibility-session", "solver": "5.1.0", "seed": 0}, {"corpus": "extended", "family": "visibility-session", "solver": "4.16.0", "seed": 0}]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
      - uses: actions/download-artifact@v4
        with:
          name: performance-compiler
          path: compiler
      - name: Pinned runtime dependencies
        run: |
          npm install bignumber.js@9.1.2
          go install golang.org/x/tools/cmd/goimports@v0.31.0
      - name: Recorded solver setup
        run: |
          mkdir -p measurements
          set +e
          if [ "${{ matrix.solver }}" = 5.1.0 ]; then
            curl --retry 3 --retry-all-errors -fsSLo solver.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
            echo "$?" > measurements/solver-download-exit.txt
            echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  solver.zip' | sha256sum -c - > measurements/solver-checksum.txt 2>&1
            echo "$?" > measurements/solver-checksum-exit.txt
            unzip -q solver.zip
            echo "$?" > measurements/solver-unzip-exit.txt
            echo "SOLVER=$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" >> "$GITHUB_ENV"
          else
            curl --retry 3 --retry-all-errors -fsSLo solver.zip https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-4.16.0-x64-ubuntu-24.04-bin.zip
            echo "$?" > measurements/solver-download-exit.txt
            echo '87de9c9e86c877abfccb00cf24b946c4a1bda7b9cba6f363ea58311d2573c320  solver.zip' | sha256sum -c - > measurements/solver-checksum.txt 2>&1
            echo "$?" > measurements/solver-checksum-exit.txt
            mkdir -p solver && unzip -q solver.zip -d solver
            echo "$?" > measurements/solver-unzip-exit.txt
            chmod +x solver/z3-4.16.0
            echo "SOLVER=$PWD/solver/z3-4.16.0" >> "$GITHUB_ENV"
          fi
          exit 0
      - name: Recorded universal proof and runtime measurements
        env:
          CORPUS: ${{ matrix.corpus }}
          FAMILY: ${{ matrix.family }}
          SOLVER_VERSION: ${{ matrix.solver }}
          SOLVER_SEED: ${{ matrix.seed }}
        run: |
          if [ "$(cat compiler/build-exit.txt)" != 0 ]; then exit 0; fi
          if [ "$(cat measurements/solver-checksum-exit.txt)" != 0 ]; then exit 0; fi
          if [ "$(cat measurements/solver-unzip-exit.txt)" != 0 ]; then exit 0; fi
          mkdir -p out && tar -C out -xzf compiler/dafny.tar.gz
          python3 .github/review/issue113-benchmarks/batch.py > measurements/batch.txt 2>&1
          echo "$?" > measurements/batch-exit.txt
          tail -30 measurements/batch.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.corpus }}-${{ matrix.family }}-${{ matrix.solver }}-${{ matrix.seed }}
          path: measurements
          retention-days: 30
