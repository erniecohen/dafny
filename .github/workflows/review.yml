name: review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pinned dependencies
        run: |
          sh Scripts/fetch-boogie-packages.sh
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          unzip -q z3.zip
          echo "Z3=$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny
      - name: Record outcomes
        run: python3 .github/review/issue95-probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue95-probe
          path: issue95-results/
          retention-days: 90
