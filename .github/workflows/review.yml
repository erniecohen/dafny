# This fork's CI, in place of upstream's workflows, which exercise every compiler
# backend and run for hours.  It builds Dafny, runs the verifier over Dafny's own test
# programs at a fixed resource limit and reports each program's verdict, verifies
# Dafny's standard library and reports each declaration's verdict, runs the
# regression tests of this line's fixes in upstream's test harness, and on a tag
# publishes self-contained binaries.  Every job that builds first fetches the Boogie
# packages this line builds against (Scripts/fetch-boogie-packages.sh, checked by sha256).
# Trusted events use the macOS pool for the suite and Z3 4.12.1 library gates,
# whose verdict parity was approved. Z3 5.1.0 library gates retain hosted Linux.
name: review

on:
  push:
    branches: ['review/**', 'dev']
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['review/**', 'dev', 'codex/284-a-repairs', 'codex/241-verification-cache']
  workflow_dispatch:
    inputs:
      binaries:
        description: Also build the self-contained binaries (a release is made only for a tag)
        type: boolean
        default: false

      review_followup_probe:
        description: Record expected new-test baseline differences without failing the scratch probe
        type: boolean
        default: false

      platform_parity:
        description: Measure Linux/macOS parity at this exact source without changing baselines
        type: boolean
        default: false

      resolver_probe:
        description: Record resolver outcomes without enforcing their baseline (scratch branches only)
        type: boolean
        default: false

      additional_axioms_probe:
        description: Record initial enabled verdict baselines without enforcing them (scratch branches only)
        type: boolean
        default: false

      decreases_order_comparison:
        description: Record corrected versus legacy decreases orders (scratch comparison only)
        type: boolean
        default: false

      default_comparison:
        description: Record only repeated default suite/library vectors for frozen products (manual scratch only)
        type: boolean
        default: false

      default_comparison_mode:
        description: Frozen candidate comparison or unmodified development baseline control (manual scratch only)
        type: choice
        options: ['candidate', 'baseline-control']
        default: candidate

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # Four jobs can share the self-hosted pool without using more than four cores each.
  DOTNET_PROCESSOR_COUNT: '4'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  COPYFILE_DISABLE: '1'
  # Z3 5.1.0, from Z3's public GitHub release, checked by sha256.
  Z3_RELEASE: https://github.com/Z3Prover/z3/releases/download/z3-5.1.0
  Z3_LINUX_X64: z3-5.1.0-x64-glibc-2.39
  Z3_LINUX_X64_SHA256: f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a
  Z3_OSX_ARM64: z3-5.1.0-arm64-osx-13.3
  Z3_OSX_ARM64_SHA256: 81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db
  # Upstream's harness runs with the Z3 that the tree's own tests expect, its
  # DefaultZ3Version, from dafny-lang/solver-builds, checked by sha256.
  HARNESS_Z3_RELEASE: https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03
  HARNESS_Z3_4_12_1_SHA256: e07d4193d8e1851114fe4d507332a43576639f4aeaa33c7df15c36426d3cbf3b
  HARNESS_Z3_4_16_0_SHA256: 87de9c9e86c877abfccb00cf24b946c4a1bda7b9cba6f363ea58311d2573c320

jobs:
  canonical-map-comparison:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.head_ref == 'codex/284-map-pin' || github.ref == 'refs/heads/codex/284-map-pin') }}
    uses: ./.github/workflows/typeencoding-map.yml

  character-representation-comparison:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.head_ref == 'codex/284-a-repairs' || github.ref == 'refs/heads/codex/284-a-repairs') }}
    uses: ./.github/workflows/typeencoding-a.yml

  tree:
    # Verification is keyed on the git tree, not the commit.  A run that verified a tree in
    # full leaves the artifact verified-review-<tree>; this job looks for one from a completed,
    # successful run of this workflow in this repository (.github/review/tree-reuse.py), and when
    # it finds one the expensive jobs skip.  Without one everything runs, as before.
    name: Tree reuse
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
      tree: ${{ steps.find.outputs.tree }}
      run: ${{ steps.find.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - name: Controls for the tree matching
        run: python3 -m unittest discover -s .github/review -p test_tree_reuse.py
      - name: Look for a verified run of this tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .github/review/tree-reuse.py find --workflow .github/workflows/review.yml --marker verified-review

  milestone-scope:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    outputs:
      integer_bitwise: ${{ steps.scope.outputs.integer_bitwise }}
      source_contracts: ${{ steps.scope.outputs.source_contracts }}
      base: ${{ steps.scope.outputs.base }}
      candidate: ${{ steps.scope.outputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scope milestone identity checks
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/review/milestone-scope.py --event "$EVENT" --base "$BASE" --head "$HEAD"

  operators-disabled:
    if: ${{ ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.head_ref == 'codex/194-operators-m1' || github.ref == 'refs/heads/codex/194-operators-m1' || startsWith(github.ref, 'refs/heads/scratch/194-'))) && needs.tree.outputs.reuse != 'true' }}
    needs: tree
    uses: ./.github/workflows/operators-m1-off.yml

  decreases-order-comparison:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name == 'workflow_dispatch' && inputs.decreases_order_comparison && startsWith(github.ref, 'refs/heads/scratch/')) }}
    uses: ./.github/workflows/decreases-order.yml

  build:
    if: ${{ ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && ((github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'erniecohen/dafny'))) && !inputs.platform_parity && (!(github.event_name == 'workflow_dispatch' && (inputs.default_comparison || inputs.decreases_order_comparison) && startsWith(github.ref, 'refs/heads/scratch/'))))) && (needs.tree.outputs.reuse != 'true' || github.ref_type == 'tag') }}
    name: Build (Release)
    needs: tree
    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    timeout-minutes: 60
    outputs:
      revision: ${{ steps.version.outputs.revision }}
      version: ${{ steps.version.outputs.version }}
      harness_z3: ${{ steps.version.outputs.harness_z3 }}
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
          echo 'Job worker and shell niceness: 10; subsequent actions inherit it.'
      - uses: actions/checkout@v4
      - name: CI event guards, regression partition, parity and comparison bookkeeping
        # Every unit-test module in .github/review, so that none goes unrun.
        run: python3 -m unittest discover -s .github/review -p 'test_*.py'
      - name: Version
        id: version
        run: |
          sh .github/review/version.sh | tee -a "$GITHUB_OUTPUT"
          harness=$(sed -n 's/.*DefaultZ3Version = "\(.*\)";.*/\1/p' Source/DafnyCore/DafnyOptions.cs)
          echo "harness_z3=$harness" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-dotnet
        if: ${{ needs.tree.outputs.reuse != 'true' }}
      - uses: actions/setup-java@v4
        if: ${{ needs.tree.outputs.reuse != 'true' }}
        with:
          distribution: temurin
          java-version: '17'
      - name: Boogie packages
        if: ${{ needs.tree.outputs.reuse != 'true' }}
        run: sh Scripts/fetch-boogie-packages.sh
      - name: Build
        if: ${{ needs.tree.outputs.reuse != 'true' }}
        run: |
          dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny \
            -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true -p:SourceRevisionId=${{ steps.version.outputs.revision }}
      - name: Check the version it reports
        if: ${{ needs.tree.outputs.reuse != 'true' }}
        run: |
          v=$(dotnet out/dafny/Dafny.dll --version | head -1)
          echo "dafny --version: $v"
          test "$v" = "${{ steps.version.outputs.version }}"
      - name: Check the packaged standard libraries
        if: ${{ needs.tree.outputs.reuse != 'true' }}
        run: |
          v=$(sed -n 's/.*DefaultZ3Version = "\(.*\)";.*/\1/p' Source/DafnyCore/DafnyOptions.cs)
          z3h=$(sh .github/review/setup-z3.sh "$v" z3h)
          python3 .github/review/packaged-libraries.py "$PWD/out/dafny/Dafny" "$z3h" \
            out/packaged-libraries
      - uses: actions/upload-artifact@v4
        if: ${{ always() && needs.tree.outputs.reuse != 'true' }}
        with:
          name: packaged-libraries
          path: |
            out/packaged-libraries/summary.json
            out/packaged-libraries/*/result.json
            out/packaged-libraries/*/stdout.txt
            out/packaged-libraries/*/stderr.txt
            out/packaged-libraries/*/resources.csv
            out/packaged-libraries/*/package-smoke.bin
          retention-days: 14
      - name: Pack
        if: ${{ needs.tree.outputs.reuse != 'true' }}
        run: |
          sh .github/review/portable-dafny.sh out/dafny
          tar -C out -czf dafny.tar.gz dafny
          python3 .github/review/check-distribution.py out/dafny --archive dafny.tar.gz
      - uses: actions/upload-artifact@v4
        if: ${{ needs.tree.outputs.reuse != 'true' }}
        with:
          name: dafny
          path: dafny.tar.gz
          retention-days: 14

  suite:
    if: ${{ ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && ((github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'erniecohen/dafny'))) && !inputs.platform_parity)) && needs.tree.outputs.reuse != 'true' }}
    name: Verifier suite (axioms ${{ matrix.axioms }}, shard ${{ matrix.shard }} of 4)
    needs: [build, tree]
    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        axioms: ['off', 'on']
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
          echo 'Job worker and shell niceness: 10; subsequent actions inherit it.'
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: dafny
      - name: Unpack Dafny
        run: |
          mkdir -p out && tar -C out -xzf dafny.tar.gz
          sh .github/review/portable-dafny.sh out/dafny
      - name: Z3
        run: |
          solver=$(sh .github/review/setup-z3.sh)
          echo "Z3=$solver" >> "$GITHUB_ENV"
          echo "Z3SHA=$(shasum -a 256 "$solver" | cut -c1-16)" >> "$GITHUB_ENV"
      # The opt-in proof-result cache (https://github.com/erniecohen/dafny/issues/261), for the
      # programs that select the refreshed type system themselves.  Pushes to review/4.11.0
      # save it; other runs only restore it.  Its key names the solver binary's digest, so
      # results never cross Z3 binaries; Dafny's own key covers the rest.  Dafny names the
      # paths under its own, .NET's and the solver's installations by placeholder (v3), so a
      # cache saved on one runner answers on another.
      - name: Restore the proof-result cache
        uses: actions/cache/restore@v4
        with:
          path: verification-cache
          key: verification-cache-v3-${{ runner.os }}-z3-${{ env.Z3SHA }}-${{ matrix.axioms }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            verification-cache-v3-${{ runner.os }}-z3-${{ env.Z3SHA }}-${{ matrix.axioms }}-${{ matrix.shard }}-
      - name: Re-prove a sample of the restored cache with a fresh solver
        run: |
          if [ -d verification-cache/v1/results ]; then
            python3 .github/review/verification-cache-audit.py replay verification-cache "$Z3" \
              --sample 25 --seed ${{ github.run_number }}
          else
            echo 'No proof-result cache was restored.'
          fi
      - name: Verify
        run: |
          L=Source/IntegrationTests/TestFiles/LitTests/LitTest
          python3 .github/review/lit-verdicts.py plan "$L" plan.tsv
          python3 .github/review/lit-verdicts.py run plan.tsv "$L" "$PWD/out/dafny/Dafny" "$Z3" \
            verdicts-${{ matrix.axioms }}-${{ matrix.shard }}.tsv --shard ${{ matrix.shard }}/4 --jobs 4 \
            --additional-axioms ${{ matrix.axioms == 'on' }} --measurements measurements/${{ matrix.axioms }} \
            --verification-cache "$PWD/verification-cache"
          python3 .github/review/additional-axioms.py inventory measurements/${{ matrix.axioms }} \
            resources-${{ matrix.axioms }}-${{ matrix.shard }}.json
          {
            echo "## Proof-result cache, axioms ${{ matrix.axioms }}, shard ${{ matrix.shard }}"
            echo
            echo -n 'Restored cache: '
            python3 .github/review/lit-verdicts.py cache-stats measurements/${{ matrix.axioms }} \
              verdicts-${{ matrix.axioms }}-${{ matrix.shard }}.tsv || echo 'unavailable'
          } >> "$GITHUB_STEP_SUMMARY"
      # The cached programs again, now reading the cache the run above wrote: the same
      # verdicts and per-proof outcomes and resource counts, and both runs' times.
      - name: Re-verify the cached programs from the cache
        run: |
          L=Source/IntegrationTests/TestFiles/LitTests/LitTest
          python3 .github/review/lit-verdicts.py run plan.tsv "$L" "$PWD/out/dafny/Dafny" "$Z3" \
            cache-reuse-${{ matrix.axioms }}-${{ matrix.shard }}.tsv --shard ${{ matrix.shard }}/4 --jobs 4 \
            --additional-axioms ${{ matrix.axioms == 'on' }} --measurements cache-reuse/${{ matrix.axioms }} \
            --verification-cache "$PWD/verification-cache" --cached-only true > cache-reuse.log
          python3 .github/review/lit-verdicts.py same measurements/${{ matrix.axioms }} cache-reuse/${{ matrix.axioms }} \
            verdicts-${{ matrix.axioms }}-${{ matrix.shard }}.tsv cache-reuse-${{ matrix.axioms }}-${{ matrix.shard }}.tsv \
            | tee cache-reuse-summary.txt
          {
            echo
            echo -n 'Second pass from its own cache: '
            tail -1 cache-reuse-summary.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the proof-result cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/review/4.11.0'
        uses: actions/cache/save@v4
        with:
          path: verification-cache
          key: verification-cache-v3-${{ runner.os }}-z3-${{ env.Z3SHA }}-${{ matrix.axioms }}-${{ matrix.shard }}-${{ github.run_id }}
      - name: Record per-program resource counts and headroom
        if: always()
        run: |
          python3 .github/review/program-resources.py suite measurements/${{ matrix.axioms }} \
            Source/IntegrationTests/TestFiles/LitTests/LitTest verdicts-${{ matrix.axioms }}-${{ matrix.shard }}.tsv ru \
            --solver "$Z3" --archive ci-z3/archive.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdicts-${{ matrix.axioms }}-${{ matrix.shard }}
          path: |
            verdicts-${{ matrix.axioms }}-${{ matrix.shard }}.tsv
            resources-${{ matrix.axioms }}-${{ matrix.shard }}.json
            plan.tsv
            ru/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-measurements-${{ matrix.axioms }}-${{ matrix.shard }}
          path: measurements
          compression-level: 9
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-cache-reuse-${{ matrix.axioms }}-${{ matrix.shard }}
          path: |
            cache-reuse-${{ matrix.axioms }}-${{ matrix.shard }}.tsv
            cache-reuse-summary.txt
            cache-reuse.log
            cache-reuse/
          retention-days: 30

  verdicts:
    if: ${{ ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!inputs.platform_parity && ((github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'erniecohen/dafny'))) && (true)))) && needs.tree.outputs.reuse != 'true' }}
    name: Verdicts (axioms ${{ matrix.axioms }})
    needs: [build, suite, tree]
    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        axioms: ['off', 'on']
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
          echo 'Job worker and shell niceness: 10; subsequent actions inherit it.'
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: verdicts-${{ matrix.axioms }}-*
          merge-multiple: true
      - name: Merge and summarise
        run: |
          sort verdicts-${{ matrix.axioms }}-*.tsv > verdicts.tsv
          test "$(wc -l < verdicts.tsv)" -eq "$(wc -l < plan.tsv)"
          python3 .github/review/lit-verdicts.py expected verdicts.tsv > expected-verdicts.tsv
          {
            echo "## Verifier suite, axioms ${{ matrix.axioms }}: ${{ needs.build.outputs.version }}"
            echo
            echo "Each program under LitTest/dafny0..4 and git-issues whose first RUN line"
            echo "verifies it, at a resource limit of 16,000,000, with Z3 5.1.0."
            echo
            python3 .github/review/lit-verdicts.py summary verdicts.tsv
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verdicts-${{ matrix.axioms }}
          path: |
            verdicts.tsv
            expected-verdicts.tsv
            plan.tsv
          retention-days: 90
      # A verdict is a program's exit code, summary line and error lines: not its
      # time, and not the resources its finished proofs used.  To change the
      # expected verdicts on purpose, see .github/review/lit-verdicts.py.
      - name: Compare with the expected verdicts
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.review_followup_probe && startsWith(github.ref, 'refs/heads/scratch/') }}
        env:
          PROBE: ${{ inputs.additional_axioms_probe }}
        run: |
          suffix=""
          if [ '${{ matrix.axioms }}' = on ]; then suffix="-additional-axioms"; fi
          python3 .github/review/additional-axioms.py gate suite \
            ".github/review/expected-verdicts$suffix.tsv" verdicts.tsv \
            --mode '${{ matrix.axioms }}' --output comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdict-comparison-${{ matrix.axioms }}
          path: comparison
          retention-days: 90

  verification-batch:
    if: ${{ ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && ((github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'erniecohen/dafny'))) && !inputs.platform_parity)) && needs.tree.outputs.reuse != 'true' }}
    name: Resolve-once verification batch controls
    needs: [build, tree]
    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    timeout-minutes: 15
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
          echo 'Job worker and shell niceness: 10; subsequent actions inherit it.'
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: dafny
      - name: Unpack Dafny
        run: |
          mkdir -p out && tar -C out -xzf dafny.tar.gz
          sh .github/review/portable-dafny.sh out/dafny
      - name: Pinned solver
        run: |
          solver=$(sh .github/review/setup-z3.sh)
          echo "Z3=$solver" >> "$GITHUB_ENV"
      - name: Exercise fresh requests and cold input invalidation
        run: |
          python3 .github/review/verification-batch-controls.py "$PWD/out/dafny/Dafny" "$Z3" verification-batch-results
          cat verification-batch-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-batch-results
          path: verification-batch-results
          retention-days: 90

  default-comparison:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!inputs.platform_parity && (github.event_name == 'workflow_dispatch' && inputs.default_comparison && startsWith(github.ref, 'refs/heads/scratch/'))) }}
    name: Repeated default suite and standard-library comparison (probe)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 4e98f3f592310854ca1448d517b82dcbcc0f51f4
          path: comparison-baseline
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.default_comparison_mode == 'baseline-control' && '4e98f3f592310854ca1448d517b82dcbcc0f51f4' || 'b85e4b6f3af7eedd39bf355394a3f50c1b348646' }}
          path: comparison-candidate
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/comparison-dotnet
        with:
          dotnet-version: 10.0.402
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Runtime for the source generator in the same isolated root
        run: |
          test "$DOTNET_ROOT" = "$RUNNER_TEMP/comparison-dotnet"
          curl -fsSLo "$RUNNER_TEMP/comparison-runtime8.tar.gz" \
            https://builds.dotnet.microsoft.com/dotnet/Runtime/8.0.32/dotnet-runtime-8.0.32-linux-x64.tar.gz
          echo "639a17d84e4d52fecd62c7d4e528e7bc0ae3c9860de2530cb41a2ee7196b69ea18271d8795849180742770e25b4f913df292a5a236fa197cf5d3cd0ec5ba665f  $RUNNER_TEMP/comparison-runtime8.tar.gz" | sha512sum -c -
          host_before=$(shasum -a 256 "$DOTNET_ROOT/dotnet")
          tar -xzf "$RUNNER_TEMP/comparison-runtime8.tar.gz" -C "$DOTNET_ROOT" --exclude=dotnet --exclude=./dotnet
          test "$(shasum -a 256 "$DOTNET_ROOT/dotnet")" = "$host_before"
      - name: Record fixed environment and build both source revisions
        env:
          COMPARISON_MODE: ${{ inputs.default_comparison_mode || 'candidate' }}
        run: |
          mkdir -p default-comparison
          dotnet --info > default-comparison/dotnet-info.txt
          dotnet --list-sdks > default-comparison/sdks.txt
          dotnet --list-runtimes > default-comparison/runtimes.txt
          test "$(dotnet --version)" = 10.0.402
          test "$(dotnet --list-sdks | wc -l)" -eq 1
          python3 .github/review/default-comparison.py --record-dotnet-environment "$PWD/default-comparison" "$DOTNET_ROOT"
          java -version > default-comparison/java-version.txt 2>&1
          git rev-parse HEAD > default-comparison/harness-source.txt
          git -C comparison-candidate rev-parse HEAD > default-comparison/candidate-source.txt
          git -C comparison-baseline rev-parse HEAD > default-comparison/baseline-source.txt
          test "$(cat default-comparison/baseline-source.txt)" = 4e98f3f592310854ca1448d517b82dcbcc0f51f4
          case "$COMPARISON_MODE" in
            candidate) expected_candidate=b85e4b6f3af7eedd39bf355394a3f50c1b348646 ;;
            baseline-control) expected_candidate=4e98f3f592310854ca1448d517b82dcbcc0f51f4 ;;
            *) echo "unknown comparison mode"; exit 1 ;;
          esac
          test "$(cat default-comparison/candidate-source.txt)" = "$expected_candidate"
          echo "$COMPARISON_MODE" > default-comparison/comparison-mode.txt
          git fetch --no-tags --depth=1 origin b85e4b6f3af7eedd39bf355394a3f50c1b348646
          for variant in baseline candidate; do
            source="$PWD/comparison-$variant"
            output="$PWD/default-comparison/build-$variant"
            (
              cd "$source"
              sh Scripts/fetch-boogie-packages.sh
              dotnet publish Source/Dafny/Dafny.csproj -c Release -o "$output" \
                -p:GeneratePackageOnBuild=false -p:SourceRevisionId=resolution-reuse-comparison \
                -bl:"$output.binlog"
            ) > "default-comparison/build-$variant.stdout" 2> "default-comparison/build-$variant.stderr"
          done
      - name: Pin both solvers
        run: |
          curl -fsSLo z3.zip "$Z3_RELEASE/$Z3_LINUX_X64.zip"
          echo "$Z3_LINUX_X64_SHA256  z3.zip" | shasum -a 256 -c -
          unzip -q z3.zip
          curl -fsSLo z3h.zip "$HARNESS_Z3_RELEASE/z3-4.16.0-x64-ubuntu-24.04-bin.zip"
          echo "$HARNESS_Z3_4_16_0_SHA256  z3h.zip" | shasum -a 256 -c -
          mkdir z3h
          unzip -q z3h.zip -d z3h
          chmod +x z3h/z3-4.16.0
      - name: Check comparison bookkeeping
        run: python3 -m unittest discover -s .github/review -p 'test_default*comparison.py'
      - name: Record A1 B1 B2 A2 without changing verdict baselines
        env:
          BASELINE_SOURCE: ${{ github.workspace }}/comparison-baseline
          CANDIDATE_SOURCE: ${{ github.workspace }}/comparison-candidate
          COMPARISON_MODE: ${{ inputs.default_comparison_mode || 'candidate' }}
        run: |
          set +e
          python3 .github/review/default-comparison.py "$BASELINE_SOURCE" "$CANDIDATE_SOURCE" \
            "$PWD/default-comparison" "$PWD/$Z3_LINUX_X64/bin/z3" "$PWD/z3h/z3-4.16.0" "$COMPARISON_MODE" \
            > default-comparison/probe.stdout 2> default-comparison/probe.stderr
          result=$?
          echo "$result" > default-comparison/probe-exit.txt
          python3 .github/review/default-comparison.py --finalize-manifest "$PWD/default-comparison"
          manifest_result=$?
          {
            echo '## Repeated default comparison (probe only)'
            echo
            echo "Probe process exit: $result. Differences are recorded and do not update any expected verdict."
            echo "Manifest finalization exit: $manifest_result."
            if [ -f default-comparison/summary.json ]; then cat default-comparison/summary.json; fi
            if [ -f default-comparison/incomplete.json ]; then cat default-comparison/incomplete.json; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: default-comparison
          path: default-comparison
          compression-level: 9
          retention-days: 90

  resolver:
    if: ${{ ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && ((github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'erniecohen/dafny'))) && !inputs.platform_parity)) && needs.tree.outputs.reuse != 'true' }}
    name: Resolver matrix (both modes)
    needs: [build, tree]
    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    timeout-minutes: 45
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
          echo 'Job worker and shell niceness: 10; subsequent actions inherit it.'
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: dafny
      - name: Unpack Dafny
        run: |
          mkdir -p out && tar -C out -xzf dafny.tar.gz
          sh .github/review/portable-dafny.sh out/dafny
      - name: Test axiom gate and resource reporting
        run: python3 -m unittest discover -s .github/review -p test_additional_axioms.py
      - name: Test matrix runner
        run: python3 -m unittest discover -s .github/review -p test_resolver_matrix.py
      - name: Resolve manifest in both modes
        env:
          PROBE: ${{ inputs.resolver_probe }}
        run: |
          extra=()
          if [ "$PROBE" = true ]; then
            case "$GITHUB_REF" in
              refs/heads/scratch/*) extra+=(--probe) ;;
              *) echo "Resolver probes must use a scratch branch"; exit 1 ;;
            esac
          fi
          python3 .github/review/resolver-matrix.py \
            --manifest .github/review/resolver-cases.json \
            --lit-dir Source/IntegrationTests/TestFiles/LitTests/LitTest \
            --dafny out/dafny/Dafny \
            --expected .github/review/expected-resolver-results.json \
            --output resolver-results "${extra[@]}"
      - name: Record known unresolved cases separately
        if: inputs.resolver_probe && startsWith(github.ref, 'refs/heads/scratch/')
        run: |
          python3 .github/review/resolver-matrix.py \
            --manifest .github/review/resolver-probes.json \
            --lit-dir Source/IntegrationTests/TestFiles/LitTests/LitTest \
            --dafny out/dafny/Dafny \
            --expected .github/review/expected-resolver-probes.json \
            --output resolver-probes --probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolver-results
          path: |
            resolver-results/
            resolver-probes/
          retention-days: 90

  stdlib:
    if: ${{ ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && ((github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'erniecohen/dafny'))) && !inputs.platform_parity)) && needs.tree.outputs.reuse != 'true' }}
    name: Standard library (Z3 ${{ matrix.z3 }}, axioms ${{ matrix.axioms }})
    needs: [build, tree]
    runs-on: ${{ matrix.z3 == 'of the tests' && needs.build.outputs.harness_z3 == '4.12.1' && 'mac-studio' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # This line's Z3, and the Z3 that the tree's own tests expect (its
        # DefaultZ3Version), with which upstream builds the library.
        z3: ['5.1.0', 'of the tests']
        axioms: ['off', 'on']
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
          echo 'Job worker and shell niceness: 10; subsequent actions inherit it.'
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: dafny
      - name: Unpack Dafny
        run: |
          mkdir -p out && tar -C out -xzf dafny.tar.gz
          sh .github/review/portable-dafny.sh out/dafny
      - name: Z3
        run: |
          v='${{ matrix.z3 }}'
          if [ "$v" = 'of the tests' ]; then
            v=$(sed -n 's/.*DefaultZ3Version = "\(.*\)";.*/\1/p' Source/DafnyCore/DafnyOptions.cs)
          fi
          solver=$(sh .github/review/setup-z3.sh "$v")
          echo "Z3=$solver" >> "$GITHUB_ENV"
          echo "Z3V=$v" >> "$GITHUB_ENV"
      - name: Verify
        run: |
          "$Z3" --version
          python3 .github/review/std-verdicts.py run Source/DafnyStandardLibraries "$PWD/out/dafny/Dafny" "$Z3" \
            std-verdicts.tsv --cores 4 --additional-axioms ${{ matrix.axioms == 'on' }} \
            --boogie "/deterministicLiteralHashes:1 /restartProver" --measurements measurements
          python3 .github/review/std-verdicts.py expected std-verdicts.tsv > "expected-std-verdicts-z3-$Z3V.tsv"
          # Fingerprints, to compare runs of one tree without downloading artifacts (#186):
          # the verdict columns, and the declarations' resource and proof counts.
          vfp=$(shasum -a 256 < "expected-std-verdicts-z3-$Z3V.tsv" | cut -c1-16)
          rfp=$(awk -F'\t' '$1 !~ /^run /{print $1"\t"$5"\t"$6}' std-verdicts.tsv | shasum -a 256 | cut -c1-16)
          echo "verdict fingerprint $vfp, resource fingerprint $rfp"
          {
            echo "## Standard library, axioms ${{ matrix.axioms }}, Z3 $Z3V: ${{ needs.build.outputs.version }}"
            echo
            echo "Source/DafnyStandardLibraries, verified as its Makefile's verify target does, with"
            echo "the library's own resource limits and no time limit, the library part with"
            echo "Boogie's /deterministicLiteralHashes:1 /restartProver (#186, #30)."
            echo
            python3 .github/review/std-verdicts.py summary std-verdicts.tsv
            echo
            echo "Verdict fingerprint \`$vfp\`, resource fingerprint \`$rfp\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record per-program resource counts and headroom
        if: always()
        run: |
          python3 .github/review/program-resources.py library measurements \
            Source/DafnyStandardLibraries std-verdicts.tsv ru --solver "$Z3" --archive ci-z3/archive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: std-verdicts-${{ matrix.axioms }}-z3-${{ env.Z3V }}
          path: |
            std-verdicts.tsv
            expected-std-verdicts-z3-${{ env.Z3V }}.tsv
            ru/
            measurements/
          retention-days: 90
      # A declaration's verdict is its outcome; a part's is its exit code, summary line
      # and error lines.  Not times, and not the resources finished proofs used.  To
      # change the expected verdicts on purpose, see .github/review/std-verdicts.py.
      - name: Compare with the expected verdicts
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.review_followup_probe && startsWith(github.ref, 'refs/heads/scratch/') }}
        env:
          PROBE: ${{ inputs.additional_axioms_probe }}
        run: |
          suffix=""
          if [ '${{ matrix.axioms }}' = on ]; then suffix="-additional-axioms"; fi
          python3 .github/review/additional-axioms.py gate std \
            ".github/review/expected-std-verdicts-z3-$Z3V$suffix.tsv" std-verdicts.tsv \
            --mode '${{ matrix.axioms }}' --output comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: std-comparison-${{ matrix.axioms }}-z3-${{ env.Z3V }}
          path: comparison
          retention-days: 90

  axiom-resources:
    if: ${{ ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!inputs.platform_parity && ((github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'erniecohen/dafny'))) && (!cancelled() && needs.suite.result == 'success')))) && needs.tree.outputs.reuse != 'true' }}
    name: Additional-axiom resource comparisons
    needs: [suite, stdlib, tree]
    # Also after a failed standard-library job, but not after a cancellation, which can leave its
