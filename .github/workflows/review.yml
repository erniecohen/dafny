name: review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - name: Version
        id: version
        run: sh .github/review/version.sh >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          sh Scripts/fetch-boogie-packages.sh
          dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:GeneratePackageOnBuild=false -p:SourceRevisionId=${{ steps.version.outputs.revision }}
      - name: Solver
        run: |
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          unzip -q z3.zip
          chmod +x z3-5.1.0-x64-glibc-2.39/bin/z3
      - name: Record bounded diagnostic outcomes
        run: python3 .github/review/issue100-baseline.py out/dafny/Dafny z3-5.1.0-x64-glibc-2.39/bin/z3 out/issue100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue100-baseline
          path: out/issue100
