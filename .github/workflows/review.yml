name: Review
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  plan:
    if: github.repository == 'erniecohen/dafny' && startsWith(github.ref_name, 'scratch/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
      - id: plan
        continue-on-error: true
        run: |
          set +e
          mkdir -p plan-results
          python3 .github/review/issue113-finite-interactions/diagnostic.py plan --output plan-results > plan-results/plan.stdout 2> plan-results/plan.stderr
          code=$?
          printf '%s\n' "$code" > plan-results/plan-exit.txt
          if [ "$code" -eq 0 ]; then
            python3 - <<'PLAN_MATRIX'
          import json, os
          from pathlib import Path
          value = json.loads(Path("plan-results/matrix.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(value, separators=(",", ":")) + "\n")
          PLAN_MATRIX
          fi
          exit "$code"
      - id: raw_outcomes
        if: always()
        continue-on-error: true
        env:
          RAW_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PLAN_STEPS'
          import json, os
          from pathlib import Path
          root = Path("plan-results")
          root.mkdir(parents=True, exist_ok=True)
          root.joinpath("steps-before-upload.json").write_text(json.dumps(json.loads(os.environ["RAW_STEPS"]), indent=2) + "\n")
          PLAN_STEPS
      - id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: finite-interactions-plan
          path: plan-results
          if-no-files-found: error
      - id: diagnostic_exit
        if: always()
        continue-on-error: true
        run: exit 0
  cases:
    needs: plan
    if: always() && github.repository == 'erniecohen/dafny' && startsWith(github.ref_name, 'scratch/') && needs.plan.outputs.matrix != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
      - id: sdk
        uses: actions/setup-dotnet@v4
        continue-on-error: true
        with:
          dotnet-version: 8.0.425
      - id: artifact_api
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p retained case-results/setup
          gh api repos/erniecohen/dafny/actions/artifacts/11361575690 > retained/artifact-api.json 2> case-results/setup/artifact-api.stderr
          code=$?
          printf '%s\n' "$code" > case-results/setup/artifact-api-exit.txt
          exit "$code"
      - id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run download 37347177735 --repo erniecohen/dafny --name default-off-compilers-shipped --dir retained > case-results/setup/download.stdout 2> case-results/setup/download.stderr
          code=$?
          printf '%s\n' "$code" > case-results/setup/download-exit.txt
          exit "$code"
      - id: prepare
        continue-on-error: true
        run: |
          set +e
          python3 .github/review/issue113-finite-interactions/diagnostic.py prepare --download retained --work reused-current --output case-results/setup > case-results/setup/prepare.stdout 2> case-results/setup/prepare.stderr
          code=$?
          printf '%s\n' "$code" > case-results/setup/prepare-exit.txt
          exit "$code"
      - id: verify
        continue-on-error: true
        env:
          EXACT_CASE_ID: ${{ matrix.case }}
        run: |
          set +e
          mkdir -p case-results
          python3 .github/review/issue113-finite-interactions/diagnostic.py run --case "$EXACT_CASE_ID" --work reused-current --output case-results > case-results/run.stdout 2> case-results/run.stderr
          code=$?
          printf '%s\n' "$code" > case-results/run-exit.txt
          exit "$code"
      - id: raw_outcomes
        if: always()
        continue-on-error: true
        env:
          RAW_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'CASE_STEPS'
          import json, os
          from pathlib import Path
          root = Path("case-results")
          root.mkdir(parents=True, exist_ok=True)
          root.joinpath("steps-before-upload.json").write_text(json.dumps(json.loads(os.environ["RAW_STEPS"]), indent=2) + "\n")
          CASE_STEPS
      - id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: finite-interactions-case-${{ matrix.case }}
          path: case-results
          if-no-files-found: error
      - id: diagnostic_exit
        if: always()
        continue-on-error: true
        run: exit 0
  report:
    needs: [plan, cases]
    if: always() && github.repository == 'erniecohen/dafny' && startsWith(github.ref_name, 'scratch/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: checkout
        uses: actions/checkout@v4
        continue-on-error: true
      - id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: finite-interactions-case-*
          path: downloaded
      - id: report
        continue-on-error: true
        run: |
          set +e
          mkdir -p final-results
          python3 .github/review/issue113-finite-interactions/diagnostic.py report --artifacts downloaded --output final-results > final-results/report.stdout 2> final-results/report.stderr
          code=$?
          printf '%s\n' "$code" > final-results/report-exit.txt
          exit "$code"
      - id: raw_outcomes
        if: always()
        continue-on-error: true
        env:
          RAW_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'REPORT_STEPS'
          import json, os
          from pathlib import Path
          root = Path("final-results")
          root.mkdir(parents=True, exist_ok=True)
          root.joinpath("steps-before-upload.json").write_text(json.dumps(json.loads(os.environ["RAW_STEPS"]), indent=2) + "\n")
          REPORT_STEPS
      - id: upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: finite-interactions-report
          path: final-results
          if-no-files-found: error
      - id: diagnostic_exit
        if: always()
        continue-on-error: true
        run: exit 0
