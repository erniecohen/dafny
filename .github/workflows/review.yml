name: review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 97601b75712f458de37a13bf9953a0b7825122eb
          path: before
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Record the focused compiler and verifier comparison
        run: |
          mkdir -p results
          git rev-parse HEAD > results/final-source.txt
          git -C before rev-parse HEAD > results/original-source.txt
          sha256sum .github/review/issue113-focused/repaired-baseline.patch > results/repaired-patch-sha256.txt
          set +e
          dotnet publish before/Source/Dafny/Dafny.csproj -c Release -o out/original > results/build-original.txt 2>&1
          echo "$?" > results/build-original-exit.txt
          git -C before apply "$PWD/.github/review/issue113-focused/repaired-baseline.patch" > results/patch.txt 2>&1
          echo "$?" > results/patch-exit.txt
          if [ "$(cat results/patch-exit.txt)" = 0 ]; then
            git -C before diff --binary -- Source/DafnyCore > results/actual-repaired-core.patch
            dotnet publish before/Source/Dafny/Dafny.csproj -c Release -o out/repaired > results/build-repaired.txt 2>&1
            echo "$?" > results/build-repaired-exit.txt
          fi
          dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/final > results/build-final.txt 2>&1
          echo "$?" > results/build-final-exit.txt
          curl --retry 3 --retry-all-errors -fsSLo solver.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo "$?" > results/solver-download-exit.txt
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  solver.zip' | sha256sum -c - > results/solver-checksum.txt 2>&1
          echo "$?" > results/solver-checksum-exit.txt
          unzip -q solver.zip
          echo "$?" > results/solver-unzip-exit.txt
          if [ "$(cat results/solver-checksum-exit.txt)" = 0 ] && [ "$(cat results/solver-unzip-exit.txt)" = 0 ]; then
            python3 .github/review/issue113-focused/run.py > results/focused.txt 2>&1
            echo "$?" > results/focused-exit.txt
          fi
          tail -50 results/focused.txt
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-default-off
          path: results
          retention-days: 30
