# Scratch diagnostic only: records failures and returns zero; inspect its artifact.
name: review
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
jobs:
  capture:
    name: Recorded isolated 132 off/on harness output
    if: startsWith(github.ref, 'refs/heads/scratch/')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
      - name: Runtime dependencies
        run: |
          mkdir -p results
          set +e
          npm install bignumber.js@9.1.2 > results/npm.txt 2>&1
          echo "$?" > results/npm-exit.txt
          go install golang.org/x/tools/cmd/goimports@v0.31.0 > results/goimports.txt 2>&1
          echo "$?" > results/goimports-exit.txt
          exit 0
      - name: The exact harness solver before build
        run: |
          set +e
          v=$(sed -n 's/.*DefaultZ3Version = "\(.*\)";.*/\1/p' Source/DafnyCore/DafnyOptions.cs)
          case "$v" in
            4.12.1) sha=e07d4193d8e1851114fe4d507332a43576639f4aeaa33c7df15c36426d3cbf3b ;;
            4.16.0) sha=87de9c9e86c877abfccb00cf24b946c4a1bda7b9cba6f363ea58311d2573c320 ;;
            *) echo 'No checked solver archive for this source.' > results/solver-error.txt; exit 0 ;;
          esac
          curl --retry 3 --retry-all-errors -fsSLo z3h.zip "https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-$v-x64-ubuntu-24.04-bin.zip"
          status=$?
          echo "$status" > results/solver-download-exit.txt
          if [ "$status" != 0 ]; then exit 0; fi
          echo "$sha  z3h.zip" | sha256sum -c - > results/solver-checksum.txt
          status=$?
          echo "$status" > results/solver-checksum-exit.txt
          if [ "$status" != 0 ]; then exit 0; fi
          mkdir -p Binaries/z3/bin
          unzip -q z3h.zip -d Binaries/z3/bin
          status=$?
          echo "$status" > results/solver-unzip-exit.txt
          if [ "$status" != 0 ]; then exit 0; fi
          chmod +x "Binaries/z3/bin/z3-$v"
          "Binaries/z3/bin/z3-$v" --version > results/solver-version.txt
          sha256sum "Binaries/z3/bin/z3-$v" > results/solver-binary-sha256.txt
          exit 0
      - name: Pinned regression solver before build
        run: |
          set +e
          curl --retry 3 --retry-all-errors -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          status=$?
          echo "$status" > results/pinned-solver-download-exit.txt
          if [ "$status" != 0 ]; then exit 0; fi
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c - > results/pinned-solver-checksum.txt
          status=$?
          echo "$status" > results/pinned-solver-checksum-exit.txt
          if [ "$status" != 0 ]; then exit 0; fi
          unzip -q z3.zip
          status=$?
          echo "$status" > results/pinned-solver-unzip-exit.txt
          if [ "$status" != 0 ]; then exit 0; fi
          mkdir -p Binaries/z3/bin
          cp z3-5.1.0-x64-glibc-2.39/bin/z3 Binaries/z3/bin/z3-5.1.0
          chmod +x Binaries/z3/bin/z3-5.1.0
          Binaries/z3/bin/z3-5.1.0 --version > results/pinned-solver-version.txt
          sha256sum Binaries/z3/bin/z3-5.1.0 > results/pinned-solver-binary-sha256.txt
          exit 0
      - name: Record source and build after solvers
        run: |
          git rev-parse HEAD > results/source.txt
          set +e
          sh Scripts/fetch-boogie-packages.sh > results/boogie-setup.txt 2>&1
          status=$?
          echo "$status" > results/boogie-setup-exit.txt
          if [ "$status" != 0 ]; then exit 0; fi
          if [ ! -f results/solver-checksum-exit.txt ] || [ "$(cat results/solver-checksum-exit.txt)" != 0 ]; then exit 0; fi
          if [ ! -f results/pinned-solver-checksum-exit.txt ] || [ "$(cat results/pinned-solver-checksum-exit.txt)" != 0 ]; then exit 0; fi
          dotnet build Source/IntegrationTests -c Release > results/build.txt 2>&1
          echo "$?" > results/build-exit.txt
          tail -20 results/build.txt
          exit 0
      - name: Record source units, both axiom runs and strict checks
        run: |
          python3 .github/review/isolated132-harness-capture.py
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated132-axiom-harness-recording
          path: results
          retention-days: 30
