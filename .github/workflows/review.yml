    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    timeout-minutes: 15
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
          echo 'Job worker and shell niceness: 10; subsequent actions inherit it.'
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: verdicts-*-*
          path: measurements
      - uses: actions/download-artifact@v4
        with:
          pattern: std-verdicts-*
          path: measurements
      - name: Report enabled versus disabled resource counts
        run: python3 .github/review/additional-axioms.py resources measurements resource-comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: additional-axiom-resources
          path: resource-comparison
          retention-days: 90

  javascript-runtime:
    if: ${{ ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && ((github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'erniecohen/dafny'))) && !inputs.platform_parity)) && needs.tree.outputs.reuse != 'true' }}
    name: JavaScript runtime (Node ${{ matrix.node }})
    needs: tree
    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    strategy:
      matrix:
        node: ['16.0.0', '22']
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
          echo 'Job worker and shell niceness: 10; subsequent actions inherit it.'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Runtime dependency
        run: npm install --no-save --package-lock=false bignumber.js@9.1.2
      - name: Boundary, identity, differential and related-helper checks
        run: node .github/review/246-js-bitwise.cjs Source/DafnyRuntime/DafnyRuntimeJs/DafnyRuntime.js
      - name: Before and after helper costs
        if: matrix.node == '22'
        run: |
          git fetch --depth=1 origin 428e348b0b125cb67505f03a0026b3f497f98e48
          git show 428e348b0b125cb67505f03a0026b3f497f98e48:Source/DafnyRuntime/DafnyRuntimeJs/DafnyRuntime.js > before.js
          if node .github/review/246-js-bitwise.cjs before.js > before-control.txt 2>&1; then
            echo "The original runtime unexpectedly passed the regression"
            exit 1
          fi
          grep -q ERR_ASSERTION before-control.txt
          node .github/review/246-js-bitwise.cjs before.js --bench > before.md
          node .github/review/246-js-bitwise.cjs Source/DafnyRuntime/DafnyRuntimeJs/DafnyRuntime.js --bench > after.md
          cat before.md after.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: javascript-bitwise-costs
          path: |
            before.md
            after.md
            before-control.txt

  regressions:
    if: ${{ ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && ((github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'erniecohen/dafny'))) && !inputs.platform_parity && (!(github.event_name == 'workflow_dispatch' && (inputs.default_comparison || inputs.decreases_order_comparison) && startsWith(github.ref, 'refs/heads/scratch/'))))) && needs.tree.outputs.reuse != 'true' }}
    name: Regression tests (upstream harness)
    needs: tree
    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    timeout-minutes: 90
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
          echo 'Job worker and shell niceness: 10; subsequent actions inherit it.'
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: The solvers the tests expect
        run: |
          v=$(sed -n 's/.*DefaultZ3Version = "\(.*\)";.*/\1/p' Source/DafnyCore/DafnyOptions.cs)
          mkdir -p Binaries/z3/bin
          for version in "$v" 4.12.1 5.1.0; do
            solver=$(sh .github/review/setup-z3.sh "$version" "ci-z3-$version")
            cp "$solver" "Binaries/z3/bin/z3-$version"
          done
      - name: Boogie packages
        run: sh Scripts/fetch-boogie-packages.sh
      - name: Build the test harness
        run: dotnet build Source/IntegrationTests -c Release
      - name: Cardinality resolver and translation admission tests
        run: |
          dotnet test --settings .github/review/ci.runsettings Source/DafnyCore.Test -c Release --filter 'FullyQualifiedName~Cardinality|FullyQualifiedName~NewtypeReferenceCharacteristicTests'
          dotnet test --settings .github/review/ci.runsettings Source/DafnyLanguageServer.Test -c Release --filter FullyQualifiedName~Cardinality
          dotnet test --settings .github/review/ci.runsettings Source/IntegrationTests -c Release --no-build --filter FullyQualifiedName~CardinalityEmissionTests
      - uses: actions/setup-node@v4
        with:
          node-version: '16.0.0'
      - name: JavaScript runtime dependency
        run: npm install --no-save --package-lock=false bignumber.js@9.1.2
      - name: Worker resolution and front-end profile integration
        run: |
          dotnet test --settings .github/review/ci.runsettings Source/DafnyCore.Test -c Release --no-build \
            --filter 'FullyQualifiedName~ResolutionPipelineTests|FullyQualifiedName~PipelineProfileResolutionTests' \
            --logger "console;verbosity=normal"
      - name: Resolution and cardinality tests with Debug contract assertions
        # Release builds compile Contract.Assert out; a failed assertion here ends the run.
        run: |
          dotnet test --settings .github/review/ci.runsettings Source/DafnyCore.Test -c Debug \
            --filter 'FullyQualifiedName~ResolutionPipelineTests|FullyQualifiedName~PipelineProfileResolutionTests|FullyQualifiedName~Cardinality|FullyQualifiedName~NewtypeReferenceCharacteristicTests' \
            --logger "console;verbosity=normal"
      - name: Run the tests named in .github/review/regressions
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.review_followup_probe && startsWith(github.ref, 'refs/heads/scratch/') }}
        env:
          DAFNY_INTEGRATION_TESTS_ONLY_COMPILERS: cs
        run: |
          filter=$(python3 .github/review/regression-filter.py portable)
          if [ -z "$filter" ]; then echo "no tests named"; exit 0; fi
          echo "$filter"
          dotnet test --settings .github/review/ci.runsettings Source/IntegrationTests -c Release --no-build \
            --logger "console;verbosity=normal" --filter "$filter"
      - name: Operator selection cloning and safe symbolic rename
        run: |
          dotnet test --settings .github/review/ci.runsettings Source/DafnyCore.Test -c Release --filter FullyQualifiedName~OperatorSelectionTests --logger "console;verbosity=normal"
          dotnet test --settings .github/review/ci.runsettings Source/DafnyLanguageServer.Test -c Release --filter 'FullyQualifiedName~OperatorSymbolsAreReferencesButAreNeverRenamed|FullyQualifiedName~OperatorHoverDistinguishesRankFromAnOrdinaryFallbackCall' --logger "console;verbosity=normal"
      - name: Batch requests reuse resolution and create fresh proof tasks
        env:
          Z3: ${{ github.workspace }}/Binaries/z3/bin/z3-5.1.0
        run: dotnet test --settings .github/review/ci.runsettings Source/IntegrationTests -c Release --no-build --filter FullyQualifiedName~VerificationBatchTests --logger "console;verbosity=normal"
      - name: A module window reports what one module at a time reports (#241)
        env:
          Z3: ${{ github.workspace }}/Binaries/z3/bin/z3-5.1.0
        run: dotnet test --settings .github/review/ci.runsettings Source/IntegrationTests -c Release --no-build --filter FullyQualifiedName~ModuleWindowTests --logger "console;verbosity=normal"
      - name: Stable source contracts preserve exact client translation
        run: dotnet test --settings .github/review/ci.runsettings Source/IntegrationTests -c Release --no-build --filter FullyQualifiedName~ModularTerminationContractTests --logger "console;verbosity=normal"
      - name: Reverified replacements preserve exact client Boogie and SMT
        run: python3 .github/review/source-contracts-substitution.py Source/IntegrationTests/bin/Release/net10.0/Dafny Binaries/z3/bin/z3-5.1.0 source-contracts-substitution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-contracts-substitution
          path: source-contracts-substitution
