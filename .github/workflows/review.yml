          #!/usr/bin/env python3
          """Read-only receipts and explicit derived observations; never update expectations."""
          import collections
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import shlex
          import signal
          import subprocess
          import sys
          import time
          import uuid
          import xml.etree.ElementTree as ET

          HERE = Path(__file__).resolve().parent
          ROOT = HERE.parent
          SPEC = json.loads((HERE / 'spec.json').read_text())
          OUT = ROOT / 'same-source-observations'
          BIN = ROOT / 'Source/IntegrationTests/bin/Release/net8.0'
          LIT = ROOT / 'Source/IntegrationTests/TestFiles/LitTests/LitTest'
          COPIED = BIN / 'TestFiles/LitTests/LitTest'
          PROJECTS = {'core': 'Source/DafnyCore.Test', 'lsp': 'Source/DafnyLanguageServer.Test', 'integration': 'Source/IntegrationTests'}

          def digest(file):
              h = hashlib.sha256()
              with Path(file).open('rb') as stream:
                  while chunk := stream.read(1024 * 1024): h.update(chunk)
              return h.hexdigest()

          def save(file, value):
              file.parent.mkdir(parents=True, exist_ok=True)
              file.write_text(json.dumps(value, indent=2) + '\n')

          def git(*args):
              return subprocess.check_output(['git', '-C', str(ROOT), *args], text=True).strip()

          def source_receipt():
              trees = {p: git('rev-parse', 'HEAD:' + p) for p in SPEC['compiled_trees']}
              if trees != SPEC['compiled_trees']: raise ValueError('Compiled source trees differ from the final product')
              for p, h in SPEC['harness_sha256'].items():
                  if digest(ROOT / p) != h: raise ValueError('Pinned harness definition changed: ' + p)
              for p, h in SPEC['integration_compiled_source_sha256'].items():
                  if digest(ROOT / p) != h: raise ValueError('Integration compiled source changed: ' + p)
              registered = {line.strip() for line in (ROOT / '.github/review/regressions').read_text().splitlines() if line.strip() and not line.startswith('#')}
              if not set(SPEC['feature_runtime_files']) <= registered: raise ValueError('Required feature runtime fixture is not registered')
              for p, h in SPEC['lifecycle_definition_files_sha256'].items():
                  if digest(ROOT / p) != h: raise ValueError('Pinned lifecycle definition changed: ' + p)
              names = git('ls-files', '-z', '--', 'Source').split('\0')
              files = {p: digest(ROOT / p) for p in names if p and (ROOT / p).is_file()}
              return {'head': git('rev-parse', 'HEAD'), 'product_commit': SPEC['product_commit'],
                      'compiled_trees': trees, 'tracked_Source_sha256': files,
                      'committed_library_sha256': {p: h for p, h in files.items() if p.endswith('.doo')}}

          def portable_manifest(files):
              text = ''.join(h + '  ' + p + '\n' for p, h in sorted(files.items()))
              return {'files': files, 'portable_sha256': hashlib.sha256(text.encode()).hexdigest(), 'serialization': SPEC['build_input_recipe']['portable_serialization']}

          def build_inputs():
              # Same product-file boundary as version.sh; path names and file bytes only.
              paths = git('ls-files', '-z').split('\0')
              exclusions = SPEC['build_input_recipe']['exclusions']
              files = {p: digest(ROOT / p) for p in paths if p and not any(p.startswith(x) if x.endswith('/') else p == x for x in exclusions)}
              changed = git('diff', '--name-only', SPEC['product_commit'], 'HEAD', '--', '.',
                            *[':(exclude)' + p.rstrip('/') for p in exclusions])
              if changed: raise ValueError('Product build inputs differ from the pinned product: ' + changed)
              if portable_manifest(files)['portable_sha256'] != SPEC['required_build_inputs_sha256']: raise ValueError('Canonical build-input digest differs from candidate')
              revision = dict(line.split('=', 1) for line in (OUT / 'setup/version.env').read_text().splitlines() if '=' in line)
              if revision.get('version') != SPEC['expected_version']: raise ValueError('Computed shipped version changed')
              packages = {}
              for line in (ROOT / 'Scripts/boogie-packages.sha256').read_text().splitlines():
                  if not line.strip(): continue
                  expected, name = line.split()
                  file = ROOT / 'Binaries/boogie-packages' / name
                  if digest(file) != expected: raise ValueError('Boogie package bytes changed: ' + name)
                  packages[name] = expected
              return {'recipe': SPEC['build_input_recipe'], 'canonical_product_inputs': portable_manifest(files),
                      'IntegrationTests_compiled_inputs': portable_manifest(SPEC['integration_compiled_source_sha256']),
                      'version_inputs': {p: digest(ROOT / p) for p in ('.github/review/base', '.github/review/version.sh')},
                      'SourceRevisionId': revision['revision'], 'expected_version': revision['version'], 'Boogie_packages': packages}

          def bundles():
              result = {}
              for name, project in PROJECTS.items():
                  root = ROOT / project / 'bin/Release/net8.0'
                  if not root.is_dir(): raise ValueError('Missing compiled test bundle: ' + name)
                  files = {p.relative_to(root).as_posix(): digest(p) for p in sorted(root.rglob('*'))
                           if p.is_file() and (p.suffix in ('.dll', '.json', '.doo') or p.name in ('Dafny', 'TestDafny')) and not p.relative_to(root).as_posix().startswith('TestFiles/')}
                  if 'DafnyCore.dll' not in files: raise ValueError('Missing actual Core assembly: ' + name)
                  result[name] = files
              critical = ('DafnyCore.dll', 'DafnyDriver.dll', 'Dafny.dll', 'DafnyRuntime.dll', 'Dafny.deps.json', 'Dafny.runtimeconfig.json', 'TestDafny.dll')
              if any(p not in result['integration'] for p in critical): raise ValueError('Integration compiler bundle is incomplete')
              for name, files in result.items():
                  for p, h in files.items():
                      if p in result['integration'] and (p.startswith('Dafny') or p.startswith('Boogie')) and h != result['integration'][p]:
                          raise ValueError('Shared actual compiler/Boogie component differs across test bundles: ' + name + '/' + p)
              return result

          def solver_receipt():
              expected = json.loads((OUT / 'setup/solver-executables.json').read_text())
              result = {}
              for name, project in PROJECTS.items():
                  result[name] = {}
                  for version, h in expected.items():
                      file = ROOT / project / ('bin/Release/net8.0/z3/bin/z3-' + version)
                      if not file.is_file() or digest(file) != h: raise ValueError('Named solver was not copied before harness build: ' + str(file))
                      result[name][version] = h
              return result

          def guard():
              before = json.loads((OUT / 'build-receipt.json').read_text())
              source = source_receipt()
              if source['tracked_Source_sha256'] != before['source']['tracked_Source_sha256']:
                  raise ValueError('Tracked source/library/expectation bytes changed during measurement')
              actual = {'components': bundles(), 'solvers': solver_receipt()}
              if build_inputs() != before['build_inputs']: raise ValueError('Build input/package/revision receipt changed')
              if actual != {'components': before['components'], 'solvers': before['solvers']}:
                  raise ValueError('Actual compiled components or copied solver bytes changed')
              if environment_receipt() != before['environment']: raise ValueError('Backend tool/dependency/setup identity changed')
              return actual

          def logged(argv, cwd, directory, timeout=1200):
              directory.mkdir(parents=True, exist_ok=True)
              state = json.loads((OUT / 'state.json').read_text()) if (OUT / 'state.json').exists() else {}
              elapsed = time.time() - state.get('started_at', time.time())
              available = 4200 - elapsed
              if available <= 30:
                  result = {'argv': list(map(str, argv)), 'cwd': str(cwd), 'exit': None, 'capacity_cap': True, 'timed_out': False}
                  save(directory / 'process.json', result)
                  return result
              start = time.monotonic()
              process = subprocess.Popen(list(map(str, argv)), cwd=cwd, stdin=subprocess.DEVNULL,
                                         stdout=subprocess.PIPE, stderr=subprocess.PIPE, start_new_session=True)
              timed = False
              try: stdout, stderr = process.communicate(timeout=min(timeout, available - 20))
              except subprocess.TimeoutExpired:
                  timed = True; os.killpg(process.pid, signal.SIGKILL); stdout, stderr = process.communicate()
              (directory / 'stdout.txt').write_bytes(stdout); (directory / 'stderr.txt').write_bytes(stderr)
              result = {'argv': list(map(str, argv)), 'cwd': str(cwd), 'exit': process.returncode, 'timed_out': timed,
                        'capacity_cap': available - 20 < timeout and timed, 'seconds': time.monotonic() - start,
                        'stdout_sha256': digest(directory / 'stdout.txt'), 'stderr_sha256': digest(directory / 'stderr.txt')}
              save(directory / 'process.json', result)
              return result

          def prebuild():
              OUT.mkdir(parents=True, exist_ok=True)
              ready = json.loads((OUT / 'setup/ready.json').read_text())
              if ready.get('all_prerequisites_completed') is not True: raise ValueError('Setup prerequisite did not complete')
              save(OUT / 'state.json', {'started_at': time.time(), 'real_dotnet': shutil.which('dotnet')})
              save(OUT / 'prebuild-receipt.json', {'source': source_receipt(), 'build_inputs': build_inputs()})

          def build():
              # All solvers are installed by the preceding workflow step, before any project build.
              state = json.loads((OUT / 'state.json').read_text())
              before = json.loads((OUT / 'prebuild-receipt.json').read_text())
              inputs = build_inputs()
              if source_receipt() != before['source'] or inputs != before['build_inputs']: raise ValueError('Prebuild source/input guard failed')
              for phase, project in PROJECTS.items():
                  result = logged([state['real_dotnet'], 'build', project, '-c', 'Release',
                                   '-p:SourceRevisionId=' + inputs['SourceRevisionId']], ROOT, OUT / ('build-' + phase), 900)
                  if result['exit'] != 0: raise ValueError('Build did not complete: ' + phase + ': ' + str(result['exit']))
              if source_receipt() != json.loads((OUT / 'prebuild-receipt.json').read_text())['source']:
                  raise ValueError('Tracked source changed during builds')

          def environment_receipt():
              path = shutil.which('dotnet')
              if path is None: raise ValueError('Missing dotnet prerequisite')
              file = Path(path).resolve()
              setup = {p.relative_to(OUT).as_posix(): digest(p) for p in sorted((OUT / 'setup').rglob('*')) if p.is_file()}
              return {'dotnet': {'path': str(file), 'sha256': digest(file)}, 'setup_receipts_sha256': setup}

          def initialize():
              OUT.mkdir(parents=True, exist_ok=True)
              for key in ('DAFNY_INTEGRATION_TESTS_ONLY_COMPILERS', 'DAFNY_INTEGRATION_TESTS_UPDATE_EXPECT_FILE', 'DAFNY_INTEGRATION_TESTS_IN_PROCESS', 'DAFNY_INTEGRATION_TESTS_MODE', 'DAFNY_RELEASE', 'DAFNY_EXTRA_TEST_ARGUMENTS'):
                  if os.environ.get(key): raise ValueError('Unexpected test environment override: ' + key)
              actual = {'source': source_receipt(), 'build_inputs': build_inputs(), 'components': bundles(), 'solvers': solver_receipt(), 'environment': environment_receipt(),
                        'build_source_commit': git('rev-parse', 'HEAD'), 'product_commit': SPEC['product_commit'],
                        'public_run': 'https://github.com/erniecohen/dafny/actions/runs/' + os.environ['GITHUB_RUN_ID'],
                        'spec_sha256': digest(HERE / 'spec.json')}
              version = logged([shutil.which('dotnet'), BIN / 'Dafny.dll', '--version'], BIN, OUT / 'actual-version', 60)
              reported = (OUT / 'actual-version/stdout.txt').read_text().strip() if (OUT / 'actual-version/stdout.txt').exists() else ''
              if version['exit'] != 0 or reported != SPEC['expected_version']: raise ValueError('Actual compiler version differs: ' + reported)
              actual['actual_reported_version'] = reported
              save(OUT / 'build-receipt.json', actual)

          def parse_discovery(text, methods):
              marker = 'The following Tests are available:'
              if text.count(marker) != 1: raise ValueError('Missing or ambiguous discovery header')
              names = [s.strip() for s in text.split(marker, 1)[1].splitlines() if s.strip()]
              if not names or any(s.startswith(('No test matches', 'No tests', 'Error:', 'Warning:')) for s in names):
                  raise ValueError('Discovery did not yield an independent test inventory')
              # No filter is sent to VSTest discovery. Select exact source FQN boundaries,
              # retaining complete theory display text and duplicates without normalization.
              selected = [n for n in names if any(n == m or n.startswith(m + '(') for m in methods)]
              terms = [x.removeprefix('FullyQualifiedName~') for x in SPEC['lifecycle_filters'][next(p for p, catalog in SPEC['lifecycle_source_method_catalog'].items() if catalog == methods)].split('|')]
              literal_selected = [n for n in names if any(t in n.split('(', 1)[0] for t in terms)]
              if collections.Counter(selected) != collections.Counter(literal_selected): raise ValueError('Adapter discovery includes an unknown selected source method')
              counts = collections.Counter()
              for name in selected:
                  matching = [m for m in methods if name == m or name.startswith(m + '(')]
                  if len(matching) != 1: raise ValueError('Ambiguous selected display name: ' + name)
                  counts[matching[0]] += 1
              expected = {m: v['expected_case_count'] for m, v in methods.items()}
              complete = dict(counts) == expected
              return {'all_discovered_names': names, 'selected_names': selected,
