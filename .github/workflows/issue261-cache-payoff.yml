name: Issue 261 cache payoff

# For https://github.com/erniecohen/dafny/issues/261: before a persistent per-module resolution
# cache (spec: https://github.com/erniecohen/dafny/pull/282) is built, measure with
# --pipeline-profile how much of a front-end run is per-module resolution and translation, and
# bound what a warm cache could save for an edit to one module (.github/review/cache-payoff.py).
# It measures the released binary, not the commit it runs on, and runs no solver: `dafny resolve`,
# and `dafny verify` with Boogie's no-op solver (translation, Boogie preparation and VC
# generation run; nothing is proved).  The corpora are public and pinned:
#   Std        Source/DafnyStandardLibraries at the checked-out commit (and its TargetSpecific part)
#   DafnyCore  Source/DafnyCore/dfyconfig.toml (the Dafny-in-Dafny back ends, on the Std .doo)
#   cedar      https://github.com/cedar-policy/cedar-spec cedar-dafny at a86bdd9d (Apache-2.0)
#   evm        https://github.com/Consensys/evm-dafny src/dafny at e2e52e86 (Apache-2.0), with its
#              submodule https://github.com/Consensys/DafnyCrypto at d6753131 (Apache-2.0)

on:
  # A workflow that is not yet on the default branch cannot be dispatched; pushing a branch
  # named like this runs it.
  push:
    branches: ['scratch/issue-261-cache-payoff*']
  workflow_dispatch:
    inputs:
      corpora:
        description: 'Corpora to measure, a JSON list'
        default: '["std", "core", "cedar", "evm"]'
      runs:
        description: 'Bash regular expression: measure only the runs whose names match'
        default: '.*'
      wait:
        description: 'Seconds each timed run may wait for a quiet host'
        default: '600'

permissions:
  contents: read
  actions: read   # to count the other jobs running on the self-hosted runners during each run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  MSBUILDDISABLENODEREUSE: '1'
  DOTNET_PROCESSOR_COUNT: '2'
  RELEASE: v4.11.0+fcb2042d.review.c1cccaa3
  SCRIPT: .github/review/cache-payoff.py
  NOOP: --solver-option SOLVER=noop --boogie /deterministicLiteralHashes:1

jobs:
  measure:
    # The fork's self-hosted runners share one machine, so the corpora are measured one at a time,
    # and each timed run records the other jobs active on those runners (and is repeated if any).
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        corpus: ${{ fromJSON(inputs.corpora || '["std", "core", "cedar", "evm"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 300
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 300
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@6ad8147ae6d2f8dbab0db951e461d649a0997cd9
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
        with:
          clean: true
      - name: Released Dafny and Z3 5.1.0
        timeout-minutes: 300
        run: |
          rm -rf rel ext results corpora.txt ci-z3
          mkdir -p rel && cd rel
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE//+/%2B}"
          zip="dafny-${RELEASE#v}-osx-arm64.zip"
          curl -fsSL --retry 3 -O "$base/$zip" -O "$base/SHA256SUMS"
          grep " $zip\$" SHA256SUMS | shasum -a 256 -c -
          unzip -q "$zip"
          cd ..
          z3=$(sh .github/review/setup-z3.sh 5.1.0 ci-z3)
          echo "D=$PWD/rel/dafny/dafny" >> "$GITHUB_ENV"
          echo "Z3=$z3" >> "$GITHUB_ENV"
          rel/dafny/dafny --version
      - name: Fetch pinned sources
        if: matrix.corpus == 'cedar' || matrix.corpus == 'evm'
        timeout-minutes: 300
        run: |
          fetch() {  # repository, commit, directory, sparse paths...
            git init -q "$3" && git -C "$3" remote add origin "$1"
            if [ $# -gt 3 ]; then git -C "$3" sparse-checkout set "${@:4}"; fi
            git -C "$3" fetch -q --no-tags --refmap= --depth 1 --filter=blob:none origin "$2"
            git -C "$3" checkout -q FETCH_HEAD
            echo "$1 $(git -C "$3" rev-parse HEAD)" >> corpora.txt
          }
          if [ "${{ matrix.corpus }}" = cedar ]; then
            fetch https://github.com/cedar-policy/cedar-spec.git a86bdd9da410822ccb645912905a6bcb30ab66b5 ext/cedar cedar-dafny
          else
            fetch https://github.com/Consensys/evm-dafny.git e2e52e86d6623d48d0849f5ce1664f88c8f0e547 ext/evm src/dafny
            fetch https://github.com/Consensys/DafnyCrypto.git d67531318c191f5703b71b256352c58f9e0c2e4a ext/evm/libs/DafnyCrypto
          fi
          cat corpora.txt
      - name: Measure
        timeout-minutes: 300
        run: |
          out="$PWD/results/${{ matrix.corpus }}"
          # Other jobs in progress on the self-hosted runners, not counting this one.
          cat > "$RUNNER_TEMP/active.sh" <<'SH'
          # A run with a job still waiting for a runner reports itself as queued, so both are listed.
          for status in in_progress queued; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100" --jq '.workflow_runs[].id'
          done | sort -u |
            while read -r id; do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                --jq "[.jobs[] | select(.status == \"in_progress\" and (.labels | index(\"fork-ci\")) and .runner_name != \"$RUNNER_NAME\")] | length"
            done | awk '{ s += $1 } END { print s + 0 }'
          SH
          active="bash $RUNNER_TEMP/active.sh"
          # A run waits for the 1-minute load average to fall to 8 (a run with --cores 2 alone keeps it
          # near 5), and one that overlapped a higher load or another job is repeated.
          only='${{ inputs.runs || '.*' }}'
          run() {  # --name NAME ...
            [[ $2 =~ ^($only)$ ]] || { echo "$2: not selected"; return 0; }
            python3 "$GITHUB_WORKSPACE/$SCRIPT" run --dafny "$D" --out "$out" --active-cmd "$active" \
              --max-load 8 --load-wait '${{ inputs.wait || '600' }}' "$@"
          }
          case "${{ matrix.corpus }}" in
          std)
            cd Source/DafnyStandardLibraries
            run --name std-resolve-t0 --reps 3 -- resolve src/Std/dfyconfig.toml
            run --name std-resolve-t4 --reps 3 -- resolve src/Std/dfyconfig.toml --resolution-threads 2
            # As the Standard library CI job verifies the library (std-verdicts.py), no solver.
            # shellcheck disable=SC2086
            run --name std-verify-noop-t4 --warmup 0 --reps 2 -- verify src/Std/dfyconfig.toml \
              --resolution-threads 2 --cores 2 --verification-time-limit 0 --solver-path "$Z3" $NOOP
            # shellcheck disable=SC2086
            run --name std-verify-noop-t0 --warmup 0 --reps 1 -- verify src/Std/dfyconfig.toml \
              --cores 2 --verification-time-limit 0 --solver-path "$Z3" $NOOP
            # One target-specific part (on the committed Std .doo), as the CI job runs six.
            cd src/Std/TargetSpecific
            # It takes no --boogie options: they must equal those the .doo was built with.
            # shellcheck disable=SC2046
            run --name std-ts-js-verify-noop --reps 3 -- verify dfyconfig.toml $(find . -name '*-js*.dfy' | sort) \
              --cores 2 --verification-time-limit 0 --solver-path "$Z3" --solver-option SOLVER=noop
            ;;
          core)
            # Since https://github.com/erniecohen/dafny/pull/343 the released resolver rejects two reads
            # in DafnyToRustCompiler's constructor of constants whose initializers depend on `this`
            # (https://github.com/erniecohen/dafny/issues/339).  For this measurement only, inline the
            # two initializers there; the resolution work is unchanged up to two expressions.
            f=Source/DafnyCore/Backends/Rust/Dafny-compiler-rust.dfy
            perl -0pi -e 's/FactorPathsOptimization\.apply\(thisFile\)\]/FactorPathsOptimization.apply(if rootType.RootCrate? then R.crate else R.crate.MSel(rootType.moduleName))]/; s/var thisAsSelf := rcNew\(R\.self\.Clone\(\)\);/var thisAsSelf := (if syncType.NoSync? then R.RcPath else R.ArcPath).AsExpr().FSel("new").Apply([R.self.Clone()]);/' "$f"
            git diff --stat --exit-code -- "$f" && { echo "the DafnyCore workaround no longer applies"; exit 1; }
            run --name core-resolve-t0 --reps 3 -- resolve Source/DafnyCore/dfyconfig.toml
            run --name core-resolve-t4 --reps 3 -- resolve Source/DafnyCore/dfyconfig.toml --resolution-threads 2
            ;;
          cedar)
            # Its own sources (not its tests).  The refreshed resolver rejects it (5 errors: receiver type
            # not determined), and --resolution-threads requires it, so legacy and sequential only.
            cd ext/cedar/cedar-dafny
            files=(); while IFS= read -r f; do files+=("$f"); done < <(find def thm validation difftest -name '*.dfy' | sort)
            run --name cedar-resolve --reps 3 -- resolve "${files[@]}"
            # shellcheck disable=SC2086
            run --name cedar-verify-noop --warmup 0 --reps 2 -- verify "${files[@]}" \
              --cores 2 --solver-path "$Z3" $NOOP
            ;;
          evm)
            # Its Gradle build's Dafny 4 flags.  The refreshed resolver rejects it (2 errors: u8/u256
            # element types), and --resolution-threads requires it, so legacy and sequential only.
            cd ext/evm
            files=(); while IFS= read -r f; do files+=("$f"); done < <(find src/dafny -name '*.dfy' | sort)
            flags=(--function-syntax 4 --quantifier-syntax 4 --allow-warnings)
            run --name evm-resolve --reps 3 -- resolve "${files[@]}" "${flags[@]}"
            # shellcheck disable=SC2086
            run --name evm-verify-noop --warmup 0 --reps 2 -- verify "${files[@]}" "${flags[@]}" \
              --cores 2 --solver-path "$Z3" $NOOP
            ;;
          esac
      - name: Job summary
        if: always()
        timeout-minutes: 300
        run: |
          {
            echo "Runner $RUNNER_NAME: $(sysctl -n hw.ncpu) processors ($(for l in 0 1; do printf '%s %s; ' "$(sysctl -n hw.perflevel$l.physicalcpu 2>/dev/null)" "$(sysctl -n hw.perflevel$l.name 2>/dev/null)"; done)), $(( $(sysctl -n hw.memsize) / 1073741824 )) GB memory; Dafny $RELEASE; Z3 5.1.0."
            cat corpora.txt 2>/dev/null || true
            python3 "$SCRIPT" analyze "results/${{ matrix.corpus }}" --out report.md > /dev/null && cat report.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cache-payoff-${{ matrix.corpus }}
          path: results
          retention-days: 30
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  analyze:
    needs: measure
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && (always()) }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 360
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 360
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@6ad8147ae6d2f8dbab0db951e461d649a0997cd9
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cache-payoff-*
          path: all
      - name: Analyze
        timeout-minutes: 360
        run: |
          python3 "$SCRIPT" analyze all --out report.md --json report.json > /dev/null
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cache-payoff-report
          path: |
            report.md
            report.json
          retention-days: 30
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac
