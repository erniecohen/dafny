name: Issue 211 modular-termination census

# Counts, for https://github.com/erniecohen/dafny/issues/211 (milestone M1), the calls that
# need the smaller-bound rule of --modular-termination, in the integration tests and in the
# standard library.  Resolution only; no solver.  It records the counts in the job summary and
# an artifact, and exits 0.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['review/**']
    paths:
      - '.github/review/modular-termination-census.py'
      - '.github/workflows/issue211-census.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_PROCESSOR_COUNT: '2'
  DOTNET_NOLOGO: 'true'
  # Self-hosted runners: no build process outlives the job (MSBuild nodes, Gradle daemons).
  MSBUILDDISABLENODEREUSE: '1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  census:
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && ((github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'erniecohen/dafny')))) }}
    runs-on: [self-hosted, macOS, ARM64, mac-studio]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 120
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 120
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@49f32698673db4858b4433a87e93df553aca013f
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Boogie packages
        timeout-minutes: 120
        run: sh Scripts/fetch-boogie-packages.sh
      - name: Build
        timeout-minutes: 120
        run: dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:GeneratePackageOnBuild=false
      - name: Census of the integration tests
        timeout-minutes: 120
        run: |
          python3 .github/review/modular-termination-census.py "$PWD/out/dafny/Dafny.dll" lit \
            Source/IntegrationTests/TestFiles/LitTests/LitTest census/lit > census-lit.log 2>&1 || true
          tee -a "$GITHUB_STEP_SUMMARY" < census/lit/census.md || tail -50 census-lit.log >> "$GITHUB_STEP_SUMMARY"
      - name: Census of the standard library
        timeout-minutes: 120
        run: |
          python3 .github/review/modular-termination-census.py "$PWD/out/dafny/Dafny.dll" project \
            Source/DafnyStandardLibraries/src/Std/dfyconfig.toml census/std > census-std.log 2>&1 || true
          tee -a "$GITHUB_STEP_SUMMARY" < census/std/census.md || tail -50 census-std.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue211-census
          path: |
            census
            census-*.log
          retention-days: 30
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac
