name: Full integration complete registered harness with certified libraries and resource profiles
on:
  push:
    branches: ['scratch/codex/full-main-to-dev-probes']
    paths: ['.github/workflows/full-integration-registered.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registered:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install authorized exact normal-harness solvers
        run: |
          mkdir -p Binaries/z3/bin
          curl -fsSLo z3-5.1.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3-5.1.zip' | sha256sum -c -
          unzip -q z3-5.1.zip
          cp z3-5.1.0-x64-glibc-2.39/bin/z3 Binaries/z3/bin/z3-5.1.0
          for v in 4.16.0 4.12.1; do
            curl -fsSLo z3-$v.zip https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-$v-x64-ubuntu-24.04-bin.zip
            case $v in
              4.16.0) sha=87de9c9e86c877abfccb00cf24b946c4a1bda7b9cba6f363ea58311d2573c320 ;;
              4.12.1) sha=e07d4193d8e1851114fe4d507332a43576639f4aeaa33c7df15c36426d3cbf3b ;;
            esac
            echo "$sha  z3-$v.zip" | sha256sum -c -
            unzip -q z3-$v.zip -d Binaries/z3/bin
          done
          chmod +x Binaries/z3/bin/z3-*
      - name: Record every actual complete registered harness outcome
        env:
          DAFNY_INTEGRATION_TESTS_ONLY_COMPILERS: cs
        run: python3 .github/review/full-integration-registered.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-complete-registered
          path: out/registered-evidence
          retention-days: 30
