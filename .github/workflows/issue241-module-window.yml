# Evidence for --verification-module-window (issue 241, cause 1), recorded, not gated:
# every job writes its measurements and comparisons to its summary and artifacts and
# exits 0, as AGENTS.md asks of probe workflows.  .github/review/issue241-module-window.py
# says what is measured and compared.
#
# - time:   the standard library (src/Std/dfyconfig.toml) and its examples, at K and at
#           K = 1 on the same runner, for K in 1, 2, 4, 8, 16, under DOTNET_gcServer 0 and 1;
# - smt:    the standard library at K = 1, 2, 4, 8 with each task's SMT stream hashed;
# - corpus: the programs of the verifier suite that declare two or more modules, at
#           K = 1, 4, 16, each with its SMT streams hashed;
# - report: each run against K = 1, and the timing tables.
name: Issue 241 module window evidence
on:
  push:
    branches: ['scratch/issue241/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_PROCESSOR_COUNT: '2'
  DOTNET_NOLOGO: 'true'
  # Self-hosted runners: no build process outlives the job (MSBuild nodes, Gradle daemons).
  MSBUILDDISABLENODEREUSE: '1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  Z3_ZIP: https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-arm64-osx-13.3.zip
  Z3_SHA256: 81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db
  Z3_DIR: z3-5.1.0-arm64-osx-13.3
  SCRIPT: .github/review/issue241-module-window.py

jobs:
  build:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 60
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@d29ade2d1be8c8ec371abf1e605743600e67be0e
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - name: Build
        timeout-minutes: 60
        run: |
          sh Scripts/fetch-boogie-packages.sh
          dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:GeneratePackageOnBuild=false
          tar -C out -czf dafny.tar.gz dafny
      - uses: actions/upload-artifact@v4
        with:
          name: issue241-dafny
          path: dafny.tar.gz
          retention-days: 14
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  time:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: build
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        k: [1, 2, 4, 8, 16]
        gc: [0, 1]
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 360
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 360
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@d29ade2d1be8c8ec371abf1e605743600e67be0e
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: issue241-dafny
      - name: Dafny and Z3
        timeout-minutes: 360
        run: |
          mkdir -p out && tar -C out -xzf dafny.tar.gz
          curl -fsSLo z3.zip "$Z3_ZIP" && echo "$Z3_SHA256  z3.zip" | shasum -a 256 -c - && unzip -q z3.zip
          echo "Z3=$PWD/$Z3_DIR/bin/z3" >> "$GITHUB_ENV"
          echo "DAFNY=$PWD/out/dafny/Dafny" >> "$GITHUB_ENV"
          sysctl -n hw.logicalcpu hw.memsize
      # K = 1 and K on the same runner, so that their ratio is not a difference between machines.
      - name: Standard library and examples, at K = 1 and at K
        timeout-minutes: 360
        run: |
          L=Source/DafnyStandardLibraries
          for project in std examples; do
            if [ $project = std ]; then cwd=$L; arg=src/Std/dfyconfig.toml; else cwd=$L/examples; arg=dfyconfig.toml; fi
            for k in 1 ${{ matrix.k }}; do
              d=runs/$project-gc${{ matrix.gc }}-k$k
              [ -e "$d" ] && d=$d-again
              python3 "$SCRIPT" run "$d" "$DAFNY" "$Z3" "$cwd" $k --cores 2 --gc ${{ matrix.gc }} -- $arg || true
            done
          done
          python3 "$SCRIPT" table runs/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-time-k${{ matrix.k }}-gc${{ matrix.gc }}
          path: runs
          retention-days: 90
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  smt:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: build
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        k: [1, 2, 4, 8]
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 360
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 360
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@d29ade2d1be8c8ec371abf1e605743600e67be0e
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: issue241-dafny
      - name: Dafny and Z3
        timeout-minutes: 360
        run: |
          mkdir -p out && tar -C out -xzf dafny.tar.gz
          curl -fsSLo z3.zip "$Z3_ZIP" && echo "$Z3_SHA256  z3.zip" | shasum -a 256 -c - && unzip -q z3.zip
          echo "Z3=$PWD/$Z3_DIR/bin/z3" >> "$GITHUB_ENV"
          echo "DAFNY=$PWD/out/dafny/Dafny" >> "$GITHUB_ENV"
          # The SMT streams of the whole library go to the larger disk.
          mkdir -p "$TMPDIR/issue241"
          df -h "$TMPDIR"
      - name: Standard library with SMT streams
        timeout-minutes: 360
        run: |
          python3 "$SCRIPT" run "$TMPDIR/issue241"/std-smt-k${{ matrix.k }} "$DAFNY" "$Z3" \
            Source/DafnyStandardLibraries ${{ matrix.k }} --cores 2 --smt -- src/Std/dfyconfig.toml || true
          mkdir -p runs && cp -r "$TMPDIR/issue241"/std-smt-k${{ matrix.k }} runs/
          df -h "$TMPDIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-smt-k${{ matrix.k }}
          path: runs
          retention-days: 90
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  corpus:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: build
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 360
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 360
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@d29ade2d1be8c8ec371abf1e605743600e67be0e
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: issue241-dafny
      - name: Dafny and Z3
        timeout-minutes: 360
        run: |
          mkdir -p out && tar -C out -xzf dafny.tar.gz
          curl -fsSLo z3.zip "$Z3_ZIP" && echo "$Z3_SHA256  z3.zip" | shasum -a 256 -c - && unzip -q z3.zip
          echo "Z3=$PWD/$Z3_DIR/bin/z3" >> "$GITHUB_ENV"
          echo "DAFNY=$PWD/out/dafny/Dafny" >> "$GITHUB_ENV"
      - name: Multi-module programs of the verifier suite at K = 1, 4, 16
        timeout-minutes: 360
        run: |
          L=Source/IntegrationTests/TestFiles/LitTests/LitTest
          python3 .github/review/lit-verdicts.py plan "$L" plan.tsv
          python3 "$SCRIPT" corpus plan.tsv "$L" "$DAFNY" "$Z3" "$PWD/corpus" --cores 2 --ks 1,4,16 \
            --shard ${{ matrix.shard }}/4 || true
          find corpus -name smt -type d -prune -exec rm -rf {} +
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-corpus-${{ matrix.shard }}
          path: corpus
          retention-days: 90
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  report:
    needs: [time, smt, corpus]
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && (always()) }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 30
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 30
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@d29ade2d1be8c8ec371abf1e605743600e67be0e
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: issue241-*-*
          path: artifacts
      - name: Compare and tabulate
        timeout-minutes: 30
        run: |
          # Fails when any K > 1 run differs from K = 1: output, exit code, obligations, RU or SMT streams.
          set +e
          python3 "$SCRIPT" report artifacts report.md
          rc=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue241-report
          path: report.md
          retention-days: 90
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac
