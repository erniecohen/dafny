name: Issue 74 validation
on:
  push:
    branches: ['scratch/issue74/candidate']
  workflow_dispatch:
    inputs:
      comparisons:
        description: Run full suite and source-library comparisons
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_PROCESSOR_COUNT: '2'
  MSBUILDDISABLENODEREUSE: '1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    outputs:
      ready: ${{ steps.build.outputs.ready }}
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 360
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 360
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@292830736b8f612a99bf2271ed796cc5e2e33e10
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS || '2' }}
          min-free-percent: ${{ vars.SELF_HOSTED_JOB_MIN_FREE_PERCENT || '' }}
          max-pressure: ${{ vars.SELF_HOSTED_JOB_MAX_PRESSURE || '' }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - name: Build candidate and merged baseline with fixed Boogie
        id: build
        timeout-minutes: 360
        run: |
          build_one() {
            sh Scripts/fetch-boogie-packages.sh &&
            version=$(sh .github/review/version.sh) && eval "$version" &&
            dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o "$GITHUB_WORKSPACE/out/$1" -p:SourceRevisionId="$revision"
          }
          if build_one candidate > candidate-build.log 2>&1; then
            if dotnet test --settings "$GITHUB_WORKSPACE/.github/review/ci.runsettings" -p:NuGetAudit=false Source/IntegrationTests -c Release --filter FullyQualifiedName~AdditionalAxiomsTranslationTests --logger "console;verbosity=normal" > translation-tests.log 2>&1; then
              echo '0' > translation-tests-exit.txt
            else
              echo "$?" > translation-tests-exit.txt
            fi
            git fetch --no-tags --refmap= --depth=1 origin edff862a3da391fe2f0142343a5846edf078b2ed
            git worktree add baseline edff862a3da391fe2f0142343a5846edf078b2ed
            if (cd baseline && build_one baseline) > baseline-build.log 2>&1; then
              printf '%s\n' "$GITHUB_SHA" > out/candidate-source.txt
              tar -C out -czf builds.tar.gz baseline candidate candidate-source.txt
              echo 'ready=true' >> "$GITHUB_OUTPUT"
            fi
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: issue74-builds
          path: |
            builds.tar.gz
            *-build.log
            translation-tests*
          retention-days: 14
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  targeted:
    needs: build
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && (needs.build.outputs.ready == 'true') }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        solver: ['4.12.1', '5.1.0']
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 360
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 360
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@292830736b8f612a99bf2271ed796cc5e2e33e10
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS || '2' }}
          min-free-percent: ${{ vars.SELF_HOSTED_JOB_MIN_FREE_PERCENT || '' }}
          max-pressure: ${{ vars.SELF_HOSTED_JOB_MAX_PRESSURE || '' }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: issue74-builds
          path: build-artifact
      - name: Unpack and pin solver
        timeout-minutes: 360
        run: |
          mkdir out && tar -C out -xzf build-artifact/builds.tar.gz
          if [ '${{ matrix.solver }}' = 5.1.0 ]; then
            curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-arm64-osx-13.3.zip
            echo '81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db  z3.zip' | shasum -a 256 -c -
            unzip -q z3.zip
            echo "Z3=$PWD/z3-5.1.0-arm64-osx-13.3/bin/z3" >> "$GITHUB_ENV"
          else
            curl -fsSLo z3.zip https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-4.12.1-arm64-macos-15-bin.zip
            echo '5941a521e8868db9b57ed81d1cc0cc408b37e55443087bcb6eb207583b47183f  z3.zip' | shasum -a 256 -c -
            mkdir z3h && unzip -q z3.zip -d z3h
            echo "Z3=$PWD/z3h/z3-4.12.1" >> "$GITHUB_ENV"
          fi
      - name: End-to-end original, literal cases, and controls at 200,000 units
        timeout-minutes: 360
        run: python3 .github/review/issue74-targeted.py --baseline "$PWD/out/baseline/Dafny" --candidate "$PWD/out/candidate/Dafny" --z3 "$Z3" --output results
      - name: Inspect actual original and same-module isolation solver input
        timeout-minutes: 360
        run: python3 .github/review/issue74-smt-audit.py --input results
      - name: Recheck the three suite failures and six library regressions at existing limits
        timeout-minutes: 360
        run: |
          python3 .github/review/issue74-corpus.py --baseline "$PWD/out/baseline/Dafny" --candidate "$PWD/out/candidate/Dafny" --z3 "$Z3" --output results/suite --only dafny4/Ackermann.dfy,dafny4/Lucas-up.dfy,dafny2/SnapshotableTrees.dfy --jobs 2
          python3 .github/review/issue74-library-focused.py --baseline "$PWD/out/baseline/Dafny" --candidate "$PWD/out/candidate/Dafny" --z3 "$Z3" --output results/library
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue74-targeted-${{ matrix.solver }}
          path: results
          retention-days: 90
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  corpus:
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && (inputs.comparisons) }}
    needs: build
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 240
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 240
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@292830736b8f612a99bf2271ed796cc5e2e33e10
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS || '2' }}
          min-free-percent: ${{ vars.SELF_HOSTED_JOB_MIN_FREE_PERCENT || '' }}
          max-pressure: ${{ vars.SELF_HOSTED_JOB_MAX_PRESSURE || '' }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: issue74-builds
          path: build-artifact
      - name: Unpack and pin solver
        timeout-minutes: 240
        run: |
          mkdir out && tar -C out -xzf build-artifact/builds.tar.gz
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-arm64-osx-13.3.zip
          echo '81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db  z3.zip' | shasum -a 256 -c -
          unzip -q z3.zip
      - name: Compare off input and resources and enabled suite against merged baseline
        timeout-minutes: 240
        run: python3 .github/review/issue74-corpus.py --baseline "$PWD/out/baseline/Dafny" --candidate "$PWD/out/candidate/Dafny" --z3 "$PWD/z3-5.1.0-arm64-osx-13.3/bin/z3" --output corpus --shard ${{ matrix.shard }}/4 --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue74-corpus-${{ matrix.shard }}
          path: corpus
          retention-days: 90
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  stdlib:
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && (inputs.comparisons) }}
    needs: build
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        solver: ['4.12.1', '5.1.0']
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 240
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 240
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@292830736b8f612a99bf2271ed796cc5e2e33e10
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS || '2' }}
          min-free-percent: ${{ vars.SELF_HOSTED_JOB_MIN_FREE_PERCENT || '' }}
          max-pressure: ${{ vars.SELF_HOSTED_JOB_MAX_PRESSURE || '' }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/download-artifact@v4
        with:
          name: issue74-builds
          path: build-artifact
      - name: Unpack and pin solver
        timeout-minutes: 240
        run: |
          mkdir out && tar -C out -xzf build-artifact/builds.tar.gz
          if [ '${{ matrix.solver }}' = 5.1.0 ]; then
            curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-arm64-osx-13.3.zip
            echo '81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db  z3.zip' | shasum -a 256 -c -
            unzip -q z3.zip
            echo "Z3=$PWD/z3-5.1.0-arm64-osx-13.3/bin/z3" >> "$GITHUB_ENV"
          else
            curl -fsSLo z3.zip https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-4.12.1-arm64-macos-15-bin.zip
            echo '5941a521e8868db9b57ed81d1cc0cc408b37e55443087bcb6eb207583b47183f  z3.zip' | shasum -a 256 -c -
            mkdir z3h && unzip -q z3.zip -d z3h
            echo "Z3=$PWD/z3h/z3-4.12.1" >> "$GITHUB_ENV"
          fi
      - name: Compare source library outcomes and costs with repeat controls
        timeout-minutes: 240
        run: |
          python3 .github/review/issue74-stdlib.py --baseline "$PWD/out/baseline/Dafny" --candidate "$PWD/out/candidate/Dafny" --z3 "$Z3" --output stdlib
          python3 .github/review/issue33-translation.py --baseline "$PWD/out/baseline/Dafny" --candidate "$PWD/out/candidate/Dafny" --output translation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue74-stdlib-${{ matrix.solver }}
          path: |
            stdlib
            translation
          retention-days: 90
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac
