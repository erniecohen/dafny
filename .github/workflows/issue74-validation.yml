name: Issue 74 validation
on:
  push:
    branches: ['scratch/issue74/candidate']
  workflow_dispatch:
    inputs:
      comparisons:
        description: Run full suite and source-library comparisons
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.build.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build candidate and merged baseline with fixed Boogie
        id: build
        run: |
          build_one() {
            sh Scripts/fetch-boogie-packages.sh &&
            version=$(sh .github/review/version.sh) && eval "$version" &&
            dotnet publish Source/Dafny/Dafny.csproj -c Release -o "$GITHUB_WORKSPACE/out/$1" -p:SourceRevisionId="$revision"
          }
          if build_one candidate > candidate-build.log 2>&1; then
            if dotnet test Source/IntegrationTests -c Release --filter FullyQualifiedName~AdditionalAxiomsTranslationTests --logger "console;verbosity=normal" > translation-tests.log 2>&1; then
              echo '0' > translation-tests-exit.txt
            else
              echo "$?" > translation-tests-exit.txt
            fi
            git fetch --no-tags --depth=1 origin edff862a3da391fe2f0142343a5846edf078b2ed
            git worktree add baseline edff862a3da391fe2f0142343a5846edf078b2ed
            if (cd baseline && build_one baseline) > baseline-build.log 2>&1; then
              tar -C out -czf builds.tar.gz baseline candidate
              echo 'ready=true' >> "$GITHUB_OUTPUT"
            fi
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: issue74-builds
          path: |
            builds.tar.gz
            *-build.log
            translation-tests*
          retention-days: 14
  targeted:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        solver: ['4.12.1', '5.1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: issue74-builds
          path: build-artifact
      - name: Unpack and pin solver
        run: |
          mkdir out && tar -C out -xzf build-artifact/builds.tar.gz
          if [ '${{ matrix.solver }}' = 5.1.0 ]; then
            curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
            echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
            unzip -q z3.zip
            echo "Z3=$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" >> "$GITHUB_ENV"
          else
            curl -fsSLo z3.zip https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-4.12.1-x64-ubuntu-24.04-bin.zip
            echo 'e07d4193d8e1851114fe4d507332a43576639f4aeaa33c7df15c36426d3cbf3b  z3.zip' | sha256sum -c -
            mkdir z3h && unzip -q z3.zip -d z3h
            echo "Z3=$PWD/z3h/z3-4.12.1" >> "$GITHUB_ENV"
          fi
      - name: End-to-end original, literal cases, and controls at 200,000 units
        run: python3 .github/review/issue74-targeted.py --baseline "$PWD/out/baseline/Dafny" --candidate "$PWD/out/candidate/Dafny" --z3 "$Z3" --output results
      - name: Recheck the three suite failures and six library regressions at existing limits
        run: |
          python3 .github/review/issue74-corpus.py --baseline "$PWD/out/baseline/Dafny" --candidate "$PWD/out/candidate/Dafny" --z3 "$Z3" --output results/suite --only dafny4/Ackermann.dfy,dafny4/Lucas-up.dfy,dafny2/SnapshotableTrees.dfy --jobs 2
          python3 .github/review/issue74-library-focused.py --baseline "$PWD/out/baseline/Dafny" --candidate "$PWD/out/candidate/Dafny" --z3 "$Z3" --output results/library
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue74-targeted-${{ matrix.solver }}
          path: results
          retention-days: 90
  corpus:
    if: inputs.comparisons
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: issue74-builds
          path: build-artifact
      - name: Unpack and pin solver
        run: |
          mkdir out && tar -C out -xzf build-artifact/builds.tar.gz
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          unzip -q z3.zip
      - name: Compare off input and resources and enabled suite against merged baseline
        run: python3 .github/review/issue74-corpus.py --baseline "$PWD/out/baseline/Dafny" --candidate "$PWD/out/candidate/Dafny" --z3 "$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" --output corpus --shard ${{ matrix.shard }}/4 --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue74-corpus-${{ matrix.shard }}
          path: corpus
          retention-days: 90
  stdlib:
    if: inputs.comparisons
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        solver: ['4.12.1', '5.1.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: issue74-builds
          path: build-artifact
      - name: Unpack and pin solver
        run: |
          mkdir out && tar -C out -xzf build-artifact/builds.tar.gz
          if [ '${{ matrix.solver }}' = 5.1.0 ]; then
            curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
            echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
            unzip -q z3.zip
            echo "Z3=$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" >> "$GITHUB_ENV"
          else
            curl -fsSLo z3.zip https://github.com/dafny-lang/solver-builds/releases/download/snapshot-2026-04-03/z3-4.12.1-x64-ubuntu-24.04-bin.zip
            echo 'e07d4193d8e1851114fe4d507332a43576639f4aeaa33c7df15c36426d3cbf3b  z3.zip' | sha256sum -c -
            mkdir z3h && unzip -q z3.zip -d z3h
            echo "Z3=$PWD/z3h/z3-4.12.1" >> "$GITHUB_ENV"
          fi
      - name: Compare source library outcomes and costs with repeat controls
        run: |
          python3 .github/review/issue74-stdlib.py --baseline "$PWD/out/baseline/Dafny" --candidate "$PWD/out/candidate/Dafny" --z3 "$Z3" --output stdlib
          python3 .github/review/issue33-translation.py --baseline "$PWD/out/baseline/Dafny" --candidate "$PWD/out/candidate/Dafny" --output translation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue74-stdlib-${{ matrix.solver }}
          path: |
            stdlib
            translation
          retention-days: 90
