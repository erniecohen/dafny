name: Operators M1 probe
on:
  push:
    branches: ['codex/194-operators-m1']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  DOTNET_PROCESSOR_COUNT: '2'
  MSBUILDDISABLENODEREUSE: '1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  probe:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 60
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@d29ade2d1be8c8ec371abf1e605743600e67be0e
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and focused checks (record expected development failures)
        shell: bash
        timeout-minutes: 60
        run: |
          mkdir -p out/operators
          curl -fsSLo out/operators/z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-arm64-osx-13.3.zip
          echo '81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db  out/operators/z3.zip' | shasum -a 256 -c -
          unzip -q out/operators/z3.zip -d out/operators
          export DAFNY_OPERATORS_Z3="$PWD/out/operators/z3-5.1.0-arm64-osx-13.3/bin/z3"
          chmod +x "$DAFNY_OPERATORS_Z3"
          mkdir -p Binaries/z3/bin
          cp "$DAFNY_OPERATORS_Z3" Binaries/z3/bin/z3-5.1.0
          set +e
          sh Scripts/fetch-boogie-packages.sh > out/operators/packages.log 2>&1
          dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:GeneratePackageOnBuild=false > out/operators/build.log 2>&1
          result=$?
          echo "$result" > out/operators/build.exit
          grep -E ' error |Error\(s\)|Warning\(s\)|Build succeeded' out/operators/build.log || true
          if [ "$result" = 0 ] && [ -f .github/review/operators-m1.py ]; then
            python3 .github/review/operators-m1.py "$PWD/out/dafny/Dafny" "$PWD/out/operators" > out/operators/checks.log 2>&1
            echo "$?" > out/operators/checks.exit
            tail -60 out/operators/checks.log
            dotnet test --settings "$GITHUB_WORKSPACE/.github/review/ci.runsettings" -p:NuGetAudit=false Source/DafnyCore.Test/DafnyCore.Test.csproj -c Release --filter FullyQualifiedName~OperatorSelectionTests --logger "trx;LogFileName=operators.trx" --results-directory "$PWD/out/operators/core-tests" > out/operators/core-tests.log 2>&1
            echo "$?" > out/operators/core-tests.exit
            tail -40 out/operators/core-tests.log
            dotnet test --settings "$GITHUB_WORKSPACE/.github/review/ci.runsettings" -p:NuGetAudit=false Source/DafnyLanguageServer.Test/DafnyLanguageServer.Test.csproj -c Release --filter 'FullyQualifiedName~OperatorSymbolsAreReferencesButAreNeverRenamed|FullyQualifiedName~OperatorHoverDistinguishesRankFromAnOrdinaryFallbackCall' --logger "trx;LogFileName=operators.trx" --results-directory "$PWD/out/operators/rename-tests" > out/operators/rename-tests.log 2>&1
            echo "$?" > out/operators/rename-tests.exit
            tail -40 out/operators/rename-tests.log
            dotnet test --settings "$GITHUB_WORKSPACE/.github/review/ci.runsettings" -p:NuGetAudit=false Source/IntegrationTests -c Release --filter 'DisplayName~git-issues/github-issue-194.dfy' --logger "trx;LogFileName=operators.trx" --results-directory "$PWD/out/operators/lit-tests" > out/operators/lit-tests.log 2>&1
            echo "$?" > out/operators/lit-tests.exit
            tail -40 out/operators/lit-tests.log
          fi
          echo 'Development probe: retained exit files and logs are authoritative; this workflow records failures without notifying the owner.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operators-m1-probe
          path: |
            out/operators/*.log
            out/operators/*.exit
            out/operators/results.json
            out/operators/**/stdout.txt
            out/operators/**/stderr.txt
            out/operators/**/command.json
            out/operators/**/*.bpl
            out/operators/**/verification.json
            out/operators/core-tests
            out/operators/rename-tests
            out/operators/lit-tests
          retention-days: 14
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  disabled-compatibility:
    if: contains(github.event.head_commit.message, '[off-gates]')
    uses: ./.github/workflows/operators-m1-off.yml
    with:
      probe: true
