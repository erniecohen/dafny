# A standing record of the resource-count variation the stdlib gate cannot see (#30).
#
# review.yml verifies the standard library with /restartProver, a fresh solver process
# per proof batch, so that its resource fingerprint is the same in every run.  A user's
# run reuses solver processes, and under Z3 5.1.0 a batch's count can then depend on
# the batches that process checked before it.  This workflow verifies the library as a
# user would (Z3 5.1.0, --cores 2, no /restartProver), three times serially, and
# reports the number of distinct count vectors and each declaration that differs, with
# its spread and its distance to the limit (.github/review/process-history.py).
#
# It records only: no expected file, no gate, and it never fails on a difference.
name: process-history

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_PROCESSOR_COUNT: '2'
  DOTNET_NOLOGO: 'true'
  # Self-hosted runners: no build process outlives the job (MSBuild nodes, Gradle daemons).
  MSBUILDDISABLENODEREUSE: '1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # As in review.yml.
  Z3_RELEASE: https://github.com/Z3Prover/z3/releases/download/z3-5.1.0
  Z3_MACOS_ARM64: z3-5.1.0-arm64-osx-13.3
  Z3_MACOS_ARM64_SHA256: 81d29e934fd863079a74af35eecaeaef8047e0e12414d33ca322b358d68383db

jobs:
  build:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'schedule') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    name: Build (Release)
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 60
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@79f4d807c404b0c92adfd76fdbca7f9e8153b460
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - name: Boogie packages
        timeout-minutes: 60
        run: sh Scripts/fetch-boogie-packages.sh
      - name: Build
        timeout-minutes: 60
        run: |
          dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o out/dafny \
            -p:GeneratePackageOnBuild=false -p:SourceRevisionId="$(git rev-parse --short=8 HEAD)"
          tar -C out -czf dafny.tar.gz dafny
      - uses: ./.github/actions/host-artifact
        with:
          mode: put
          retention-days: 7
          name: dafny
          path: dafny.tar.gz
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  verify:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'schedule') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    name: Standard library without /restartProver (run ${{ matrix.run }})
    needs: build
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        run: [1, 2, 3]
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 180
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 180
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@79f4d807c404b0c92adfd76fdbca7f9e8153b460
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/host-artifact
        with:
          mode: get
          name: dafny
      - name: Unpack Dafny and Z3
        timeout-minutes: 180
        run: |
          mkdir -p out && tar -C out -xzf dafny.tar.gz
          curl -fsSLo z3.zip "$Z3_RELEASE/$Z3_MACOS_ARM64.zip"
          echo "$Z3_MACOS_ARM64_SHA256  z3.zip" | shasum -a 256 -c -
          unzip -q z3.zip && chmod +x "$Z3_MACOS_ARM64/bin/z3"
      - name: Verify
        timeout-minutes: 180
        run: |
          python3 .github/review/std-verdicts.py run Source/DafnyStandardLibraries "$PWD/out/dafny/Dafny" \
            "$PWD/$Z3_MACOS_ARM64/bin/z3" std-verdicts.tsv --cores 2 --additional-axioms false \
            --boogie "/deterministicLiteralHashes:1"
          rfp=$(awk -F'\t' '$1 !~ /^run /{print $1"\t"$5"\t"$6}' std-verdicts.tsv | shasum -a 256 | cut -c1-16)
          echo "resource fingerprint $rfp"
      - uses: actions/upload-artifact@v4
        with:
          name: std-verdicts-${{ matrix.run }}
          path: std-verdicts.tsv
          retention-days: 90
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac

  compare:
    if: ${{ github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'schedule') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    name: Compare the runs
    needs: verify
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 10
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 10
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@79f4d807c404b0c92adfd76fdbca7f9e8153b460
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS }}
          reserve-mb: ${{ vars.SELF_HOSTED_JOB_RESERVE_MB }}
          default-peak-mb: ${{ vars.SELF_HOSTED_JOB_DEFAULT_PEAK_MB }}
          peak-min-samples: ${{ vars.SELF_HOSTED_JOB_PEAK_MIN_SAMPLES }}
          peak-history-days: ${{ vars.SELF_HOSTED_JOB_PEAK_HISTORY_DAYS }}
          probe-timeout-s: ${{ vars.SELF_HOSTED_JOB_PROBE_TIMEOUT_S }}
          slot-poll-s: ${{ vars.SELF_HOSTED_JOB_SLOT_POLL_S }}
          memory-backoff-s: ${{ vars.SELF_HOSTED_JOB_MEMORY_BACKOFF_S }}
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: std-verdicts-*
      - name: Report
        timeout-minutes: 10
        run: |
          {
            echo "## Standard library, Z3 5.1.0, axioms off, without /restartProver"
            echo
            python3 .github/review/process-history.py std-verdicts-*/std-verdicts.tsv
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac
