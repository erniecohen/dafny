name: Resolution reuse candidate probes
on:
  push:
    branches: ['scratch/codex/resolve-once']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: resolution-reuse-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build candidate and record compilation diagnostics
        run: |
          mkdir -p candidate-results
          set +e
          sh Scripts/fetch-boogie-packages.sh > candidate-results/packages.log 2>&1
          echo "packages=$?" >> candidate-results/status.txt
          dotnet publish Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:GeneratePackageOnBuild=false > candidate-results/build.log 2>&1
          echo "build=$?" >> candidate-results/status.txt
          dotnet build Source/IntegrationTests -c Release > candidate-results/test-build.log 2>&1
          echo "test-build=$?" >> candidate-results/status.txt
          cat candidate-results/status.txt >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Pinned solver
        run: |
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          unzip -q z3.zip
          echo "Z3=$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" >> "$GITHUB_ENV"
      - name: Record batch API tests and generic controls
        run: |
          set +e
          dotnet test Source/IntegrationTests -c Release --no-build --filter FullyQualifiedName~VerificationBatchTests --logger 'console;verbosity=normal' > candidate-results/api-tests.log 2>&1
          echo "api-tests=$?" >> candidate-results/status.txt
          python3 .github/review/verification-batch-controls.py "$PWD/out/dafny/Dafny" "$Z3" candidate-results/controls > candidate-results/controls.log 2>&1
          echo "controls=$?" >> candidate-results/status.txt
          cat candidate-results/status.txt >> "$GITHUB_STEP_SUMMARY"
          cat candidate-results/controls/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolution-reuse-candidate
          path: candidate-results
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolution-reuse-candidate-binary
          path: out/dafny
          retention-days: 14
