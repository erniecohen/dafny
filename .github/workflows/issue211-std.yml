name: Certified standard-library core
# Milestones M5a and M5b of https://github.com/erniecohen/dafny/issues/211: build the certified core of the
# standard library with Z3 5.1.0, and the expanded core with the named trust lists.
# Produce the checked catalog, then validate its clients, embedding and compilation.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['review/**']
    paths:
      - 'Source/DafnyStandardLibraries/**'
      - 'Source/DafnyCore/**'
      - 'Source/DafnyPipeline/**'
      - 'Source/DafnyDriver/**'
      - '.github/review/modular-termination-std.py'
      - '.github/review/modular-termination-checked-std.py'
      - '.github/review/modular-termination-catalog.py'
      - '.github/review/catalog_erasure.py'
      - '.github/review/test_catalog_erasure.py'
      - '.github/workflows/issue211-std.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_PROCESSOR_COUNT: '2'
  MSBUILDDISABLENODEREUSE: '1'
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  core:
    if: ${{ (github.repository == 'erniecohen/dafny' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository))) && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: [self-hosted, macOS, ARM64, fork-ci]
    timeout-minutes: 1440 # Includes waiting for the shared admission slot.
    env:
      DOTNET_PROCESSOR_COUNT: '3'
    steps:
      - name: Yield to interactive work
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 240
        run: |
          case "$(ps -o comm= -p "$PPID")" in
            */Runner.Worker|Runner.Worker) ;;
            *) echo "::error::Expected this job's Runner.Worker parent"; exit 1 ;;
          esac
          renice 10 -p "$PPID" "$$" >/dev/null
          test "$(ps -o nice= -p "$PPID" | tr -d ' ')" = 10
          test "$(ps -o nice= -p "$$" | tr -d ' ')" = 10
      - name: Create job temporary directory
        shell: bash
        timeout-minutes: 240
        run: |
          job_tmp=$(mktemp -d "$RUNNER_TEMP/fork-job.XXXXXX")
          echo "TMPDIR=$job_tmp" >> "$GITHUB_ENV"
      - uses: erniecohen/dafny/.github/actions/self-hosted-job@a8ef9c0acd833e35e6a13f798ac4c17dad9a64e1
        with:
          kind: ci:${{ github.workflow }}
          slots: ${{ vars.SELF_HOSTED_JOB_SLOTS || '2' }}
          min-free-percent: ${{ vars.SELF_HOSTED_JOB_MIN_FREE_PERCENT || '' }}
          max-pressure: ${{ vars.SELF_HOSTED_JOB_MAX_PRESSURE || '' }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
          cache: false
      - name: Install the Go import formatter
        timeout-minutes: 240
        run: go install golang.org/x/tools/cmd/goimports@v0.30.0
      - name: Build Dafny
        timeout-minutes: 240
        run: |
          sh Scripts/fetch-boogie-packages.sh
          dotnet msbuild -p:NuGetAudit=false Source/DafnyCore/DafnyCore.csproj -t:RunCoco -p:Configuration=Release
          dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:GeneratePackageOnBuild=false -p:PathMap="$PWD=/_/"
      - name: Install Z3 5.1.0
        id: z3
        timeout-minutes: 240
        run: echo "path=$(sh .github/review/setup-z3.sh 5.1.0 ci-z3)" >> "$GITHUB_OUTPUT"
      - name: Build the core and the expanded core, and load them into clients
        timeout-minutes: 240
        run: |
          status=0
          python3 .github/review/modular-termination-std.py out/dafny/Dafny '${{ steps.z3.outputs.path }}' \
            std-core-results --cores 3 || status=$?
          cat std-core-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Produce and admit the checked common and target catalog
        timeout-minutes: 240
        run: |
          status=0
          python3 .github/review/modular-termination-checked-std.py out/dafny/Dafny '${{ steps.z3.outputs.path }}' \
            checked-std-results --cores 3 || status=$?
          cat checked-std-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Embed the checked catalog and validate selection and backends
        timeout-minutes: 240
        run: |
          cp out/dafny/DafnyCore.dll checked-catalog-core.dll
          dotnet publish -p:NuGetAudit=false Source/Dafny/Dafny.csproj -c Release -o out/dafny -p:GeneratePackageOnBuild=false -p:PathMap="$PWD=/_/" -p:RequireCheckedStandardLibraries=true
          cmp checked-catalog-core.dll out/dafny/DafnyCore.dll
          status=0
          python3 .github/review/modular-termination-catalog.py out/dafny/Dafny '${{ steps.z3.outputs.path }}' \
            checked-catalog-results || status=$?
          cat checked-catalog-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: std-core-results
          path: |
            std-core-results
            checked-std-results
            checked-catalog-results
          retention-days: 30
      - name: Remove job temporary directory
        if: always()
        shell: bash
        timeout-minutes: 5
        run: |
          case "${TMPDIR:-}" in
            "$RUNNER_TEMP"/fork-job.*) rm -rf "$TMPDIR" ;;
          esac
