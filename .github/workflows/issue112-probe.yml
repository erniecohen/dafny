name: Issue 112 diagnostic probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@v4
        with:
          name: dafny
          run-id: 37209234884
          github-token: ${{ github.token }}
          path: build-artifact
      - name: Unpack build and pin solver
        run: |
          mkdir out
          tar -C out -xzf build-artifact/dafny.tar.gz
          curl -fsSLo z3.zip https://github.com/Z3Prover/z3/releases/download/z3-5.1.0/z3-5.1.0-x64-glibc-2.39.zip
          echo 'f47be8d27d3230e823bf1eeede2fe0abaca55bb78d0b59974370e6689a92284a  z3.zip' | sha256sum -c -
          unzip -q z3.zip
      - name: Record all outcomes
        run: |
          mkdir -p diagnostics
          python3 .github/review/issue112-probe.py "$PWD/z3-5.1.0-x64-glibc-2.39/bin/z3" > diagnostics/report.txt 2>&1 || echo "Probe launcher failed" >> diagnostics/report.txt
          cat diagnostics/report.txt >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: issue112-diagnostics
          path: diagnostics
          retention-days: 90
