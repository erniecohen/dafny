name: Set up fork build SDK
description: Install the isolated .NET build SDK, generated-program runtime and Java build dependency
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-dotnet@v4
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dafny-dotnet
      with:
        dotnet-version: 10.0.x
    - name: Runtime for generated C# programs
      shell: bash
      run: |
        # Transient network failures (curl exit 56, broken pipe) failed jobs before any test ran;
        # retry the script download and the install a bounded number of times.
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
        for attempt in 1 2 3; do
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 8.0 --runtime dotnet --install-dir "$DOTNET_ROOT" --no-path --skip-non-versioned-files && break
          test "$attempt" -lt 3 || exit 1
          echo "dotnet-install attempt $attempt failed; retrying in 10 s"
          sleep 10
        done
    - name: Check SDK and runtime inventory
      shell: bash
      run: |
        dotnet --list-sdks
        dotnet --list-runtimes
        test "$(dotnet --version | cut -d. -f1)" = 10
        test -z "$(dotnet --list-sdks | grep -v '^10\.' || true)"
